<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
 <meta name="theme-color" content="#14283c" />
 <title>Хряки Ферма — Осенняя усадьба</title>
 <script src="https://telegram.org/js/telegram-web-app.js"></script>
 <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 -webkit-user-select: none;
 -webkit-tap-highlight-color: transparent;
 margin: 0;
 padding: 0;
 }

 html, body {
 position: fixed;
 inset: 0;
 width: 100%;
 width: 100vw;
 height: 100%;
 height: 100vh;
 height: 100dvh;
 overflow: hidden;
 background: #14283c;
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-weight: 600;
 color: #2e1a0c;
 touch-action: none;
 }

 button, input, select {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 border-radius: 0px !important;
 }

 canvas, img.px-ico, img.px-ico-sm {
 image-rendering: pixelated;
 image-rendering: crisp-edges;
 }

 img.px-ico {
 width: 18px;
 height: 18px;
 vertical-align: middle;
 display: inline-block;
 flex-shrink: 0;
 }

 img.px-ico-sm {
 width: 14px;
 height: 14px;
 vertical-align: middle;
 display: inline-block;
 flex-shrink: 0;
 }

 #gameCanvas {
 position: fixed;
 inset: 0;
 display: block;
 width: 100%;
 width: 100vw;
 height: 100%;
 height: 100vh;
 height: 100dvh;
 background: #14283c;
 touch-action: none;
 image-rendering: pixelated;
 image-rendering: crisp-edges;
 }

 /* Деревянные таблички навигации по локациям */
 #locationNavStrip {
 position: fixed;
 left: 10px;
 top: 52px;
 right: 138px;
 display: flex;
 align-items: center;
 gap: 6px;
 overflow-x: auto;
 overflow-y: hidden;
 white-space: nowrap;
 padding: 2px 4px 6px 2px;
 z-index: 60;
 scrollbar-width: none;
 -ms-overflow-style: none;
 -webkit-overflow-scrolling: touch;
 touch-action: pan-x;
 }

 #locationNavStrip::-webkit-scrollbar {
 display: none;
 }

 .loc-nav-btn {
 flex: 0 0 auto;
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-weight: 700;
 font-size: 12px;
 letter-spacing: 0.1px;
 color: #fff8e7;
 text-shadow: 1px 2px 0 #2e1a0c;
 background: #8c5228;
 border: 3px solid #59361c;
 border-radius: 0px;
 box-shadow: 2px 2px 0 #2e1a0c, inset 0 2px 0 #b06e3b;
 padding: 4px 7px;
 cursor: pointer;
 white-space: nowrap;
 display: inline-flex;
 align-items: center;
 gap: 4px;
 transition: transform 0.05s steps(1), box-shadow 0.05s steps(1);
 }

 .loc-nav-btn:active {
 transform: translate(2px, 2px);
 box-shadow: 1px 1px 0 #2e1a0c;
 }

 .loc-nav-btn.loc-warm {
 background: #b5651d;
 box-shadow: 3px 3px 0 #2e1a0c, inset 0 2px 0 #d9822b;
 }

 .loc-nav-btn.loc-green {
 background: #4e7a34;
 box-shadow: 3px 3px 0 #2e1a0c, inset 0 2px 0 #6ca14b;
 }

 .loc-nav-btn.loc-locked {
 background: #635142;
 color: #cbbba8;
 box-shadow: 3px 3px 0 #2e1a0c, inset 0 2px 0 #7d6755;
 }

 /* Оверлеи модальных окон (без blur для плавных 60 FPS на Android) */
 #shopModal, .game-modal {
 position: fixed;
 inset: 0;
 background: rgba(24, 14, 7, 0.74);
 display: none;
 align-items: center;
 justify-content: center;
 z-index: 105;
 padding: calc(10px + var(--tg-content-top, 0px)) 10px 10px 10px;
 touch-action: auto;
 }

 #shopModal.active, .game-modal.active {
 display: flex;
 }

 /* Пергаментное окно с деревянной рамкой в духе Stardew Valley */
 .shop-window {
 width: 100%;
 max-width: 448px;
 max-height: 86vh;
 background: #f4dcb8;
 border: 3px solid #59361c;
 border-radius: 0px;
 box-shadow:
 4px 4px 0 #2e1a0c,
 inset 0 0 0 3px #e3c291;
 display: flex;
 flex-direction: column;
 overflow: hidden;
 animation: pixelPopIn 0.14s steps(3);
 }

 @keyframes pixelPopIn {
 0% { transform: scale(0.92); opacity: 0; }
 100% { transform: scale(1); opacity: 1; }
 }

 .shop-header {
 position: relative;
 background: #8c5228;
 border-bottom: 3px solid #59361c;
 padding: 10px 12px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 6px;
 box-shadow: inset 0 3px 0 #ad6b39;
 }

 .shop-title-wrap {
 display: flex;
 align-items: center;
 gap: 8px;
 min-width: 0;
 }

 .shop-title {
 font-family: 'Press Start 2P', monospace;
 font-size: clamp(9.5px, 2.8vw, 11.5px);
 font-weight: 400;
 color: #fff6df;
 text-shadow: 2px 2px 0 #2e1a0c;
 letter-spacing: 0.2px;
 line-height: 1.3;
 white-space: nowrap;
 overflow: hidden;
 text-overflow: ellipsis;
 }

 .shop-balance {
 background: #f4dcb8;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 4px 8px 4px 6px;
 margin-right: 4px;
 display: flex;
 align-items: center;
 gap: 5px;
 box-shadow: 2px 2px 0 #2e1a0c;
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-size: 13.5px;
 font-weight: 700;
 color: #2e1a0c;
 flex-shrink: 0;
 }

 .close-btn {
 width: 36px;
 height: 36px;
 background: #b83b2b;
 border: 3px solid #59361c;
 border-radius: 0px;
 color: #fff6df;
 font-family: 'Press Start 2P', monospace;
 font-size: 12px;
 text-shadow: 2px 2px 0 #2e1a0c;
 cursor: pointer;
 box-shadow: 3px 3px 0 #2e1a0c, inset 0 2px 0 #d95645;
 display: flex;
 align-items: center;
 justify-content: center;
 flex-shrink: 0;
 transition: transform 0.05s steps(1), box-shadow 0.05s steps(1);
 }

 .close-btn:active {
 transform: translate(2px, 2px);
 box-shadow: 1px 1px 0 #2e1a0c;
 }

 .shop-tabs {
 display: flex;
 background: #6e3f1d;
 border-bottom: 3px solid #59361c;
 padding: 7px 7px 6px;
 gap: 5px;
 }

 .tab-btn {
 flex: 1;
 padding: 6px 4px;
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-size: 13px;
 font-weight: 700;
 background: #9c6033;
 border: 3px solid #59361c;
 border-radius: 0px;
 box-shadow: 2px 2px 0 #2e1a0c, inset 0 2px 0 #bd7a46;
 color: #fff5e0;
 text-shadow: 1px 1px 0 #2e1a0c;
 cursor: pointer;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 4px;
 white-space: nowrap;
 transition: transform 0.05s steps(1), box-shadow 0.05s steps(1);
 }

 .tab-btn:active {
 transform: translate(2px, 2px);
 box-shadow: 0px 0px 0 #2e1a0c;
 }

 .tab-btn.active {
 background: #f4dcb8;
 color: #2e1a0c;
 text-shadow: none;
 box-shadow: inset 0 2px 0 #fff4e0;
 transform: translateY(1px);
 }

 .shop-content {
 padding: 10px;
 overflow-y: auto;
 display: flex;
 flex-direction: column;
 gap: 9px;
 background: #f4dcb8;
 -webkit-overflow-scrolling: touch;
 }

 .shop-card {
 background: #faebd2;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 9px 10px;
 display: flex;
 align-items: center;
 gap: 9px;
 box-shadow: 3px 3px 0 #2e1a0c;
 }

 .shop-card.unlocked-card {
 background: #eef5d8;
 }

 .card-avatar {
 width: 58px;
 height: 58px;
 background: #e3c291;
 border: 3px solid #59361c;
 border-radius: 0px;
 display: flex;
 align-items: center;
 justify-content: center;
 flex-shrink: 0;
 overflow: hidden;
 box-shadow: inset 2px 2px 0 #c9a36b;
 }

 .card-avatar canvas {
 width: 50px;
 height: 50px;
 object-fit: contain;
 }

 .card-info {
 flex: 1;
 min-width: 0;
 }

 .card-name {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-size: 14.5px;
 font-weight: 700;
 color: #2e1a0c;
 margin-bottom: 3px;
 display: flex;
 align-items: center;
 flex-wrap: wrap;
 gap: 5px;
 }

 .breed-badge {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 background: #8c5228;
 color: #fff6df;
 border: 2px solid #59361c;
 border-radius: 0px;
 padding: 1px 6px;
 font-size: 11.5px;
 font-weight: 700;
 text-shadow: 1px 1px 0 #2e1a0c;
 }

 .card-desc {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-size: 13px;
 font-weight: 500;
 color: #59361c;
 line-height: 1.25;
 margin-bottom: 6px;
 }

 .stat-chips {
 display: flex;
 flex-wrap: wrap;
 gap: 5px;
 }

 .stat-chip {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 background: #ebd0a6;
 border: 2px solid #59361c;
 border-radius: 0px;
 padding: 2px 6px;
 font-size: 12px;
 font-weight: 700;
 color: #2e1a0c;
 display: inline-flex;
 align-items: center;
 gap: 3px;
 }

 .stat-chip.highlight {
 background: #f2c14e;
 color: #2e1a0c;
 }

 .upgrade-bar {
 width: 100%;
 height: 12px;
 background: #59361c;
 border: 2px solid #2e1a0c;
 border-radius: 0px;
 overflow: hidden;
 margin-top: 6px;
 }

 .upgrade-bar-fill {
 height: 100%;
 background: #6ca14b;
 border-right: 2px solid #2e1a0c;
 transition: width 0.2s steps(6);
 }

 .buy-btn {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 background: #578a39;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 8px 10px;
 font-size: 13px;
 font-weight: 700;
 color: #fff8e7;
 text-shadow: 2px 2px 0 #2e1a0c;
 box-shadow: 3px 3px 0 #2e1a0c, inset 0 2px 0 #76b054;
 cursor: pointer;
 white-space: nowrap;
 flex-shrink: 0;
 display: inline-flex;
 align-items: center;
 gap: 4px;
 transition: transform 0.05s steps(1), box-shadow 0.05s steps(1);
 }

 .buy-btn:active:not(:disabled) {
 transform: translate(2px, 2px);
 box-shadow: 1px 1px 0 #2e1a0c;
 }

 .buy-btn:disabled {
 background: #8c7b6b;
 color: #e3d6c5;
 box-shadow: 2px 2px 0 #2e1a0c;
 cursor: not-allowed;
 }

 .buy-btn.owned {
 background: #c98a2c;
 color: #fff8e7;
 box-shadow: 3px 3px 0 #2e1a0c, inset 0 2px 0 #e6aa45;
 }

 .breed-pair-box {
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 8px;
 background: #8c5228;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 9px;
 box-shadow: 3px 3px 0 #2e1a0c;
 }

 .parent-slot {
 flex: 1;
 background: #faebd2;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 7px 5px;
 text-align: center;
 cursor: pointer;
 box-shadow: 3px 3px 0 #2e1a0c;
 transition: transform 0.05s steps(1), box-shadow 0.05s steps(1);
 }

 .parent-slot:active {
 transform: translate(2px, 2px);
 box-shadow: 1px 1px 0 #2e1a0c;
 }

 .parent-slot canvas {
 width: 48px;
 height: 48px;
 display: block;
 margin: 0 auto 4px;
 }

 .breed-heart-mid {
 font-size: 22px;
 font-weight: 700;
 flex-shrink: 0;
 }

 .forecast-panel {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 background: #faebd2;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 10px 11px;
 font-size: 13.5px;
 font-weight: 600;
 color: #2e1a0c;
 line-height: 1.35;
 box-shadow: 3px 3px 0 #2e1a0c;
 }

 .timer-banner {
 background: #59361c;
 color: #ffdf6b;
 border: 3px solid #2e1a0c;
 border-radius: 0px;
 padding: 10px;
 text-align: center;
 font-family: 'Press Start 2P', monospace;
 font-size: 11px;
 line-height: 1.4;
 text-shadow: 2px 2px 0 #2e1a0c;
 box-shadow: 3px 3px 0 #2e1a0c;
 }

 .sell-btn {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 background: #c98a2c;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 8px 10px;
 font-size: 13px;
 font-weight: 700;
 color: #fff8e7;
 text-shadow: 2px 2px 0 #2e1a0c;
 box-shadow: 3px 3px 0 #2e1a0c, inset 0 2px 0 #e6aa45;
 cursor: pointer;
 white-space: nowrap;
 flex-shrink: 0;
 display: inline-flex;
 align-items: center;
 gap: 4px;
 transition: transform 0.05s steps(1), box-shadow 0.05s steps(1);
 }

 .sell-btn:active:not(:disabled) {
 transform: translate(2px, 2px);
 box-shadow: 1px 1px 0 #2e1a0c;
 }

 .sell-btn:disabled {
 background: #8c7b6b;
 color: #e3d6c5;
 box-shadow: 2px 2px 0 #2e1a0c;
 cursor: not-allowed;
 }

 .hot-demand-banner {
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 background: #8c5228;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 8px 10px;
 font-size: 13.5px;
 font-weight: 700;
 color: #fff6df;
 text-shadow: 2px 2px 0 #2e1a0c;
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 6px;
 box-shadow: 3px 3px 0 #2e1a0c;
 }

 .gender-switch-bar {
 display: flex;
 gap: 6px;
 background: #8c5228;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 5px;
 box-shadow: 3px 3px 0 #2e1a0c;
 }

 .gender-opt-btn {
 flex: 1;
 padding: 7px 6px;
 border: 3px solid #59361c;
 border-radius: 0px;
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-size: 13px;
 font-weight: 700;
 cursor: pointer;
 background: #faebd2;
 color: #2e1a0c;
 text-align: center;
 box-shadow: 3px 3px 0 #2e1a0c;
 transition: transform 0.05s steps(1), box-shadow 0.05s steps(1);
 }

 .gender-opt-btn:active {
 transform: translate(2px, 2px);
 box-shadow: 1px 1px 0 #2e1a0c;
 }

 .gender-opt-btn.active-male {
 background: #3d6e8c;
 color: #fff8e7;
 text-shadow: 2px 2px 0 #2e1a0c;
 }

 .gender-opt-btn.active-female {
 background: #b54865;
 color: #fff8e7;
 text-shadow: 2px 2px 0 #2e1a0c;
 }

 .gender-tag-male {
 color: #2b5b7a;
 font-weight: 700;
 }

 .gender-tag-female {
 color: #a63352;
 font-weight: 700;
 }

 /* Плашка описания окна «Лавка бонусов 🎬» (Adsgram Rewarded Ads) */
 .ads-info-banner {
 background: #ebd0a6;
 border: 3px solid #59361c;
 border-radius: 0px;
 padding: 9px 11px;
 box-shadow: 3px 3px 0 #2e1a0c;
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-size: 13.5px;
 font-weight: 700;
 color: #2e1a0c;
 line-height: 1.32;
 }

 /* Всплывающее пиксельное уведомление поверх экрана */
 #pixelToastContainer {
 position: fixed;
 top: 14px;
 left: 50%;
 transform: translateX(-50%);
 z-index: 220;
 display: flex;
 flex-direction: column;
 align-items: center;
 gap: 8px;
 pointer-events: none;
 width: min(92vw, 410px);
 }

 .pixel-toast {
 width: 100%;
 background: #f4dcb8;
 border: 3px solid #59361c;
 box-shadow: 4px 4px 0 #2e1a0c, inset 0 0 0 2px #fff2d6;
 padding: 10px 12px;
 display: flex;
 align-items: center;
 gap: 9px;
 font-family: 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif;
 font-size: 14px;
 font-weight: 700;
 color: #2e1a0c;
 animation: pixelPopIn 0.14s steps(3);
 }

 .pixel-toast.toast-success {
 background: #eef5d8;
 border-color: #3f6927;
 }

 .pixel-toast.toast-error {
 background: #fad7d2;
 border-color: #8c261b;
 }

 .timer-row-wrap {
 display: flex;
 align-items: stretch;
 gap: 7px;
 }

 .timer-row-wrap .timer-banner {
 flex: 1;
 display: flex;
 align-items: center;
 justify-content: center;
 }
 </style>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<canvas id="gameCanvas"></canvas>

<!-- Горизонтальная лента быстрого перехода по локациям (со скроллом) -->
<div id="locationNavStrip"></div>

<!-- Модальное окно лавки -->
<div id="shopModal">
 <div class="shop-window">
 <div class="shop-header">
 <div class="shop-title-wrap">
 <canvas id="shopHeaderIcon" width="32" height="32"></canvas>
 <div class="shop-title">ЛАВКА</div>
 </div>
 <div style="display:flex;align-items:center;gap:6px;">
 <div class="shop-balance" title="Звёзды прогресса">
 <canvas id="shopBalanceStar" width="20" height="20"></canvas>
 <span id="shopStarText">0</span>
 </div>
 <div class="shop-balance">
 <canvas id="shopBalanceCoin" width="22" height="22"></canvas>
 <span id="shopCoinText">120</span>
 </div>
 </div>
 <button class="close-btn" id="closeShopBtn" type="button">✕</button>
 </div>
 <div class="shop-tabs">
 <button class="tab-btn active" data-tab="boars" type="button">
 <canvas id="tabBoarIcon" width="18" height="18"></canvas>
 <span>Хряки</span>
 </button>
 <button class="tab-btn" data-tab="expedition" type="button">
 <canvas id="tabExpeditionIcon" width="18" height="18"></canvas>
 <span>Обоз</span>
 </button>
 <button class="tab-btn" data-tab="territory" type="button">
 <canvas id="tabTerritoryIcon" width="18" height="18"></canvas>
 <span>Участки</span>
 </button>
 <button class="tab-btn" data-tab="upgrades" type="button">
 <canvas id="tabGardenIcon" width="18" height="18"></canvas>
 <span>Огород</span>
 </button>
 </div>
 <div class="shop-content" id="shopList"></div>
 </div>
</div>

<!-- Модальное окно Племенного свинарника (Скрещивание) -->
<div id="breedModal" class="game-modal">
 <div class="shop-window">
 <div class="shop-header" style="background: #8f472e;">
 <div class="shop-title-wrap">
 <canvas id="breedHeaderIcon" width="32" height="32"></canvas>
 <div class="shop-title">ПЛЕМЕННОЙ ДВОР</div>
 </div>
 <div class="shop-balance">
 <span id="breedHerdCount">1/6</span>
 </div>
 <button class="close-btn" id="closeBreedBtn" type="button">✕</button>
 </div>
 <div class="shop-content" id="breedBody"></div>
 </div>
</div>

<!-- Модальное окно Свиноводческого рынка -->
<div id="marketModal" class="game-modal">
 <div class="shop-window">
 <div class="shop-header" style="background: #9e6224;">
 <div class="shop-title-wrap">
 <canvas id="marketHeaderIcon" width="32" height="32"></canvas>
 <div class="shop-title">РЫНОК «ПЯТАЧОК»</div>
 </div>
 <div class="shop-balance">
 <canvas id="marketBalanceCoin" width="22" height="22"></canvas>
 <span id="marketCoinText">40</span>
 </div>
 <button class="close-btn" id="closeMarketBtn" type="button">✕</button>
 </div>
 <div class="shop-content" id="marketBody"></div>
 </div>
</div>

<!-- Модальное окно Лесопилки -->
<div id="sawmillModal" class="game-modal">
 <div class="shop-window">
 <div class="shop-header" style="background: #73421d;">
 <div class="shop-title-wrap">
 <canvas id="sawmillHeaderIcon" width="32" height="32"></canvas>
 <div class="shop-title">ЛЕСОПИЛКА</div>
 </div>
 <div class="shop-balance" style="background:#f4dcb8;">
 <canvas id="sawmillBalanceLog" width="22" height="22"></canvas>
 <span id="sawmillLogText">0</span>
 </div>
 <button class="close-btn" id="closeSawmillBtn" type="button">✕</button>
 </div>
 <div class="shop-content" id="sawmillBody"></div>
 </div>
</div>


<!-- Модальное окно Морского Похода («Вы уверены?») -->
<div id="voyageModal" class="game-modal">
 <div class="shop-window">
 <div class="shop-header" style="background: #3d6382;">
 <div class="shop-title-wrap">
 <canvas id="voyageHeaderIcon" width="32" height="32"></canvas>
 <div class="shop-title" id="voyageModalTitle">ВЫ УВЕРЕНЫ?</div>
 </div>
 <div class="shop-balance">
 <canvas id="voyageBalanceCoin" width="22" height="22"></canvas>
 <span id="voyageCoinText">40</span>
 </div>
 <button class="close-btn" id="closeVoyageBtn" type="button">✕</button>
 </div>
 <div class="shop-content" id="voyageBody"></div>

 */
let tg = null;
function bindTelegramSafeAreaEvents(webApp) {
 if (!webApp || webApp._safeAreaBound) return;
 webApp._safeAreaBound = true;
 const onAreaUpdate = () => {
 resize();
 if (typeof renderSceneFrame === 'function') {
 renderSceneFrame(performance.now());
 }
 };
 if (webApp.onEvent) {
 ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged'].forEach((ev) => {
 try { webApp.onEvent(ev, onAreaUpdate); } catch (e) {}
 });
 }
 setTimeout(onAreaUpdate, 250);
 setTimeout(onAreaUpdate, 700);
}

function initTelegramAsync() {
 if (window.Telegram && window.Telegram.WebApp) {
 tg = window.Telegram.WebApp;
 try {
 tg.ready();
 tg.expand();
 if (tg.requestFullscreen) tg.requestFullscreen();
 if (tg.setHeaderColor) tg.setHeaderColor('#2d6a4f');
 if (tg.setBackgroundColor) tg.setBackgroundColor('#2b5876');
 bindTelegramSafeAreaEvents(tg);
 resize();
 } catch (e) {}
 return;
 }
 if (location.protocol === 'https:' || location.protocol === 'http:') {
 const s = document.createElement('script');
 s.src = 'https://telegram.org/js/telegram-web-app.js';
 s.async = true;
 s.onload = () => {
 if (window.Telegram && window.Telegram.WebApp) {
 tg = window.Telegram.WebApp;
 try {
 tg.ready();
 tg.expand();
 if (tg.requestFullscreen) tg.requestFullscreen();
 bindTelegramSafeAreaEvents(tg);
 resize();
 } catch (e) {}
 }
 };
 document.body.appendChild(s);
 }
}

function triggerHaptic(type = 'light') {
 if (tg && tg.HapticFeedback) {
 try {
 if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
 else tg.HapticFeedback.impactOccurred(type);
 } catch (e) {}
 }
}

/**
 * АУДИО-СИСТЕМА: ТОЛЬКО ЗВУКОВЫЕ ЭФФЕКТЫ (SFX) БЕЗ ФОНОВОЙ МУЗЫКИ
 */
const SafeStorage = (() => {
 const mem = {};
 return {
 get(key) {
 try {
 const v = window.localStorage.getItem(key);
 return v !== null ? v : (mem[key] ?? null);
 } catch (e) {
 return mem[key] ?? null;
 }
 },
 set(key, val) {
 mem[key] = String(val);
 try {
 window.localStorage.setItem(key, String(val));
 } catch (e) {}
 }
 };
})();

const SoundManager = (() => {
 const MUTE_KEY = 'khryakograd_sfx_muted_v9';
 let isMuted = false;
 try {
 isMuted = SafeStorage.get(MUTE_KEY) === '1';
 } catch (e) {}

 let audioCtx = null;

 function ensureContext() {
 if (!audioCtx) {
 const Ctx = window.AudioContext || window.webkitAudioContext;
 if (Ctx) audioCtx = new Ctx();
 }
 if (audioCtx && audioCtx.state === 'suspended') {
 audioCtx.resume().catch(() => {});
 }
 return audioCtx;
 }

 ['pointerdown', 'touchstart', 'keydown'].forEach((evt) => {
 window.addEventListener(evt, ensureContext, { passive: true });
 });

 function playTone({ freq = 440, endFreq = null, type = 'sine', duration = 0.12, vol = 0.18, delay = 0 }) {
 if (isMuted) return;
 const ctx = ensureContext();
 if (!ctx) return;
 const now = ctx.currentTime + delay;
 const osc = ctx.createOscillator();
 const gain = ctx.createGain();
 osc.type = type;
 osc.frequency.setValueAtTime(Math.max(20, freq), now);
 if (endFreq) {
 osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
 }
 gain.gain.setValueAtTime(0.001, now);
 gain.gain.linearRampToValueAtTime(vol, now + Math.min(0.015, duration * 0.25));
 gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.start(now);
 osc.stop(now + duration + 0.01);
 }

 function playNoise({ duration = 0.08, vol = 0.12, filterFreq = 900, filterType = 'bandpass', delay = 0 }) {
 if (isMuted) return;
 const ctx = ensureContext();
 if (!ctx) return;
 const now = ctx.currentTime + delay;
 const sampleCount = Math.max(1, Math.floor(ctx.sampleRate * duration));
 const buffer = ctx.createBuffer(1, sampleCount, ctx.sampleRate);
 const data = buffer.getChannelData(0);
 for (let i = 0; i < sampleCount; i++) {
 data[i] = Math.random() * 2 - 1;
 }
 const src = ctx.createBufferSource();
 src.buffer = buffer;

 const filter = ctx.createBiquadFilter();
 filter.type = filterType;
 filter.frequency.setValueAtTime(filterFreq, now);
 filter.Q.setValueAtTime(1.6, now);

 const gain = ctx.createGain();
 gain.gain.setValueAtTime(vol, now);
 gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

 src.connect(filter);
 filter.connect(gain);
 gain.connect(ctx.destination);
 src.start(now);
 src.stop(now + duration + 0.01);
 }

 return {
 isMuted() {
 return isMuted;
 },
 toggleMute() {
 isMuted = !isMuted;
 try {
 SafeStorage.set(MUTE_KEY, isMuted ? '1' : '0');
 } catch (e) {}
 if (!isMuted) {
 ensureContext();
 this.uiClick();
 }
 return isMuted;
 },
 uiClick() {
 playTone({ freq: 640, endFreq: 390, type: 'triangle', duration: 0.055, vol: 0.15 });
 },
 zoomStep(dir = 1) {
 playTone({
 freq: dir > 0 ? 440 : 540,
 endFreq: dir > 0 ? 640 : 350,

 vol: 0.12
 });
 },
 oink(pitchMult = 1.0) {
 if (isMuted) return;
 const ctx = ensureContext();
 if (!ctx) return;
 const now = ctx.currentTime;
 const base = 145 * pitchMult;

 [0, 0.11].forEach((offset, idx) => {
 const dur = idx === 0 ? 0.09 : 0.135;
 const osc = ctx.createOscillator();
 const filter = ctx.createBiquadFilter();
 const gain = ctx.createGain();

 osc.type = 'sawtooth';
 osc.frequency.setValueAtTime(base * (idx === 0 ? 0.92 : 1.05), now + offset);
 osc.frequency.exponentialRampToValueAtTime(base * (idx === 0 ? 1.26 : 0.76), now + offset + dur);

 filter.type = 'bandpass';
 filter.frequency.setValueAtTime(530 * pitchMult, now + offset);
 filter.Q.setValueAtTime(3.2, now + offset);

 gain.gain.setValueAtTime(0.001, now + offset);
 gain.gain.linearRampToValueAtTime(0.19, now + offset + 0.02);
 gain.gain.exponentialRampToValueAtTime(0.001, now + offset + dur);

 osc.connect(filter);
 filter.connect(gain);
 gain.connect(ctx.destination);
 osc.start(now + offset);
 osc.stop(now + offset + dur + 0.01);
 });
 },

 playNoise({ duration: 0.075, vol: 0.18, filterFreq: 1100, delay: 0.08 });
 this.oink(1.12);
 },

const customIconImages = {};
Object.keys(CUSTOM_ICON_SOURCES).forEach((key) => {
 const src = CUSTOM_ICON_SOURCES[key];
 if (src) {
 const img = new Image();
 img.onload = () => {
 customIconImages[key] = img;
 };
 img.src = src;
 if (img.decode) img.decode().catch(() => {});
 }
});

const worldSpriteImages = {};
Object.keys(WORLD_SPRITE_SOURCES).forEach((key) => {
 const src = WORLD_SPRITE_SOURCES[key];
 if (src) {
 const img = new Image();
 img.onload = () => {
 worldSpriteImages[key] = img;
 };
 img.src = src;
 if (img.decode) img.decode().catch(() => {});
 }
});

function pxImg(key, small = false) {
 const src = CUSTOM_ICON_SOURCES[key] || CUSTOM_ICON_SOURCES.coin;
 return `<img class="${small ? 'px-ico-sm' : 'px-ico'}" src="${src}" alt="" />`;
}

function drawCartoonIcon(ctx, key, cx, cy, size) {
 ctx.imageSmoothingEnabled = false;
 const custom = customIconImages[key];
 if (custom && custom.complete && custom.naturalWidth > 0) {
 const aspect = custom.naturalWidth / custom.naturalHeight;
 const target = size * 1.12;
 let dw = target;
 let dh = target;
 if (aspect > 1) {
 dh = target / aspect;
 } else {
 dw = target * aspect;
 }
 ctx.drawImage(custom, cx - dw / 2, cy - dh / 2, dw, dh);
 return;
 }

 ctx.save();
 ctx.translate(cx, cy);
 const s = size / 40;
 ctx.scale(s, s);
 ctx.lineJoin = 'round';
 ctx.lineCap = 'round';
 ctx.strokeStyle = '#1a1a1a';
 ctx.lineWidth = 3;
 if (key === 'heart') {
 const hg = ctx.createRadialGradient(-4, -5, 2, 0, 0, 16);
 hg.addColorStop(0, '#ff9eb5');
 hg.addColorStop(0.45, '#ff385c');
 hg.addColorStop(1, '#b80d2f');
 ctx.fillStyle = hg;
 ctx.beginPath();
 ctx.moveTo(0, 10);
 ctx.bezierCurveTo(-18, -2, -10, -16, 0, -6);
 ctx.bezierCurveTo(10, -16, 18, -2, 0, 10);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();
 ctx.fillStyle = 'rgba(255,255,255,0.65)';
 ctx.beginPath();
 ctx.ellipse(-5, -6, 3, 1.8, -0.5, 0, Math.PI * 2);
 ctx.fill();
 ctx.restore();
 return;
 }
 if (key === 'sparkle') {
 const sg = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
 sg.addColorStop(0, '#ffffff');
 sg.addColorStop(0.5, '#ffe047');
 sg.addColorStop(1, '#f39c12');
 ctx.fillStyle = sg;
 ctx.beginPath();
 for (let i = 0; i < 8; i++) {
 const r = i % 2 === 0 ? 14 : 5;
 const a = (i * Math.PI) / 4;
 if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
 else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
 }
 ctx.closePath();
 ctx.fill();
 ctx.stroke();
 ctx.restore();
 return;
 }
 if (key === 'woodchip') {
 ctx.rotate(0.35);
 const wg = ctx.createLinearGradient(-10, -6, 10, 6);
 wg.addColorStop(0, '#ffeaa7');
 wg.addColorStop(1, '#d38b43');
 ctx.fillStyle = wg;
 ctx.beginPath();
 ctx.moveTo(-10, -4);
 ctx.lineTo(8, -7);
 ctx.lineTo(11, 4);
 ctx.lineTo(-7, 6);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();
 ctx.restore();
 return;
 }
 if (key === 'log') {
 // Объёмное бревно с градиентной корой, бликом и годовыми кольцами
 ctx.save();
 ctx.rotate(-0.22);
 const barkGrad = ctx.createLinearGradient(0, -9, 0, 9);
 barkGrad.addColorStop(0, '#b56e33');
 barkGrad.addColorStop(0.55, '#8c4f1e');
 barkGrad.addColorStop(1, '#59300f');
 ctx.fillStyle = barkGrad;
 roundRect(ctx, -16, -9, 26, 18, 5);
 ctx.fill();
 ctx.stroke();

 // Верхний блик на коре
 ctx.strokeStyle = 'rgba(255, 225, 175, 0.38)';
 ctx.lineWidth = 2;
 ctx.beginPath();
 ctx.moveTo(-12, -5);
 ctx.lineTo(3, -5);
 ctx.stroke();

 // Тёмная борозда коры
 ctx.strokeStyle = '#47250a';
 ctx.lineWidth = 2;
 ctx.beginPath();
 ctx.moveTo(-11, 3);
 ctx.lineTo(4, 3);
 ctx.stroke();

 // Светлый спил торца с радиальным градиентом
 ctx.strokeStyle = '#1a1a1a';
 ctx.lineWidth = 2.6;
 const cutGrad = ctx.createRadialGradient(9, -1, 1, 10, 0, 9);
 cutGrad.addColorStop(0, '#fff8dc');
 cutGrad.addColorStop(0.7, '#f0c987');
 cutGrad.addColorStop(1, '#c99349');
 ctx.fillStyle = cutGrad;
 ctx.beginPath();
 ctx.ellipse(10, 0, 6.8, 8.8, 0, 0, Math.PI * 2);
 ctx.fill();
 ctx.stroke();

 ctx.strokeStyle = '#b8762e';
 ctx.lineWidth = 1.5;
 ctx.beginPath();
 ctx.ellipse(10, 0, 3.2, 4.5, 0, 0, Math.PI * 2);
 ctx.stroke();
 ctx.restore();
 ctx.restore();
 return;
 }
 if (key === 'ship') {
 // Мультяшный деревянный корабль с парусом
 ctx.fillStyle = '#8c4f1e';
 ctx.beginPath();
 ctx.moveTo(-16, 4);
 ctx.lineTo(16, 4);
 ctx.lineTo(11, 14);
 ctx.lineTo(-11, 14);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 // Мачта
 ctx.strokeStyle = '#1b1209';
 ctx.lineWidth = 3;
 ctx.beginPath();
 ctx.moveTo(0, 4);
 ctx.lineTo(0, -15);
 ctx.stroke();

 // Парус
 const sailGrad = ctx.createLinearGradient(-10, -14, 12, 2);
 sailGrad.addColorStop(0, '#ffffff');
 sailGrad.addColorStop(1, '#ffe082');
 ctx.fillStyle = sailGrad;
 ctx.beginPath();
 ctx.moveTo(0, -14);
 ctx.quadraticCurveTo(15, -6, 0, 2);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 // Флажок
 ctx.fillStyle = '#ff3838';
 ctx.beginPath();
 ctx.moveTo(0, -15);
 ctx.lineTo(-9, -12);
 ctx.lineTo(0, -9);
 ctx.closePath();
 ctx.fill();
 ctx.restore();
 return;
 }
 if (key === 'sawmill') {
 // Зубчатый стальной диск циркулярной пилы с металлическим блеском
 const teeth = 12;
 const metalGrad = ctx.createLinearGradient(-14, -14, 14, 14);
 metalGrad.addColorStop(0, '#ffffff');
 metalGrad.addColorStop(0.5, '#cfd8dc');
 metalGrad.addColorStop(1, '#78909c');
 ctx.fillStyle = metalGrad;
 ctx.beginPath();
 for (let i = 0; i < teeth * 2; i++) {
 const r = i % 2 === 0 ? 15.5 : 12;
 const a = (i * Math.PI) / teeth;
 if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
 else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
 }
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 ctx.fillStyle = '#ff5252';
 ctx.beginPath();
 ctx.arc(0, 0, 5.2, 0, Math.PI * 2);
 ctx.fill();
 ctx.stroke();
 ctx.restore();
 return;
 }
 if (key === 'flag') {
 ctx.fillStyle = '#8c5327';
 roundRect(ctx, -10, -16, 4, 32, 2);
 ctx.fill();
 ctx.stroke();
 ctx.fillStyle = '#ff9f1a';
 ctx.beginPath();
 ctx.moveTo(-6, -15);
 ctx.lineTo(14, -8);
 ctx.lineTo(-6, -1);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();
 } else {
 ctx.fillStyle = '#ffe047';
 ctx.beginPath();
 ctx.arc(0, 0, 14, 0, Math.PI * 2);
 ctx.fill();
 ctx.stroke();
 }
 ctx.restore();
}

function renderIconToCanvas(canvasEl, key) {
 if (!canvasEl) return;
 const c = canvasEl.getContext('2d');
 c.clearRect(0, 0, canvasEl.width, canvasEl.height);
 drawCartoonIcon(c, key, canvasEl.width / 2, canvasEl.height / 2, Math.min(canvasEl.width, canvasEl.height) * 0.9);
}

function hash2D(x, y) {
 let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
 h = Math.imul(h ^ (h >>> 13), 1274126177);
 return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function smoothNoise(x, y) {
 const ix = Math.floor(x);
 const iy = Math.floor(y);
 const fx = x - ix;
 const fy = y - iy;
 const ux = fx * fx * (3 - 2 * fx);
 const uy = fy * fy * (3 - 2 * fy);
 const a = hash2D(ix, iy);
 const b = hash2D(ix + 1, iy);
 const c = hash2D(ix, iy + 1);
 const d = hash2D(ix + 1, iy + 1);
 return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

function fbm(x, y) {
 return (
 smoothNoise(x, y) * 0.55 +
 smoothNoise(x * 2.1, y * 2.1) * 0.3 +
 smoothNoise(x * 4.3, y * 4.3) * 0.15
 );
}

 const idx = ty * MAP_COLS + tx;

 const dy = (ty - cy) / 62;
 const angle = Math.atan2(dy, dx);
 const coastWave =

 const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2;

 const t = s / steps;
 const rx = Math.round(x0 + (x1 - x0) * t + Math.sin(t * Math.PI * 2) * 1.5);
 const ry = Math.round(y0 + (y1 - y0) * t + Math.cos(t * Math.PI * 2) * 1.2);
 for (let oy = -1; oy <= 1; oy++) {
 for (let ox = -1; ox <= 1; ox++) {
 const nx = rx + ox;
 const ny = ry + oy;
 if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS) {
 const id = ny * MAP_COLS + nx;
 if (TILE_GRID[id] >= 2) {
 TILE_GRID[id] = 10;
 TILE_PROPS[id] = 0;
 }
 }
 }
 }
 }
 }
 }

 const minTy = Math.max(0, Math.floor(ctyTile - radiusTiles));

 if (dx * dx + dy * dy <= rSq) {
 const idx = ty * MAP_COLS + tx;
 if (FOG_GRID[idx] === 0) {
 FOG_GRID[idx] = 1;
 changed = true;

 }

 if (changed) {
 fogLayerDirty = true;

}

function serializeFog() {
 const chars = new Array(Math.ceil(FOG_GRID.length / 4));
 let cIdx = 0;
 for (let i = 0; i < FOG_GRID.length; i += 4) {
 const nibble =
 (FOG_GRID[i] || 0) |
 ((FOG_GRID[i + 1] || 0) << 1) |
 ((FOG_GRID[i + 2] || 0) << 2) |
 ((FOG_GRID[i + 3] || 0) << 3);
 chars[cIdx++] = nibble.toString(16);
 }
 return chars.join('');
}

function deserializeFog(hex) {
 if (!hex || typeof hex !== 'string') return false;
 let loaded = false;
 for (let i = 0; i < hex.length && i * 4 < FOG_GRID.length; i++) {
 const val = parseInt(hex[i], 16);
 if (!isNaN(val)) {
 FOG_GRID[i * 4] = val & 1;
 if (i * 4 + 1 < FOG_GRID.length) FOG_GRID[i * 4 + 1] = (val >> 1) & 1;
 if (i * 4 + 2 < FOG_GRID.length) FOG_GRID[i * 4 + 2] = (val >> 2) & 1;
 if (i * 4 + 3 < FOG_GRID.length) FOG_GRID[i * 4 + 3] = (val >> 3) & 1;
 loaded = true;
 }
 }
 return loaded;
}

 if (typeof state.feederLevel !== 'number' || state.feederLevel < 0) state.feederLevel = 0;
 if (typeof state.sawmillQueueLogs !== 'number' || state.sawmillQueueLogs < 0) state.sawmillQueueLogs = 0;
 if (typeof state.sawmillProgress !== 'number' || isNaN(state.sawmillProgress)) state.sawmillProgress = 0;
 if (typeof state.sawmillStoredCoins !== 'number' || isNaN(state.sawmillStoredCoins)) state.sawmillStoredCoins = 0;
 if (typeof state.growthSpeedLevel !== 'number' || state.growthSpeedLevel < 1) state.growthSpeedLevel = 1;
 if (typeof state.barnLevel !== 'number' || state.barnLevel < 0) state.barnLevel = 0;
 if (typeof state.barnStoredCoins !== 'number' || isNaN(state.barnStoredCoins)) state.barnStoredCoins = 0;
 if (typeof state.scoutSpeedLevel !== 'number' || state.scoutSpeedLevel < 1) state.scoutSpeedLevel = 1;
 if (typeof state.scoutVisionLevel !== 'number' || state.scoutVisionLevel < 1) state.scoutVisionLevel = 1;
 if (typeof state.gameMinutes !== 'number' || isNaN(state.gameMinutes)) state.gameMinutes = 9 * 60 + 15;

 const hadFog = deserializeFog(state.fogHex);
 if (!hadFog) {
 revealFogAroundWorld(WORLD.homeTile.tx * TILE_SIZE, WORLD.homeTile.ty * TILE_SIZE, 15);
 }
 // Слегка приоткрываем облака над 4 морскими островами, чтобы игрок видел их в море
 SEA_ISLANDS.forEach((isl) => {
 revealFogAroundWorld(isl.tx * TILE_SIZE + TILE_SIZE / 2, isl.ty * TILE_SIZE + TILE_SIZE / 2, 5.5);
 });

 if (typeof state.shipBuilt !== 'boolean') state.shipBuilt = false;
 if (state.shipBuild && (!state.shipBuild.active || typeof state.shipBuild.startTimeMs !== 'number')) {
 state.shipBuild = null;
 }

 // Восстанавливаем состояние морского похода при перезаходе
 if (state.voyage && state.voyage.active) {
 caravan.targetX = state.voyage.targetX;
 caravan.targetY = state.voyage.targetY;
 if (state.voyage.phase === 'prep') {
 caravan.status = 'voyage_prep';
 caravan.x = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
 caravan.y = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;
 } else if (state.voyage.phase === 'sailing') {
 caravan.status = 'voyage_sailing';
 }
 }

 if (!Array.isArray(state.usedPromoCodes)) state.usedPromoCodes = [];
 if (typeof state.turboBoosts !== 'number' || state.turboBoosts < 0) state.turboBoosts = 0;
 if (typeof state.tulupCount !== 'number' || state.tulupCount < 0) state.tulupCount = 0;
 if (typeof state.extraFieldCount !== 'number' || state.extraFieldCount < 0) state.extraFieldCount = 0;
 ensureDynamicFields();

 initPlots();
 displayedCoins = state.coins;
}

function getScoutSpeed() {
 const phase = getDayPhaseInfo(state.gameMinutes);
 const nightPenalty = phase.label === 'ночь' ? 0.68 : 1.0;
 return (120 + (state.scoutSpeedLevel - 1) * 34) * nightPenalty;
}

function getScoutVisionRadius() {
 const phase = getDayPhaseInfo(state.gameMinutes);
 const nightPenalty = phase.label === 'ночь' ? 0.75 : 1.0;
 return (5.2 + (state.scoutVisionLevel - 1) * 1.2) * nightPenalty;

const SHIP_BUILD_COINS = 350;
const SHIP_BUILD_DURATION_MS = 2 * 60 * 60 * 1000; // 2 часа реального времени на постройку корабля
const VOYAGE_PREP_DURATION_MS = 15 * 60 * 1000; // 15 минут реального времени до отплытия
const VOYAGE_SAIL_DURATION_MS = 30 * 60 * 1000; // 30 минут реального времени в пути по морю
const SEA_VOYAGE_COST = 35;

const BIOME_NAMES = {
 0: 'Открытое море',
 1: 'Лазурная отмель',
 2: 'Песчаный берег',
 3: 'Осенний луг',
 4: 'Жухлая поляна',
 5: 'Суходол',
 6: 'Хвойный бор',
 7: 'Листопадная роща',
 8: 'Каменистые холмы',
 9: 'Горный перевал',
 10: 'Речной берег',
 11: 'Просёлочная тропа'
};

function classifyDestination(wx, wy) {
 const clampedX = Math.max(96, Math.min(WORLD.w - 96, wx));
 const clampedY = Math.max(96, Math.min(WORLD.h - 96, wy));
 const tx = Math.max(0, Math.min(MAP_COLS - 1, Math.floor(clampedX / TILE_SIZE)));
 const ty = Math.max(0, Math.min(MAP_ROWS - 1, Math.floor(clampedY / TILE_SIZE)));
 const tileType = TILE_GRID[ty * MAP_COLS + tx];

 // Проверяем, нажал ли игрок на один из 4 морских островов
 for (const isl of SEA_ISLANDS) {
 if (Math.hypot(tx - isl.tx, ty - isl.ty) <= (isl.radius + 3)) {
 return {
 isDistantSea: true,
 isIsland: true,
 island: isl,
 destName: `${isl.name} (путь только морем)`,
 targetX: isl.tx * TILE_SIZE + TILE_SIZE / 2,
 targetY: isl.ty * TILE_SIZE + TILE_SIZE / 2,
 cost: SEA_VOYAGE_COST
 };
 }
 }

 // Только открытое море (глубокая вода 0 и отмель 1) требует корабль! Весь материк (лес, луга, горы, берег) доступен обозу пешком
 if (tileType === 0 || tileType === 1) {
 return {
 isDistantSea: true,
 isIsland: false,
 island: null,
 destName: 'Открытое море (нужен корабль)',
 targetX: clampedX,
 targetY: clampedY,
 cost: SEA_VOYAGE_COST
 };
 }

 // Проверяем, не нажал ли игрок рядом с известным ориентиром долины
 let nearLandmarkName = null;
 for (const lm of LANDMARKS) {
 if (lm.id !== 'khryakograd' && !lm.isIsland && Math.hypot(tx - lm.tx, ty - lm.ty) <= 4.5) {
 nearLandmarkName = lm.name;
 break;
 }
 }

 const distMeters = Math.max(10, Math.round(Math.hypot(clampedX - caravan.x, clampedY - caravan.y) / 8));
 const estSeconds = Math.max(2, Math.round(Math.hypot(clampedX - caravan.x, clampedY - caravan.y) / getScoutSpeed()));

 return {
 isDistantSea: false,
 isIsland: false,
 island: null,
 destName: nearLandmarkName || (BIOME_NAMES[tileType] || 'Лесная поляна'),
 distMeters,
 estSeconds,
 targetX: clampedX,
 targetY: clampedY,
 cost: EXPEDITION_COST
 };
}

let pendingVoyageTarget = null;

function executeLandExpedition(dest) {
 const clampedX = dest.targetX;
 const clampedY = dest.targetY;
 const sx = caravan.x;
 const sy = caravan.y;
 const dx = clampedX - sx;
 const dy = clampedY - sy;
 const dist = Math.hypot(dx, dy);
 if (dist < 28) return;

 if (state.coins < EXPEDITION_COST) {
 SoundManager.uiClick();
 spawnFloatingText(clampedX, clampedY - 20, `Нужно ${EXPEDITION_COST} монет на обоз!`, '#ff6b6b');
 return;
 }
 state.coins -= EXPEDITION_COST;

 const nx = -dy / dist;
 const ny = dx / dist;
 const curve = Math.min(160, dist * 0.13) * (dx >= 0 ? 1 : -1);

 caravan.waypoints = [
 { x: sx + dx * 0.35 + nx * curve, y: sy + dy * 0.35 + ny * curve },
 { x: sx + dx * 0.70 + nx * (curve * 0.65), y: sy + dy * 0.70 + ny * (curve * 0.65) },
 { x: clampedX, y: clampedY }
 ];
 caravan.targetX = clampedX;
 caravan.targetY = clampedY;
 caravan.status = 'moving';
 caravan.campTimer = 0;

 SoundManager.marchStart();
 triggerHaptic('medium');
 spawnFloatingText(clampedX, clampedY - 26, `Обоз в пути: -${EXPEDITION_COST} монет`, '#ffcf56');
 saveGame();
}

function sendCaravanTo(wx, wy) {
 // 1. Если хряки уже плывут по морю (30 мин) или идут в походе — в другой поход отправить НЕЛЬЗЯ!
 if (caravan.status === 'voyage_sailing') {
 SoundManager.uiClick();
 triggerHaptic('medium');
 spawnFloatingText(wx, wy - 24, 'Корабль в море — ждём возвращения!', '#ff6b6b');
 openVoyageModal();
 return;
 }
 if (caravan.status === 'moving') {
 SoundManager.uiClick();
 triggerHaptic('light');
 spawnFloatingText(wx, wy - 24, 'Хряки уже в пути!', '#ff6b6b');
 return;
 }

 // 2. Если хряки сейчас на 15-минутных сборах перед отплытием — открываем окно «Вы уверены?», где можно передумать и отменить!
 if (caravan.status === 'voyage_prep') {
 SoundManager.uiClick();
 triggerHaptic('medium');
 openVoyageModal();
 return;
 }

 const dest = classifyDestination(wx, wy);
 if (!dest.isDistantSea && Math.hypot(dest.targetX - caravan.x, dest.targetY - caravan.y) < 28) {
 return;
 }

 // 3. ПРЕДОТВРАЩЕНИЕ СЛУЧАЙНЫХ КАСАНИЙ:
 // Куда бы ни нажал игрок (в лес, на поляну, к реке или в море) — хряки НЕ отправляются, пока игрок не подтвердит отправку!
 pendingVoyageTarget = dest;
 SoundManager.uiClick();
 triggerHaptic('light');
 openVoyageModal();
}

function clampZoom(z) {
 return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
}

function clampCamera(cx, cy, z = camera.zoom) {
 const viewW = W / z;
 const viewH = H / z;
 const marginX = Math.max(40, viewW * 0.15);
 const marginY = Math.max(120, viewH * 0.15);
 const minX = -marginX;
 const maxX = Math.max(minX, WORLD.w - viewW + marginX);
 const minY = -marginY;
 const maxY = Math.max(minY, WORLD.h - viewH + marginY);
 return {
 x: Math.max(minX, Math.min(maxX, cx)),
 y: Math.max(minY, Math.min(maxY, cy))
 };
}

function setZoomAroundScreenPoint(newZoom, sx = W / 2, sy = H / 2, smooth = true) {
 const clampedZ = clampZoom(newZoom);
 if (smooth) {
 camera.targetZoom = clampedZ;
 camera.zoomAnchorSx = sx;
 camera.zoomAnchorSy = sy;
 } else {
 const wx = sx / camera.zoom + camera.x;
 const wy = sy / camera.zoom + camera.y;
 camera.zoom = clampedZ;
 camera.targetZoom = clampedZ;
 camera.zoomAnchorSx = null;
 camera.zoomAnchorSy = null;
 const c = clampCamera(wx - sx / clampedZ, wy - sy / clampedZ, clampedZ);
 camera.x = c.x;
 camera.y = c.y;
 }
}

function focusCameraOn(worldCenterX, worldCenterY, z = camera.targetZoom) {
 const topReservePx = hudLayout.safeTop + 115;
 const bottomReservePx = 92;
 const visibleCenterY = topReservePx + (H - topReservePx - bottomReservePx) / 2;
 const rawX = worldCenterX - (W / 2) / z;
 const rawY = worldCenterY - visibleCenterY / z;
 const clamped = clampCamera(rawX, rawY, z);
 camera.targetX = clamped.x;
 camera.targetY = clamped.y;
 camera.vx = 0;
 camera.vy = 0;
}

function resize() {
 // Используем родной DPR экрана (до 3.0), чтобы все надписи, цифры и рамки были бритвенно чёткими
 const nextDpr = Math.min(window.devicePixelRatio || 1, 3.0);
 const vv = window.visualViewport;
 const nextW = Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth);
 const nextH = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight);
 const targetW = (nextW > 20) ? nextW : W;
 const targetH = (nextH > 20) ? nextH : H;
 const targetCanvasW = Math.round(targetW * nextDpr);
 const targetCanvasH = Math.round(targetH * nextDpr);

 if (
 targetW === W &&
 targetH === H &&
 nextDpr === dpr &&
 canvas.width === targetCanvasW &&
 canvas.height === targetCanvasH
 ) {
 if (typeof renderSceneFrame === 'function') {
 renderSceneFrame(performance.now());
 }
 return;
 }

 W = targetW;
 H = targetH;
 dpr = nextDpr;
 canvas.width = targetCanvasW;
 canvas.height = targetCanvasH;
 ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
 ctx.imageSmoothingEnabled = false;
 _lastCanvasFont = '';
 computeHudLayout();
 lastNavSyncAt = 0;
 const c = clampCamera(camera.x, camera.y);
 camera.x = c.x;
 camera.y = c.y;

 // Мгновенно перерисовываем текущий кадр сразу после очистки canvas браузером, чтобы не было ни одной вспышки
 if (typeof renderSceneFrame === 'function') {
 renderSceneFrame(performance.now());
 }
}

/**
 * БЫСТРЫЙ ОФФСКРИН-КЭШ КАРТЫ И ОБЛАЧНОГО ПОКРОВА (768x768)
 */
const OVERVIEW_SCALE = 8; // 160 * 8 = 1280x1280 HD-кэш ландшафта для 60 FPS без подлагиваний
const overviewCanvas = document.createElement('canvas');
overviewCanvas.width = MAP_COLS * OVERVIEW_SCALE;
overviewCanvas.height = MAP_ROWS * OVERVIEW_SCALE;
const octx = overviewCanvas.getContext('2d');
octx.imageSmoothingEnabled = false;

const fogCanvas = document.createElement('canvas');
fogCanvas.width = MAP_COLS * OVERVIEW_SCALE;
fogCanvas.height = MAP_ROWS * OVERVIEW_SCALE;
const fctx = fogCanvas.getContext('2d');
fctx.imageSmoothingEnabled = false;
const fogImageData = fctx.createImageData(fogCanvas.width, fogCanvas.height);
const fogPixels32 = new Uint32Array(fogImageData.data.buffer);
const cloudBasePixels32 = new Uint32Array(fogCanvas.width * fogCanvas.height);
let fogLayerDirty = true;

const TILE_PALETTE = [
 '#091E3A', // 0: холодное глубокое ноябрьское море
 '#13335A', // 1: тёмно-синяя холодная отмель
 '#9E825C', // 2: сырой осенний песок
 '#7C6838', // 3: приглушённый охристо-бурый луг
 '#695730', // 4: бурая ноябрьская трава
 '#8F763E', // 5: сухая золотисто-бурая поляна
 '#4D4629', // 6: тёмный хвойный ноябрьский бор
 '#755A2E', // 7: листопадная осенняя роща
 '#6E563B', // 8: бурые каменистые холмы
 '#575366', // 9: холодные ноябрьские скалы
 '#1A4B78', // 10: холодная осенняя река и озеро
 '#8C643B' // 11: размокшая осенняя грунтовая тропа
];

function drawTileDecoration(c, tx, ty, ts, now = 0) {
 const idx = ty * MAP_COLS + tx;
 const prop = TILE_PROPS[idx];
 if (prop === 0) return;
 const x = tx * ts;
 const y = ty * ts;
 const cx = x + ts * 0.5;
 const cy = y + ts * 0.55;

 // Упрощённая быстрая отрисовка для микро-кэша (ts <= 6)
 if (ts <= 6) {
 if (prop === 1) {
 c.fillStyle = '#26462b';
 c.fillRect(x, y, ts, ts);
 } else if (prop === 2) {
 c.fillStyle = '#a86523';
 c.fillRect(x, y, ts, ts);
 } else if (prop === 7) {
 c.fillStyle = '#5c3d24';
 c.fillRect(x, y, ts, ts);
 } else if (prop === 3 || prop === 4) {
 c.fillStyle = prop === 4 ? '#cbd5e1' : '#594a3c';
 c.fillRect(x, y, ts, ts);
 } else if (prop === 6) {
 c.fillStyle = '#7c4d25';
 c.fillRect(x, y, ts, ts);
 }
 return;
 }

 const hVal = hash2D(tx, ty);
 const shiftX = (hVal - 0.5) * ts * 0.14;
 const shiftY = (hash2D(ty, tx) - 0.5) * ts * 0.10;
 const px = cx + shiftX;
 const py = cy + shiftY;

 c.imageSmoothingEnabled = false;
 c.lineJoin = 'round';
 c.lineCap = 'round';
 c.strokeStyle = '#1a1a1a';
 c.lineWidth = Math.max(1.4, ts * 0.042);

 if (prop === 1) {
 // Вырезанная зелёная ель с листа
 const spr = worldSpriteImages.green_spruce;
 if (spr && spr.complete && spr.naturalWidth > 0) {
 drawGroundShadow(c, px, py + ts * 0.32, ts * 0.34, ts * 0.12);
 const dw = ts * 1.05;
 const dh = dw * (spr.naturalHeight / spr.naturalWidth);
 c.drawImage(spr, Math.round(px - dw / 2), Math.round(py + ts * 0.36 - dh), Math.round(dw), Math.round(dh));
 return;
 }
 } else if (prop === 2) {
 // Вырезанный осенний дуб с листа
 const spr = worldSpriteImages.autumn_oak;
 if (spr && spr.complete && spr.naturalWidth > 0) {
 drawGroundShadow(c, px, py + ts * 0.32, ts * 0.38, ts * 0.13);
 const dw = ts * 1.24;
 const dh = dw * (spr.naturalHeight / spr.naturalWidth);
 c.drawImage(spr, Math.round(px - dw / 2), Math.round(py + ts * 0.36 - dh), Math.round(dw), Math.round(dh));
 return;
 }
 } else if (prop === 7) {
 // Вырезанное голое облетевшее ноябрьское дерево с листа
 const spr = worldSpriteImages.bare_tree;
 if (spr && spr.complete && spr.naturalWidth > 0) {
 drawGroundShadow(c, px, py + ts * 0.32, ts * 0.30, ts * 0.11);
 const dw = ts * 0.96;
 const dh = dw * (spr.naturalHeight / spr.naturalWidth);
 c.drawImage(spr, Math.round(px - dw / 2), Math.round(py + ts * 0.36 - dh), Math.round(dw), Math.round(dh));
 return;
 }
 } else if (prop === 3 || prop === 4) {
 // Объёмная двугранная скала Алтая со снежной шапкой
 const topY = y + ts * 0.08;
 const botY = y + ts * 0.86;
 const lX = x + ts * 0.08;
 const rX = x + ts * 0.92;
 const midX = cx + shiftX * 0.5;

 c.fillStyle = 'rgba(20, 20, 20, 0.28)';
 c.beginPath();
 c.ellipse(cx, botY, ts * 0.42, ts * 0.1, 0, 0, Math.PI * 2);
 c.fill();

 c.fillStyle = '#877a6e';
 c.beginPath();
 c.moveTo(lX, botY);
 c.lineTo(midX, topY);
 c.lineTo(midX + ts * 0.04, botY);
 c.closePath();
 c.fill();

 c.fillStyle = '#5c5147';
 c.beginPath();
 c.moveTo(midX, topY);
 c.lineTo(rX, botY);
 c.lineTo(midX + ts * 0.04, botY);
 c.closePath();
 c.fill();

 if (prop === 4) {
 const snowY = topY + (botY - topY) * 0.36;
 c.fillStyle = '#e2e8f0';
 c.beginPath();
 c.moveTo(midX, topY);
 c.lineTo(midX + (rX - midX) * 0.36, snowY);
 c.lineTo(midX + ts * 0.04, snowY - ts * 0.04);
 c.lineTo(midX - (midX - lX) * 0.36, snowY);
 c.closePath();
 c.fill();
 c.stroke();
 }

 c.beginPath();
 c.moveTo(lX, botY);
 c.lineTo(midX, topY);
 c.lineTo(rX, botY);
 c.closePath();
 c.stroke();

 c.beginPath();
 c.moveTo(midX, topY);
 c.lineTo(midX + ts * 0.04, botY);
 c.stroke();
 } else if (prop === 5 && ts >= 16) {
 // Сухая ноябрьская трава и кучка опавших рыже-охристых листьев
 c.strokeStyle = '#524424';
 c.lineWidth = 2;
 c.beginPath();
 c.moveTo(px - 6, py + 4);
 c.lineTo(px - 9, py - 5);
 c.moveTo(px - 2, py + 4);
 c.lineTo(px - 1, py - 7);
 c.moveTo(px + 1, py + 4);
 c.lineTo(px + 5, py - 4);
 c.stroke();

 // Пиксельные опавшие листья на земле
 c.fillStyle = '#c87d28';
 c.fillRect(px + 4, py + 1, 4, 3);
 c.fillStyle = '#9e471e';
 c.fillRect(px - 8, py + 5, 4, 3);
 c.fillStyle = '#d99b38';
 c.fillRect(px + 9, py + 6, 3, 3);
 } else if (prop === 6) {
 // Бревенчатый мост с перилами
 c.fillStyle = 'rgba(0, 0, 0, 0.28)';
 c.fillRect(x + ts * 0.06, y + ts * 0.2, ts * 0.88, ts * 0.66);

 const planks = 5;
 const pw = (ts * 0.84) / planks;
 for (let i = 0; i < planks; i++) {
 c.fillStyle = i % 2 === 0 ? '#9c622b' : '#855120';
 roundRect(c, x + ts * 0.08 + i * pw, y + ts * 0.16, pw - 1, ts * 0.68, 3);
 c.fill();
 c.stroke();
 }
 c.fillStyle = '#633814';
 c.fillRect(x + ts * 0.06, y + ts * 0.14, ts * 0.88, ts * 0.08);
 c.strokeRect(x + ts * 0.06, y + ts * 0.14, ts * 0.88, ts * 0.08);
 c.fillRect(x + ts * 0.06, y + ts * 0.78, ts * 0.88, ts * 0.08);
 c.strokeRect(x + ts * 0.06, y + ts * 0.78, ts * 0.88, ts * 0.08);
 }
}

function hexToAbgr32(hex) {
 const n = parseInt(hex.slice(1), 16);
 const r = (n >> 16) & 255;
 const g = (n >> 8) & 255;
 const b = n & 255;
 return (255 << 24) | (b << 16) | (g << 8) | r;
}

function bakeOverviewTerrain() {
 const w = overviewCanvas.width;
 const h = overviewCanvas.height;
 octx.imageSmoothingEnabled = false;

 // 1. Холодный глубокий тёмно-синий морской градиент позднего ноября
 const seaGrad = octx.createLinearGradient(0, 0, w, h);
 seaGrad.addColorStop(0, '#0E2F56');
 seaGrad.addColorStop(0.55, '#0B2545');
 seaGrad.addColorStop(1, '#07172E');
 octx.fillStyle = seaGrad;
 octx.fillRect(0, 0, w, h);

 // Холодные волны на фоне ноябрьского моря
 octx.strokeStyle = 'rgba(120, 168, 214, 0.20)';
 octx.lineWidth = 1.6;
 for (let wy = 10; wy < h; wy += 18) {
 for (let wx = (wy % 36 === 0 ? 8 : 22); wx < w - 16; wx += 38) {
 octx.beginPath();
 octx.moveTo(wx, wy);
 octx.quadraticCurveTo(wx + 7, wy - 2.5, wx + 14, wy);
 octx.stroke();
 }
 }

 // 2. Рисуем тайлы суши, отмелей, пляжей и осенние детали (листья, сухую траву, камушки) ОДИН РАЗ при загрузке
 for (let ty = 0; ty < MAP_ROWS; ty++) {
 const rowOff = ty * MAP_COLS;
 const pyBase = ty * OVERVIEW_SCALE;
 for (let tx = 0; tx < MAP_COLS; tx++) {
 const tType = TILE_GRID[rowOff + tx];
 if (tType === 0) continue;
 const pxBase = tx * OVERVIEW_SCALE;
 octx.fillStyle = TILE_PALETTE[tType];
 octx.fillRect(pxBase, pyBase, OVERVIEW_SCALE, OVERVIEW_SCALE);

 if (tType === 11) {
 octx.fillStyle = '#a87d4f';
 octx.fillRect(pxBase + 2, pyBase + 2, 1, 1);
 octx.fillRect(pxBase + 5, pyBase + 5, 1, 1);
 } else if (tType >= 2 && tType <= 8) {
 const h1 = hash2D(tx, ty);
 const h2 = hash2D(ty + 17, tx + 31);
 const h3 = hash2D(tx * 3 + 7, ty * 5 + 11);
 if (h1 > 0.36) {
 octx.fillStyle = h1 > 0.72 ? '#d97b29' : (h1 > 0.52 ? '#b84a1e' : '#e3a838');
 octx.fillRect(pxBase + 1 + Math.floor(h2 * 5), pyBase + 1 + Math.floor(h3 * 5), 1, 1);
 }
 if (h3 > 0.58) {
 octx.fillStyle = '#4f3f1d';
 octx.fillRect(pxBase + 1 + Math.floor(h1 * 5), pyBase + 2 + Math.floor(h2 * 4), 1, 1);
 }
 if (h1 < 0.34 && h2 > 0.35) {
 octx.fillStyle = '#7d7063';
 octx.fillRect(pxBase + 1 + Math.floor(h3 * 5), pyBase + 1 + Math.floor(h1 * 5), 1, 1);
 }
 }
 }
 }

 // 3. Декорации для крупных объектов (горы, деревья, мосты)
 for (let ty = 0; ty < MAP_ROWS; ty++) {
 for (let tx = 0; tx < MAP_COLS; tx++) {
 const p = TILE_PROPS[ty * MAP_COLS + tx];
 if (p === 1 || p === 3 || p === 4 || p === 6) {
 drawTileDecoration(octx, tx, ty, OVERVIEW_SCALE);
 }
 }
 }

 // 4. Вместо белого фона с облаками вокруг острова — морская дымка (#0277BD — #01579B) только над неоткрытой сушей, а вокруг острова — чистое море с волнами!
 const tempCloud = document.createElement('canvas');
 tempCloud.width = w;
 tempCloud.height = h;
 const tctx = tempCloud.getContext('2d');
 tctx.clearRect(0, 0, w, h);

 const fogGrad = tctx.createLinearGradient(0, 0, w, h);
 fogGrad.addColorStop(0, 'rgba(14, 47, 86, 0.82)');
 fogGrad.addColorStop(1, 'rgba(9, 30, 58, 0.88)');

 for (let ty = 0; ty < MAP_ROWS; ty++) {
 const rowOff = ty * MAP_COLS;
 const pyBase = ty * OVERVIEW_SCALE;
 for (let tx = 0; tx < MAP_COLS; tx++) {
 const tType = TILE_GRID[rowOff + tx];
 if (tType <= 1) continue; // Вокруг острова и в море нет белых облаков — виден морской градиент с волнами!
 tctx.fillStyle = fogGrad;
 tctx.fillRect(tx * OVERVIEW_SCALE, pyBase, OVERVIEW_SCALE, OVERVIEW_SCALE);
 }
 }

 // Лёгкие волнистые линии на морской дымке
 tctx.strokeStyle = 'rgba(179, 229, 252, 0.25)';
 tctx.lineWidth = 1.5;
 for (let i = 0; i < 140; i++) {
 const cx = hash2D(i, 41) * w;
 const cy = hash2D(73, i) * h;
 const tx = Math.floor(cx / OVERVIEW_SCALE);
 const ty = Math.floor(cy / OVERVIEW_SCALE);
 if (tx >= 0 && tx < MAP_COLS && ty >= 0 && ty < MAP_ROWS && TILE_GRID[ty * MAP_COLS + tx] > 1) {
 tctx.beginPath();
 tctx.moveTo(cx - 8, cy);
 tctx.quadraticCurveTo(cx, cy - 3, cx + 8, cy);
 tctx.stroke();
 }
 }

 const cData = tctx.getImageData(0, 0, w, h);
 cloudBasePixels32.set(new Uint32Array(cData.data.buffer));
}

function rebuildFogCanvas() {
 const w = fogCanvas.width;
 fogPixels32.set(cloudBasePixels32);

 for (let ty = 0; ty < MAP_ROWS; ty++) {
 const rowOff = ty * MAP_COLS;
 const pyBase = ty * OVERVIEW_SCALE;
 for (let tx = 0; tx < MAP_COLS; tx++) {
 if (FOG_GRID[rowOff + tx] === 1) {
 const pxBase = tx * OVERVIEW_SCALE;
 for (let oy = 0; oy < OVERVIEW_SCALE; oy++) {
 const dstRow = (pyBase + oy) * w + pxBase;
 for (let ox = 0; ox < OVERVIEW_SCALE; ox++) {
 fogPixels32[dstRow + ox] = 0;
 }
 }
 }
 }
 }
 fctx.putImageData(fogImageData, 0, 0);
 fogLayerDirty = false;
}

function canAffordAnything() {
 if (!state.shipBuilt && !state.shipBuild && state.logs >= SHIP_BUILD_LOGS && state.coins >= SHIP_BUILD_COINS) return true;
 if (state.boars.length < getMaxHerdCapacity()) {
 const cheapestBoar = BOAR_CATALOG.find((b) => state.coins >= b.price);
 if (cheapestBoar) return true;
 }
 if (state.barnLevel < BARN_CONFIG.maxLevel && state.coins >= getBarnPrice()) return true;
 const nextField = FIELD_CONFIGS.find((f) => !state.unlockedFields.includes(f.id));
 if (nextField && state.coins >= nextField.price) return true;
 if (state.plotCount < getMaxPlotsAllowed() && state.coins >= getPlotPrice()) return true;
 if (state.growthSpeedLevel < 10 && state.coins >= getSpeedPrice()) return true;
 if (state.scoutSpeedLevel < 8 && state.coins >= getScoutSpeedPrice()) return true;
 if (state.scoutVisionLevel < 8 && state.coins >= getScoutVisionPrice()) return true;
 return false;
}

function getBarnPrice() {
 return Math.round(BARN_CONFIG.basePrice * Math.pow(BARN_CONFIG.priceMult, state.barnLevel));
}
function getPlotPrice() {
 return Math.round(180 * Math.pow(1.42, state.plotCount - 3));
}
function getSpeedPrice() {
 return Math.round(160 * Math.pow(1.95, state.growthSpeedLevel - 1));
}
function getScoutSpeedPrice() {
 return Math.round(270 * Math.pow(1.85, state.scoutSpeedLevel - 1));
}
function getScoutVisionPrice() {
 return Math.round(330 * Math.pow(1.9, state.scoutVisionLevel - 1));
}

/**
 * УТИЛИТЫ РИСОВАНИЯ
 */
function roundRect(ctx, x, y, w, h, r) {
 const radius = Math.min(r, w / 2, h / 2);
 ctx.beginPath();
 ctx.moveTo(x + radius, y);
 ctx.lineTo(x + w - radius, y);
 ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
 ctx.lineTo(x + w, y + h - radius);
 ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
 ctx.lineTo(x + radius, y + h);
 ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
 ctx.lineTo(x, y + radius);
 ctx.quadraticCurveTo(x, y, x + radius, y);
 ctx.closePath();
}

const cachedShadowCanvas = (() => {
 const c = document.createElement('canvas');
 c.width = 96;
 c.height = 48;
 const g = c.getContext('2d');
 const sg = g.createRadialGradient(48, 24, 4, 48, 24, 44);
 sg.addColorStop(0, 'rgba(15, 24, 10, 0.36)');
 sg.addColorStop(0.65, 'rgba(15, 24, 10, 0.16)');
 sg.addColorStop(1, 'rgba(15, 24, 10, 0)');
 g.fillStyle = sg;
 g.beginPath();
 g.ellipse(48, 24, 44, 20, 0, 0, Math.PI * 2);
 g.fill();
 return c;
})();

function drawGroundShadow(ctx, x, y, rx, ry) {
 const w = rx * 2.24;
 const h = ry * 2.24;
 ctx.drawImage(cachedShadowCanvas, x - w * 0.5, y - h * 0.5, w, h);
}

function formatCropHarvestText(cropId, amount) {
 if (cropId === 'carrot') return `+${amount} ${amount === 1 ? 'морковь' : (amount < 5 ? 'моркови' : 'морковей')}`;
 if (cropId === 'pumpkin') return `+${amount} ${amount === 1 ? 'тыква' : (amount < 5 ? 'тыквы' : 'тыкв')}`;
 return `+${amount} ${amount === 1 ? 'жёлудь' : (amount < 5 ? 'жёлудя' : 'желудей')}`;
}

function formatCoinsText(amount) {
 const n = Math.abs(Math.round(amount));
 const sign = amount < 0 ? '-' : '+';
 const mod10 = n % 10;
 const mod100 = n % 100;
 const word = (mod10 === 1 && mod100 !== 11) ? 'монета' : ((mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) ? 'монеты' : 'монет');
 return `${sign}${n} ${word}`;
}

function drawWoodenPlaque(ctx, x, y, w, h, bg = '#f4dcb8', border = '#59361c') {
 const rx = Math.round(x);
 const ry = Math.round(y);
 const rw = Math.round(w);
 const rh = Math.round(h);
 ctx.save();
 ctx.fillStyle = '#2e1a0c';
 ctx.fillRect(rx + 3, ry + 3, rw, rh);
 ctx.fillStyle = bg;
 ctx.fillRect(rx, ry, rw, rh);
 ctx.strokeStyle = border;
 ctx.lineWidth = 3;
 ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);
 ctx.restore();
}

function drawCartoonButton(ctx, x, y, w, h, r = 0, topColor = '#8c5228', bottomColor = '#784421', pressed = false) {
 const ox = pressed ? 2 : 0;
 const oy = pressed ? 2 : 0;
 const rx = Math.round(x + ox);
 const ry = Math.round(y + oy);
 const rw = Math.round(w);
 const rh = Math.round(h);

 ctx.save();
 // Жёсткая пиксельная тень без размытия (3px 3px 0 #2e1a0c)
 ctx.fillStyle = '#2e1a0c';
 ctx.fillRect(Math.round(x + 3), Math.round(y + 3), rw, rh);

 // Основная деревянная / пергаментная плашка
 ctx.fillStyle = topColor;
 ctx.fillRect(rx, ry, rw, rh);

 // Нижняя ступенька и верхний блик
 ctx.fillStyle = bottomColor;
 ctx.fillRect(rx, ry + rh - 4, rw, 4);
 ctx.fillStyle = 'rgba(255, 248, 228, 0.28)';
 ctx.fillRect(rx + 2, ry + 2, Math.max(2, rw - 4), 3);

 // Чёткая пиксельная рамка 3px solid #59361c
 ctx.strokeStyle = '#59361c';
 ctx.lineWidth = 3;
 ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);
 ctx.restore();
}

let _lastCanvasFont = '';
function drawOutlinedText(text, x, y, fontSize, fill = '#fff6df', align = 'center', strokeW = 2.5, usePixelTitle = false) {
 const pxSize = Math.max(11, Math.round(fontSize * 1.08));
 const nextFont = usePixelTitle
 ? `800 ${Math.max(12, pxSize)}px 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif`
 : `700 ${pxSize}px 'Pixelify Sans', 'Rubik', system-ui, -apple-system, sans-serif`;

 if (_lastCanvasFont !== nextFont) {
 ctx.font = nextFont;
 _lastCanvasFont = nextFont;
 }
 ctx.textAlign = align;
 ctx.textBaseline = 'middle';

 const tx = Math.round(x);
 const ty = Math.round(y);
 const isDarkText = (
 fill === '#2e1a0c' ||
 fill === '#59361c' ||
 fill === '#245912' ||
 fill === '#6b320e' ||
 fill === '#1f1107'
 );

 if (!isDarkText) {
 ctx.fillStyle = '#1f1107';
 ctx.fillText(text, tx + 1, ty + 2);
 if (strokeW >= 3.0) {
 ctx.fillText(text, tx - 1, ty + 1);
 }
 }
 ctx.fillStyle = fill;
 ctx.fillText(text, tx, ty);
}

function isRectVisible(rx, ry, rw, rh, margin = 150) {
 const viewW = W / camera.zoom;
 const viewH = H / camera.zoom;
 return (
 rx + rw + margin >= camera.x &&
 rx - margin <= camera.x + viewW &&
 ry + rh + margin >= camera.y &&
 ry - margin <= camera.y + viewH
 );
}

/**
 * ОТРИСОВКА ТОЛЬКО ВИДИМОЙ ЧАСТИ КАРТЫ (БЕЗ ПЕРЕГРУЗКИ МОБИЛЬНОГО GPU)
 */
function drawVisibleLayerCropped(sourceCanvas) {
 const viewW = W / camera.zoom;
 const viewH = H / camera.zoom;
 const visX = Math.max(0, camera.x);
 const visY = Math.max(0, camera.y);
 const visRight = Math.min(WORLD.w, camera.x + viewW);
 const visBottom = Math.min(WORLD.h, camera.y + viewH);
 const visW = visRight - visX;
 const visH = visBottom - visY;
 if (visW <= 0 || visH <= 0) return;

 const ratio = sourceCanvas.width / WORLD.w;
 ctx.imageSmoothingEnabled = false;
 ctx.drawImage(
 sourceCanvas,
 visX * ratio,
 visY * ratio,
 visW * ratio,
 visH * ratio,
 visX,
 visY,
 visW,
 visH
 );
}

function drawAmbientLife(now) {
 if (camera.zoom < 0.42) return;
 const phase = getDayPhaseInfo(state.gameMinutes);
 const isNight = phase.label === 'ночь' || phase.label === 'вечер';
 const baseWx = WORLD.penRect.x + 250;
 const baseWy = WORLD.penRect.y + 220;

 ctx.save();
 const count = isNight ? 8 : 5;
 for (let i = 0; i < count; i++) {
 const angle = now / (2200 + i * 240) + i * 2.3;
 const radX = 240 + (i % 4) * 210;
 const radY = 190 + (i % 3) * 185;
 const bx = baseWx + Math.cos(angle) * radX + (i - 2) * 140;
 const by = baseWy + Math.sin(angle * 1.3) * radY + ((i % 3) - 1) * 220;
 if (!isRectVisible(bx - 20, by - 20, 40, 40, 20)) continue;

 if (isNight) {
 // Светлячки в сумерках и ночью
 const glow = 0.45 + 0.55 * Math.sin(now / 220 + i * 2.3);
 ctx.fillStyle = `rgba(184, 255, 77, ${glow * 0.38})`;
 ctx.beginPath();
 ctx.arc(bx, by, 9, 0, Math.PI * 2);
 ctx.fill();
 ctx.fillStyle = '#eaff8f';
 ctx.beginPath();
 ctx.arc(bx, by, 3, 0, Math.PI * 2);
 ctx.fill();
 } else {
 // Опадающие ноябрьские листья, кружащиеся на ветру
 ctx.save();
 ctx.translate(bx, by + Math.sin(now / 420 + i) * 14);
 ctx.rotate(Math.sin(now / 360 + i) * 0.7);
 ctx.fillStyle = i % 2 === 0 ? '#d9822b' : '#a8431b';
 ctx.fillRect(-4, -3, 8, 5);
 ctx.fillStyle = '#f0a830';
 ctx.fillRect(-2, -2, 4, 3);
 ctx.restore();
 }
 }
 ctx.restore();
}

function drawTerrainAndTiles(now = 0) {
 ctx.imageSmoothingEnabled = false;

 const viewW = W / camera.zoom;
 const viewH = H / camera.zoom;
 ctx.fillStyle = '#0B2545';
 ctx.fillRect(camera.x - 10, camera.y - 10, viewW + 20, viewH + 20);

 drawVisibleLayerCropped(overviewCanvas);

 if (camera.zoom >= 0.36) {
 const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
 const endCol = Math.min(MAP_COLS - 1, Math.ceil((camera.x + viewW) / TILE_SIZE));
 const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
 const endRow = Math.min(MAP_ROWS - 1, Math.ceil((camera.y + viewH) / TILE_SIZE));

 // Анимируем видимую рябь на воде одним общим проходом
 const waveShift = Math.sin(now / 520) * 5.0;
 ctx.strokeStyle = 'rgba(165, 205, 240, 0.28)';
 ctx.lineWidth = 2.2;
 ctx.beginPath();
 for (let ty = startRow; ty <= endRow; ty++) {
 const rowOff = ty * MAP_COLS;
 const y = ty * TILE_SIZE;
 for (let tx = startCol; tx <= endCol; tx++) {
 const idx = rowOff + tx;
 if (FOG_GRID[idx] === 0) continue;
 const tType = TILE_GRID[idx];
 if (tType === 0 || tType === 1 || tType === 10) {
 const x = tx * TILE_SIZE;
 const wOff = ((tx + ty) % 2 === 0) ? waveShift : -waveShift;
 ctx.moveTo(x + 14 + wOff, y + 22);
 ctx.lineTo(x + 34 + wOff, y + 22);
 ctx.moveTo(x + 24 - wOff, y + 44);
 ctx.lineTo(x + 46 - wOff, y + 44);
 }
 }
 }
 ctx.stroke();

 // Объёмные деревья, скалы и мосты в зоне видимости
 for (let ty = startRow; ty <= endRow; ty++) {
 const rowOff = ty * MAP_COLS;
 for (let tx = startCol; tx <= endCol; tx++) {
 const idx = rowOff + tx;
 if (FOG_GRID[idx] === 0 || TILE_PROPS[idx] === 0) continue;
 drawTileDecoration(ctx, tx, ty, TILE_SIZE, now);
 }
 }
 }
}

function drawChimneySmoke(ctx, chimneyX, chimneyY, now, seed = 0) {
 ctx.save();
 const puffs = 5;
 for (let i = 0; i < puffs; i++) {
 const cycle = ((now / 3200) + i / puffs + seed) % 1;
 const rise = cycle * 48;
 const drift = Math.sin(cycle * Math.PI * 2.2 + i + seed * 4) * (5 + cycle * 9) + cycle * 12;
 const px = Math.round(chimneyX + drift);
 const py = Math.round(chimneyY - rise);
 const sz = Math.round(5 + cycle * 7);
 const alpha = Math.sin(cycle * Math.PI) * 0.62;

 ctx.fillStyle = `rgba(248, 242, 230, ${alpha.toFixed(3)})`;
 ctx.fillRect(px - Math.floor(sz / 2), py - Math.floor(sz / 2), sz, sz);
 ctx.fillStyle = `rgba(210, 198, 180, ${(alpha * 0.72).toFixed(3)})`;
 ctx.fillRect(px - Math.floor(sz / 2) + 2, py + Math.floor(sz / 2) - 2, Math.max(3, sz - 2), 2);
 }
 ctx.restore();
}

function drawPenAndBoars() {
 const { x, y, w, h } = WORLD.penRect;
 if (!isRectVisible(x, y, w, h, 140)) return;

 drawGroundShadow(ctx, x + w / 2, y + h + 6, w * 0.5, 22);
 // Охристо-бурая земля двора загона
 ctx.fillStyle = '#8b6336';
 ctx.strokeStyle = '#2b1d0e';
 ctx.lineWidth = 3.5;
 roundRect(ctx, x + 22, y + 60, w - 44, h - 72, 22);
 ctx.fill();
 ctx.stroke();

 // Вырезанный пиксельный свинарник-сарай с сеном и забором
 const penSpr = worldSpriteImages.pigsty_barn;
 if (penSpr && penSpr.complete && penSpr.naturalWidth > 0) {
 ctx.imageSmoothingEnabled = false;
 ctx.drawImage(penSpr, Math.round(x - 16), Math.round(y - 108), Math.round(w + 32), Math.round(h + 132));
 } else {
 drawFenceHorizontal(x, y, w);
 }

 const badgeW = 148;
 const badgeH = 30;
 const bxBadge = x + w / 2 - badgeW / 2;
 const byBadge = y - 19;
 drawWoodenPlaque(ctx, bxBadge, byBadge, badgeW, badgeH, '#f4dcb8', '#59361c');
 drawOutlinedText(`СТАДО: ${state.boars.length}/${getMaxHerdCapacity()}`, x + w / 2, byBadge + badgeH / 2 + 1, 12.5, '#2e1a0c', 'center', 0);

 activeBoars.sort((a, b) => a.y - b.y);

 for (let i = 0; i < activeBoars.length; i++) {
 const boar = activeBoars[i];
 const bx = x + 56 + boar.x * (w - 112);
 const by = y + 56 + boar.y * (h - 94);

 const sprite = boarSprites[boar.id];
 const baseSize = 104 * boar.scale;

 let jumpOffset = 0;
 let scaleX = 1;
 let scaleY = 1;
 let tilt = 0;

 // Живое дыхание + пружинящее покачивание при ходьбе и прыжке
 const breath = Math.sin(boar.breathPhase || 0) * 0.028;
 if (boar.bounceTime > 0) {
 const t = 1 - boar.bounceTime;
 jumpOffset = Math.sin(t * Math.PI) * 38;
 const squash = Math.sin(t * Math.PI * 2) * 0.24;
 scaleX = 1 + squash;
 scaleY = 1 - squash;
 tilt = Math.sin(t * Math.PI * 2) * 0.08;
 } else if (boar.waitTimer <= 0) {
 const wobble = Math.sin(boar.walkPhase) * 0.055;
 scaleX = 1 + wobble + breath;
 scaleY = 1 - wobble - breath;
 jumpOffset = Math.abs(Math.sin(boar.walkPhase)) * 5.5;
 tilt = Math.sin(boar.walkPhase) * 0.045;
 } else {
 scaleX = 1 + breath;
 scaleY = 1 - breath * 1.15;
 }

 const shadowScale = Math.max(0.5, 1 - jumpOffset / 115);
 drawGroundShadow(ctx, bx, by + baseSize * 0.39, baseSize * 0.38 * shadowScale, baseSize * 0.13 * shadowScale);

 ctx.save();
 ctx.translate(bx, by - jumpOffset);
 ctx.rotate(tilt * boar.facing);
 ctx.scale(boar.facing * scaleX, scaleY);

 if (sprite && sprite.complete && sprite.naturalWidth > 0) {
 const aspect = sprite.naturalWidth / sprite.naturalHeight;
 const drawW = baseSize * aspect;
 const drawH = baseSize;
 ctx.drawImage(sprite, -drawW / 2, -drawH / 2, drawW, drawH);



 if (boar.gender === 'female') {
 // Бантик высоко на макушке/ушке (не закрывает глаз!)
 drawGirlBow(ctx, drawW * 0.04, -drawH * 0.45, 0.96 * boar.scale);
 }
 } else {
 ctx.fillStyle = '#2e1a0c';
 ctx.fillRect(-20, 22, 8, 10);
 ctx.fillRect(12, 22, 8, 10);
 ctx.fillStyle = '#f2a2b8';
 ctx.strokeStyle = '#2e1a0c';
 ctx.lineWidth = 3;
 ctx.fillRect(-28, -14, 56, 38);
 ctx.strokeRect(-28, -14, 56, 38);
 ctx.fillRect(10, -22, 10, 10);
 ctx.strokeRect(10, -22, 10, 10);
 ctx.fillStyle = '#ff7597';
 ctx.fillRect(22, -2, 12, 14);
 ctx.strokeRect(22, -2, 12, 14);
 ctx.fillStyle = '#2e1a0c';
 ctx.fillRect(26, 2, 2, 4);
 ctx.fillRect(30, 2, 2, 4);
 ctx.fillRect(14, -6, 4, 4);
 }
 ctx.restore();

 if (boar.heartsTime > 0) {
 drawHeart(ctx, bx, by - baseSize * 0.62 - jumpOffset, 11);
 }

 // Отображение клички, породы и сытости хряка на контрастной подложке
 const showPlate = camera.zoom >= 0.62 || boar.labelTimer > 0 || boar.fullnessTimer > 0;
 if (showPlate) {
 const tagY = by + baseSize * 0.43 - jumpOffset * 0.35;
 const genTag = (boar.generation || 1) > 1 ? ` · П.${boar.generation}` : '';
 const sexIcon = boar.gender === 'female' ? '♀ ' : '♂ ';
 const nameColor = boar.gender === 'female' ? '#ffb8d0' : '#ffe066';
 const plateH = boar.fullnessTimer > 0 ? 41 : 28;
 ctx.fillStyle = 'rgba(34, 18, 7, 0.78)';
 ctx.fillRect(Math.round(bx - 54), Math.round(tagY - 9), 108, plateH);
 drawOutlinedText(`${sexIcon}${boar.nickname}${genTag}`, bx, tagY, 12.5, nameColor, 'center', 2);
 drawOutlinedText(boar.breed, bx, tagY + 13, 10.8, '#fff8e7', 'center', 2);
 if (boar.fullnessTimer > 0) {
 drawOutlinedText(`Сыт (${Math.ceil(boar.fullnessTimer)}с)`, bx, tagY + 26, 10.5, '#ff9ff3', 'center', 2);
 }
 }
 }

 if (!(worldSpriteImages.pigsty_barn && worldSpriteImages.pigsty_barn.complete)) {
 drawFenceVertical(x, y, h);
 drawFenceVertical(x + w, y, h);
 drawFenceHorizontal(x, y + h, w);
 }

 if (state.food > 0 && activeBoars.length > 0) {
 const hungryCount = activeBoars.filter((b) => b.fullnessTimer <= 0).length;
 const fb = getFeedAllWorldRect();
 if (hungryCount > 0) {
 drawCartoonButton(ctx, fb.x, fb.y, fb.w, fb.h, 12, '#ff6b6b', '#ee5253', false);
 drawCartoonIcon(ctx, 'feed_all', fb.x + 22, fb.y + fb.h / 2, 24);
 drawOutlinedText(`Кормить (${hungryCount})`, fb.x + 82, fb.y + fb.h / 2 + 1, 12, '#ffffff', 'center', 3);
 } else {
 drawCartoonButton(ctx, fb.x, fb.y, fb.w, fb.h, 12, '#b2bec3', '#636e72', false);
 drawOutlinedText('Все сыты', fb.x + fb.w / 2, fb.y + fb.h / 2 + 1, 12.5, '#ffffff', 'center', 3);
 }
 }
}

function getFieldPlotRects(fieldCfg) {
 const { x, y, w, h } = fieldCfg.rect;
 const cols = 3;
 const rows = 2;
 const innerPadX = 14;
 const innerPadY = 44;
 const gapX = 10;
 const gapY = 10;
 const cellW = (w - innerPadX * 2 - gapX * (cols - 1)) / cols;
 const cellH = (h - innerPadY - 14 - gapY * (rows - 1)) / rows;

 const rects = [];
 for (let i = 0; i < 6; i++) {
 const r = Math.floor(i / cols);
 const c = i % cols;
 rects.push({
 localIndex: i,
 x: x + innerPadX + c * (cellW + gapX),
 y: y + innerPadY + r * (cellH + gapY),
 w: cellW,
 h: cellH
 });
 }
 return rects;
}

 if (caravan.status === 'voyage_prep' && state.voyage) {

 drawOutlinedText(`Отплытие через ${formatRealDuration(remMs)}`, 0, 32, 12.5, '#ffe047', 'center', 3.4);

 }

 ctx.restore();
}

function getDayPhaseInfo(minutes) {
 const m = ((minutes % 1440) + 1440) % 1440;
 const hh = Math.floor(m / 60);
 const mm = Math.floor(m % 60);
 const timeStr = `${hh.toString().padStart(2, '0')}:${mm.toString().padStart(2, '0')}`;

 if (m >= 300 && m < 450) {
 const t = (m - 300) / 150;
 return { timeStr, label: 'утро', tint: `rgba(255, 185, 110, ${0.2 * Math.sin(t * Math.PI)})`, glowAlpha: 0.45 * (1 - t) };
 }
 if (m >= 450 && m < 1080) {
 return { timeStr, label: 'день', tint: null, glowAlpha: 0 };
 }
 if (m >= 1080 && m < 1230) {
 const t = (m - 1080) / 150;
 return { timeStr, label: 'вечер', tint: `rgba(255, 126, 75, ${0.25 * Math.sin(t * Math.PI)})`, glowAlpha: 0.75 * t };
 }
 return { timeStr, label: 'ночь', tint: 'rgba(20, 32, 62, 0.48)', glowAlpha: 0.9 };
}
