<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Хряки Ферма — Brawl Stars UI & Pixel Map (v23)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&family=Sofia+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      width: 100vw;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #0277BD 0%, #01579B 100%);
      font-family: 'Rubik', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      touch-action: none;
    }

    button, input, select {
      font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      width: 100vw;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Горизонтальная лента быстрого перехода по локациям (Brawl Stars UI) */
    #locationNavStrip {
      position: fixed;
      left: 10px;
      top: 52px;
      right: 138px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      padding: 2px 4px 6px 2px;
      z-index: 60;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    #locationNavStrip::-webkit-scrollbar {
      display: none;
    }

    .loc-nav-btn {
      flex: 0 0 auto;
      font-family: 'Sofia Sans Condensed', sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: 0.3px;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      background: linear-gradient(180deg, #38b6ff 0%, #1976d2 100%);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      box-shadow: 0 4px 0 #2b1d0e;
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    }

    .loc-nav-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2b1d0e;
    }

    .loc-nav-btn.loc-warm {
      background: linear-gradient(180deg, #FFC107 0%, #F57C00 100%);
      color: #ffffff;
    }

    .loc-nav-btn.loc-green {
      background: linear-gradient(180deg, #2ECC71 0%, #1E8449 100%);
      color: #ffffff;
    }

    .loc-nav-btn.loc-locked {
      background: linear-gradient(180deg, #607d8b 0%, #455a64 100%);
      color: #cfd8dc;
    }

    /* Оверлеи модальных окон в стиле Brawl Stars */
    #shopModal, .game-modal {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, rgba(15, 25, 45, 0.68) 0%, rgba(8, 14, 26, 0.88) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 105;
      padding: 12px;
      touch-action: auto;
    }

    #shopModal.active, .game-modal.active {
      display: flex;
    }

    .shop-window {
      width: 100%;
      max-width: 444px;
      max-height: 86vh;
      background: linear-gradient(180deg, #FFF5DC 0%, #f5dfb0 100%);
      border: 3px solid #2b1d0e;
      border-radius: 22px;
      box-shadow:
        0 8px 0 #2b1d0e,
        0 20px 38px rgba(0, 0, 0, 0.65),
        inset 0 3px 0 rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: brawlPopIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes brawlPopIn {
      0% { transform: scale(0.84) translateY(18px); opacity: 0; }
      70% { transform: scale(1.03) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .shop-header {
      position: relative;
      background: linear-gradient(180deg, #2ECC71 0%, #1E8449 100%);
      border-bottom: 3px solid #2b1d0e;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.45);
    }

    .shop-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .shop-title {
      font-family: 'Rubik', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .shop-balance {
      background: rgba(15, 25, 45, 0.85);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 4px 12px 4px 7px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 0 #2b1d0e;
      font-family: 'Rubik', sans-serif;
      font-size: 14.5px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      flex-shrink: 0;
    }

    .close-btn {
      width: 40px;
      height: 40px;
      background: linear-gradient(180deg, #ff5252 0%, #d32f2f 100%);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      color: #fff;
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: 18px;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      cursor: pointer;
      box-shadow: 0 4px 0 #2b1d0e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .close-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2b1d0e;
    }

    /* Панель вкладок в стиле Brawl Stars */
    .shop-tabs {
      display: flex;
      background: rgba(15, 25, 45, 0.88);
      border-bottom: 3px solid #2b1d0e;
      padding: 8px 8px 6px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 7px 6px;
      font-family: 'Sofia Sans Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(180deg, #34495e 0%, #2c3e50 100%);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      box-shadow: 0 4px 0 #2b1d0e;
      color: #ecf0f1;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #FFC107 0%, #FFA000 100%);
      color: #ffffff;
      transform: translateY(1px);
      box-shadow: 0 3px 0 #2b1d0e;
    }

    .shop-content {
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #FFF5DC;
      -webkit-overflow-scrolling: touch;
    }

    .shop-card {
      background: #ffffff;
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 0 #2b1d0e;
    }

    .shop-card.unlocked-card {
      background: linear-gradient(180deg, #f4fff6 0%, #e3f9e8 100%);
    }

    .card-avatar {
      width: 62px;
      height: 62px;
      background: radial-gradient(circle at 30% 26%, #4facfe 0%, #00f2fe 100%);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 4px 0 #2b1d0e;
    }

    .card-avatar canvas {
      width: 54px;
      height: 54px;
      object-fit: contain;
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      font-family: 'Rubik', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #2b1d0e;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .breed-badge {
      font-family: 'Sofia Sans Condensed', sans-serif;
      background: rgba(15, 25, 45, 0.85);
      color: #ffffff;
      border: 2px solid #2b1d0e;
      border-radius: 10px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
    }

    .card-desc {
      font-family: 'Sofia Sans Condensed', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      color: #5c4328;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .stat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .stat-chip {
      font-family: 'Sofia Sans Condensed', sans-serif;
      background: #FFF5DC;
      border: 2px solid #2b1d0e;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: #2b1d0e;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      box-shadow: 0 2px 0 #2b1d0e;
    }

    .stat-chip.highlight {
      background: #FFC107;
      color: #2b1d0e;
    }

    .upgrade-bar {
      width: 100%;
      height: 12px;
      background: rgba(15, 25, 45, 0.8);
      border: 2px solid #2b1d0e;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .upgrade-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2ECC71 0%, #a3e635 100%);
      border-right: 2px solid #2b1d0e;
      transition: width 0.25s ease;
    }

    /* Кнопки Brawl Stars с нижней ступенькой */
    .buy-btn {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(180deg, #2ECC71 0%, #27ae60 100%);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      box-shadow: 0 4px 0 #2b1d0e;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .buy-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2b1d0e;
    }

    .buy-btn:disabled {
      background: linear-gradient(180deg, #90a4ae 0%, #607d8b 100%);
      color: #eceff1;
      box-shadow: 0 4px 0 #2b1d0e;
      cursor: not-allowed;
    }

    .buy-btn.owned {
      background: linear-gradient(180deg, #FFC107 0%, #FFA000 100%);
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
    }

    .breed-pair-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(15, 25, 45, 0.8);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 4px 0 #2b1d0e;
    }

    .parent-slot {
      flex: 1;
      background: #FFF5DC;
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #2b1d0e;
      transition: transform 0.08s ease;
    }

    .parent-slot:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2b1d0e;
    }

    .parent-slot canvas {
      width: 50px;
      height: 50px;
      display: block;
      margin: 0 auto 4px;
    }

    .breed-heart-mid {
      font-size: 26px;
      font-weight: 900;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.75));
    }

    .forecast-panel {
      font-family: 'Sofia Sans Condensed', sans-serif;
      background: #ffffff;
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 11px 13px;
      font-size: 14px;
      font-weight: 700;
      color: #2b1d0e;
      line-height: 1.38;
      box-shadow: 0 4px 0 #2b1d0e;
    }

    .timer-banner {
      background: rgba(15, 25, 45, 0.9);
      color: #FFC107;
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 11px;
      text-align: center;
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      box-shadow: 0 4px 0 #2b1d0e;
    }

    .sell-btn {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(180deg, #FFC107 0%, #FFA000 100%);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      box-shadow: 0 4px 0 #2b1d0e;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .sell-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2b1d0e;
    }

    .sell-btn:disabled {
      background: linear-gradient(180deg, #90a4ae 0%, #607d8b 100%);
      color: #fff;
      box-shadow: 0 4px 0 #2b1d0e;
      cursor: not-allowed;
    }

    .hot-demand-banner {
      font-family: 'Sofia Sans Condensed', sans-serif;
      background: rgba(15, 25, 45, 0.85);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 4px 0 #2b1d0e;
    }

    .gender-switch-bar {
      display: flex;
      gap: 6px;
      background: rgba(15, 25, 45, 0.8);
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      padding: 5px;
      box-shadow: 0 4px 0 #2b1d0e;
    }

    .gender-opt-btn {
      flex: 1;
      padding: 8px 6px;
      border: 2px solid #2b1d0e;
      border-radius: 14px;
      font-family: 'Rubik', sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      background: #FFF5DC;
      color: #2b1d0e;
      text-align: center;
      box-shadow: 0 4px 0 #2b1d0e;
      transition: transform 0.08s ease;
    }

    .gender-opt-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2b1d0e;
    }

    .gender-opt-btn.active-male {
      background: linear-gradient(180deg, #38b6ff 0%, #1976d2 100%);
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
    }

    .gender-opt-btn.active-female {
      background: linear-gradient(180deg, #ff7eb3 0%, #d81b60 100%);
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
    }

    .gender-tag-male {
      color: #0984e3;
      font-weight: 900;
    }

    .gender-tag-female {
      color: #d63031;
      font-weight: 900;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- Горизонтальная лента быстрого перехода по локациям (со скроллом) -->
<div id="locationNavStrip"></div>

<!-- Модальное окно лавки -->
<div id="shopModal">
  <div class="shop-window">
    <div class="shop-header">
      <div class="shop-title-wrap">
        <canvas id="shopHeaderIcon" width="32" height="32"></canvas>
        <div class="shop-title">ЛАВКА</div>
      </div>
      <div class="shop-balance">
        <canvas id="shopBalanceCoin" width="22" height="22"></canvas>
        <span id="shopCoinText">120</span>
      </div>
      <button class="close-btn" id="closeShopBtn" type="button">✕</button>
    </div>
    <div class="shop-tabs">
      <button class="tab-btn active" data-tab="boars" type="button">
        <canvas id="tabBoarIcon" width="18" height="18"></canvas>
        <span>Хряки</span>
      </button>
      <button class="tab-btn" data-tab="expedition" type="button">
        <canvas id="tabExpeditionIcon" width="18" height="18"></canvas>
        <span>Обоз</span>
      </button>
      <button class="tab-btn" data-tab="territory" type="button">
        <canvas id="tabTerritoryIcon" width="18" height="18"></canvas>
        <span>Участки</span>
      </button>
      <button class="tab-btn" data-tab="upgrades" type="button">
        <canvas id="tabGardenIcon" width="18" height="18"></canvas>
        <span>Огород</span>
      </button>
    </div>
    <div class="shop-content" id="shopList"></div>
  </div>
</div>

<!-- Модальное окно Племенного свинарника (Скрещивание) -->
<div id="breedModal" class="game-modal">
  <div class="shop-window">
    <div class="shop-header" style="background: linear-gradient(180deg, #e07a5f 0%, #9e2a2b 100%);">
      <div class="shop-title-wrap">
        <canvas id="breedHeaderIcon" width="32" height="32"></canvas>
        <div class="shop-title">ПЛЕМЕННОЙ ДВОР</div>
      </div>
      <div class="shop-balance">
        <span id="breedHerdCount">1/6</span>
      </div>
      <button class="close-btn" id="closeBreedBtn" type="button">✕</button>
    </div>
    <div class="shop-content" id="breedBody"></div>
  </div>
</div>

<!-- Модальное окно Свиноводческого рынка -->
<div id="marketModal" class="game-modal">
  <div class="shop-window">
    <div class="shop-header" style="background: linear-gradient(180deg, #f39c12 0%, #b9770e 100%);">
      <div class="shop-title-wrap">
        <canvas id="marketHeaderIcon" width="32" height="32"></canvas>
        <div class="shop-title">РЫНОК «ПЯТАЧОК»</div>
      </div>
      <div class="shop-balance">
        <canvas id="marketBalanceCoin" width="22" height="22"></canvas>
        <span id="marketCoinText">40</span>
      </div>
      <button class="close-btn" id="closeMarketBtn" type="button">✕</button>
    </div>
    <div class="shop-content" id="marketBody"></div>
  </div>
</div>

<!-- Модальное окно Лесопилки -->
<div id="sawmillModal" class="game-modal">
  <div class="shop-window">
    <div class="shop-header" style="background: linear-gradient(180deg, #b5651d 0%, #6f3e18 100%);">
      <div class="shop-title-wrap">
        <canvas id="sawmillHeaderIcon" width="32" height="32"></canvas>
        <div class="shop-title">ЛЕСОПИЛКА</div>
      </div>
      <div class="shop-balance" style="background:#deb887;">
        <canvas id="sawmillBalanceLog" width="22" height="22"></canvas>
        <span id="sawmillLogText">0</span>
      </div>
      <button class="close-btn" id="closeSawmillBtn" type="button">✕</button>
    </div>
    <div class="shop-content" id="sawmillBody"></div>
  </div>
</div>


<!-- Модальное окно Морского Похода («Вы уверены?») -->
<div id="voyageModal" class="game-modal">
  <div class="shop-window">
    <div class="shop-header" style="background: linear-gradient(180deg, #38b6ff 0%, #1976d2 52%, #0d47a1 100%);">
      <div class="shop-title-wrap">
        <canvas id="voyageHeaderIcon" width="32" height="32"></canvas>
        <div class="shop-title" id="voyageModalTitle">ВЫ УВЕРЕНЫ?</div>
      </div>
      <div class="shop-balance">
        <canvas id="voyageBalanceCoin" width="22" height="22"></canvas>
        <span id="voyageCoinText">40</span>
      </div>
      <button class="close-btn" id="closeVoyageBtn" type="button">✕</button>
    </div>
    <div class="shop-content" id="voyageBody"></div>
  </div>
</div>

<script>
/**
 * БЕЗОПАСНАЯ АСИНХРОННАЯ ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP
 */
let tg = null;
function initTelegramAsync() {
  if (window.Telegram && window.Telegram.WebApp) {
    tg = window.Telegram.WebApp;
    try {
      tg.ready();
      tg.expand();
      if (tg.requestFullscreen) tg.requestFullscreen();
      if (tg.setHeaderColor) tg.setHeaderColor('#2d6a4f');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#2b5876');
    } catch (e) {}
    return;
  }
  if (location.protocol === 'https:' || location.protocol === 'http:') {
    const s = document.createElement('script');
    s.src = 'https://telegram.org/js/telegram-web-app.js';
    s.async = true;
    s.onload = () => {
      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        try {
          tg.ready();
          tg.expand();
        } catch (e) {}
      }
    };
    document.body.appendChild(s);
  }
}

function triggerHaptic(type = 'light') {
  if (tg && tg.HapticFeedback) {
    try {
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred(type);
    } catch (e) {}
  }
}

/**
 * АУДИО-СИСТЕМА: ТОЛЬКО ЗВУКОВЫЕ ЭФФЕКТЫ (SFX) БЕЗ ФОНОВОЙ МУЗЫКИ
 */
const SoundManager = (() => {
  const MUTE_KEY = 'khryakograd_sfx_muted_v9';
  let isMuted = false;
  try {
    isMuted = localStorage.getItem(MUTE_KEY) === '1';
  } catch (e) {}

  let audioCtx = null;

  function ensureContext() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  ['pointerdown', 'touchstart', 'keydown'].forEach((evt) => {
    window.addEventListener(evt, ensureContext, { passive: true });
  });

  function playTone({ freq = 440, endFreq = null, type = 'sine', duration = 0.12, vol = 0.18, delay = 0 }) {
    if (isMuted) return;
    const ctx = ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), now);
    if (endFreq) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
    }
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + Math.min(0.015, duration * 0.25));
    gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.01);
  }

  function playNoise({ duration = 0.08, vol = 0.12, filterFreq = 900, filterType = 'bandpass', delay = 0 }) {
    if (isMuted) return;
    const ctx = ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime + delay;
    const sampleCount = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, sampleCount, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < sampleCount; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.setValueAtTime(filterFreq, now);
    filter.Q.setValueAtTime(1.6, now);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start(now);
    src.stop(now + duration + 0.01);
  }

  return {
    isMuted() {
      return isMuted;
    },
    toggleMute() {
      isMuted = !isMuted;
      try {
        localStorage.setItem(MUTE_KEY, isMuted ? '1' : '0');
      } catch (e) {}
      if (!isMuted) {
        ensureContext();
        this.uiClick();
      }
      return isMuted;
    },
    uiClick() {
      playTone({ freq: 640, endFreq: 390, type: 'triangle', duration: 0.055, vol: 0.15 });
    },
    zoomStep(dir = 1) {
      playTone({
        freq: dir > 0 ? 440 : 540,
        endFreq: dir > 0 ? 640 : 350,
        type: 'sine',
        duration: 0.075,
        vol: 0.12
      });
    },
    oink(pitchMult = 1.0) {
      if (isMuted) return;
      const ctx = ensureContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const base = 145 * pitchMult;

      [0, 0.11].forEach((offset, idx) => {
        const dur = idx === 0 ? 0.09 : 0.135;
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(base * (idx === 0 ? 0.92 : 1.05), now + offset);
        osc.frequency.exponentialRampToValueAtTime(base * (idx === 0 ? 1.26 : 0.76), now + offset + dur);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(530 * pitchMult, now + offset);
        filter.Q.setValueAtTime(3.2, now + offset);

        gain.gain.setValueAtTime(0.001, now + offset);
        gain.gain.linearRampToValueAtTime(0.19, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + dur);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + dur + 0.01);
      });
    },
    crunch() {
      playNoise({ duration: 0.065, vol: 0.16, filterFreq: 1350, delay: 0 });
      playNoise({ duration: 0.075, vol: 0.18, filterFreq: 1100, delay: 0.08 });
      this.oink(1.12);
    },
    plant() {
      playNoise({ duration: 0.075, vol: 0.13, filterFreq: 680, delay: 0 });
      playTone({ freq: 340, endFreq: 560, type: 'sine', duration: 0.09, vol: 0.15, delay: 0.02 });
    },
    waterBoost() {
      playTone({ freq: 520, endFreq: 900, type: 'sine', duration: 0.095, vol: 0.14 });
    },
    harvest() {
      playTone({ freq: 523.25, type: 'triangle', duration: 0.09, vol: 0.16, delay: 0 });
      playTone({ freq: 659.25, type: 'triangle', duration: 0.09, vol: 0.16, delay: 0.06 });
      playTone({ freq: 783.99, type: 'triangle', duration: 0.14, vol: 0.18, delay: 0.12 });
    },
    coin() {
      playTone({ freq: 987.77, type: 'sine', duration: 0.07, vol: 0.14, delay: 0 });
      playTone({ freq: 1318.51, type: 'sine', duration: 0.16, vol: 0.16, delay: 0.055 });
    },
    purchase() {
      playTone({ freq: 523.25, type: 'triangle', duration: 0.1, vol: 0.18, delay: 0 });
      playTone({ freq: 659.25, type: 'triangle', duration: 0.1, vol: 0.18, delay: 0.08 });
      playTone({ freq: 783.99, type: 'triangle', duration: 0.1, vol: 0.18, delay: 0.16 });
      playTone({ freq: 1046.50, type: 'triangle', duration: 0.24, vol: 0.22, delay: 0.24 });
    },
    marchStart() {
      playTone({ freq: 392.00, type: 'triangle', duration: 0.09, vol: 0.16, delay: 0 });
      playTone({ freq: 523.25, type: 'triangle', duration: 0.14, vol: 0.18, delay: 0.09 });
      this.oink(1.08);
    },
    chop() {
      playNoise({ duration: 0.06, vol: 0.2, filterFreq: 620, delay: 0 });
      playTone({ freq: 210, endFreq: 95, type: 'triangle', duration: 0.09, vol: 0.22, delay: 0 });
      playTone({ freq: 340, endFreq: 240, type: 'sine', duration: 0.07, vol: 0.14, delay: 0.04 });
    },
    saw() {
      playNoise({ duration: 0.14, vol: 0.14, filterFreq: 1650, delay: 0 });
      playTone({ freq: 290, endFreq: 420, type: 'sawtooth', duration: 0.14, vol: 0.11, delay: 0 });
    },
    discover() {
      playTone({ freq: 440, type: 'sine', duration: 0.1, vol: 0.18, delay: 0 });
      playTone({ freq: 554.37, type: 'sine', duration: 0.1, vol: 0.18, delay: 0.08 });
      playTone({ freq: 659.25, type: 'sine', duration: 0.12, vol: 0.18, delay: 0.16 });
      playTone({ freq: 880, type: 'sine', duration: 0.25, vol: 0.22, delay: 0.24 });
    }
  };
})();

const customIconImages = {};
Object.keys(CUSTOM_ICON_SOURCES).forEach((key) => {
  const src = CUSTOM_ICON_SOURCES[key];
  if (src) {
    const img = new Image();
    img.onload = () => {
      customIconImages[key] = img;
    };
    img.src = src;
  }
});

function drawCartoonIcon(ctx, key, cx, cy, size) {
  const custom = customIconImages[key];
  if (custom && custom.complete && custom.naturalWidth > 0) {
    const aspect = custom.naturalWidth / custom.naturalHeight;
    const target = size * 1.12;
    let dw = target;
    let dh = target;
    if (aspect > 1) {
      dh = target / aspect;
    } else {
      dw = target * aspect;
    }
    ctx.drawImage(custom, cx - dw / 2, cy - dh / 2, dw, dh);
    return;
  }

  ctx.save();
  ctx.translate(cx, cy);
  const s = size / 40;
  ctx.scale(s, s);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  if (key === 'heart') {
    const hg = ctx.createRadialGradient(-4, -5, 2, 0, 0, 16);
    hg.addColorStop(0, '#ff9eb5');
    hg.addColorStop(0.45, '#ff385c');
    hg.addColorStop(1, '#b80d2f');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.bezierCurveTo(-18, -2, -10, -16, 0, -6);
    ctx.bezierCurveTo(10, -16, 18, -2, 0, 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath();
    ctx.ellipse(-5, -6, 3, 1.8, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }
  if (key === 'sparkle') {
    const sg = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
    sg.addColorStop(0, '#ffffff');
    sg.addColorStop(0.5, '#ffe047');
    sg.addColorStop(1, '#f39c12');
    ctx.fillStyle = sg;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const r = i % 2 === 0 ? 14 : 5;
      const a = (i * Math.PI) / 4;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    return;
  }
  if (key === 'woodchip') {
    ctx.rotate(0.35);
    const wg = ctx.createLinearGradient(-10, -6, 10, 6);
    wg.addColorStop(0, '#ffeaa7');
    wg.addColorStop(1, '#d38b43');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(-10, -4);
    ctx.lineTo(8, -7);
    ctx.lineTo(11, 4);
    ctx.lineTo(-7, 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    return;
  }
  if (key === 'log') {
    // Объёмное бревно с градиентной корой, бликом и годовыми кольцами
    ctx.save();
    ctx.rotate(-0.22);
    const barkGrad = ctx.createLinearGradient(0, -9, 0, 9);
    barkGrad.addColorStop(0, '#b56e33');
    barkGrad.addColorStop(0.55, '#8c4f1e');
    barkGrad.addColorStop(1, '#59300f');
    ctx.fillStyle = barkGrad;
    roundRect(ctx, -16, -9, 26, 18, 5);
    ctx.fill();
    ctx.stroke();

    // Верхний блик на коре
    ctx.strokeStyle = 'rgba(255, 225, 175, 0.38)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, -5);
    ctx.lineTo(3, -5);
    ctx.stroke();

    // Тёмная борозда коры
    ctx.strokeStyle = '#47250a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-11, 3);
    ctx.lineTo(4, 3);
    ctx.stroke();

    // Светлый спил торца с радиальным градиентом
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2.6;
    const cutGrad = ctx.createRadialGradient(9, -1, 1, 10, 0, 9);
    cutGrad.addColorStop(0, '#fff8dc');
    cutGrad.addColorStop(0.7, '#f0c987');
    cutGrad.addColorStop(1, '#c99349');
    ctx.fillStyle = cutGrad;
    ctx.beginPath();
    ctx.ellipse(10, 0, 6.8, 8.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = '#b8762e';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(10, 0, 3.2, 4.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.restore();
    return;
  }
  if (key === 'ship') {
    // Мультяшный деревянный корабль с парусом
    ctx.fillStyle = '#8c4f1e';
    ctx.beginPath();
    ctx.moveTo(-16, 4);
    ctx.lineTo(16, 4);
    ctx.lineTo(11, 14);
    ctx.lineTo(-11, 14);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Мачта
    ctx.strokeStyle = '#1b1209';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.lineTo(0, -15);
    ctx.stroke();

    // Парус
    const sailGrad = ctx.createLinearGradient(-10, -14, 12, 2);
    sailGrad.addColorStop(0, '#ffffff');
    sailGrad.addColorStop(1, '#ffe082');
    ctx.fillStyle = sailGrad;
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.quadraticCurveTo(15, -6, 0, 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Флажок
    ctx.fillStyle = '#ff3838';
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(-9, -12);
    ctx.lineTo(0, -9);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    return;
  }
  if (key === 'sawmill') {
    // Зубчатый стальной диск циркулярной пилы с металлическим блеском
    const teeth = 12;
    const metalGrad = ctx.createLinearGradient(-14, -14, 14, 14);
    metalGrad.addColorStop(0, '#ffffff');
    metalGrad.addColorStop(0.5, '#cfd8dc');
    metalGrad.addColorStop(1, '#78909c');
    ctx.fillStyle = metalGrad;
    ctx.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const r = i % 2 === 0 ? 15.5 : 12;
      const a = (i * Math.PI) / teeth;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ff5252';
    ctx.beginPath();
    ctx.arc(0, 0, 5.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    return;
  }
  if (key === 'flag') {
    ctx.fillStyle = '#8c5327';
    roundRect(ctx, -10, -16, 4, 32, 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ff9f1a';
    ctx.beginPath();
    ctx.moveTo(-6, -15);
    ctx.lineTo(14, -8);
    ctx.lineTo(-6, -1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.fillStyle = '#ffe047';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function renderIconToCanvas(canvasEl, key) {
  if (!canvasEl) return;
  const c = canvasEl.getContext('2d');
  c.clearRect(0, 0, canvasEl.width, canvasEl.height);
  drawCartoonIcon(c, key, canvasEl.width / 2, canvasEl.height / 2, Math.min(canvasEl.width, canvasEl.height) * 0.9);
}

function hash2D(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function smoothNoise(x, y) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  const fx = x - ix;
  const fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2D(ix, iy);
  const b = hash2D(ix + 1, iy);
  const c = hash2D(ix, iy + 1);
  const d = hash2D(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

function fbm(x, y) {
  return (
    smoothNoise(x, y) * 0.55 +
    smoothNoise(x * 2.1, y * 2.1) * 0.3 +
    smoothNoise(x * 4.3, y * 4.3) * 0.15
  );
}

function buildValleyMap() {
  const cx = 80;
  const cy = 80;

  for (let ty = 0; ty < MAP_ROWS; ty++) {
    for (let tx = 0; tx < MAP_COLS; tx++) {
      const idx = ty * MAP_COLS + tx;
      const dx = (tx - cx) / 64;
      const dy = (ty - cy) / 62;
      const angle = Math.atan2(dy, dx);
      const coastWave =
        Math.cos(angle * 4 - 0.5) * 0.14 +
        Math.sin(angle * 3 + 1.2) * 0.11 +
        (fbm(tx * 0.085, ty * 0.085) - 0.5) * 0.26;
      const dist = Math.hypot(dx, dy) + coastWave;

      if (dist > 1.03) {
        TILE_GRID[idx] = 0;
        continue;
      }
      if (dist > 0.95) {
        TILE_GRID[idx] = 1;
        continue;
      }
      if (dist > 0.90) {
        TILE_GRID[idx] = 2;
        continue;
      }

      const elev = fbm(tx * 0.075 + 2.1, ty * 0.075 + 6.4);
      const moist = fbm(tx * 0.095 + 8.3, ty * 0.095 + 3.1);

      const dLake = Math.hypot((tx - 46) / 12, (ty - 54) / 10) + (fbm(tx * 0.19, ty * 0.19) - 0.5) * 0.24;
      if (dLake < 0.84) {
        TILE_GRID[idx] = 10;
        continue;
      }

      const isAlps = (ty < 42 && tx > 54 && tx < 114 && elev > 0.56) || elev > 0.73;

      if (isAlps) {
        TILE_GRID[idx] = 9;
        TILE_PROPS[idx] = elev > 0.75 ? 4 : 3;
      } else if (elev > 0.62) {
        TILE_GRID[idx] = 8;
        if (hash2D(tx, ty) > 0.48) TILE_PROPS[idx] = 3;
      } else if (moist > 0.57) {
        TILE_GRID[idx] = 6;
        if (hash2D(tx, ty) > 0.28) TILE_PROPS[idx] = 1;
      } else if (moist > 0.47) {
        TILE_GRID[idx] = 7;
        if (hash2D(tx, ty) > 0.44) TILE_PROPS[idx] = 2;
      } else if (elev < 0.37) {
        TILE_GRID[idx] = 5;
        if (hash2D(tx, ty) > 0.72) TILE_PROPS[idx] = 5;
      } else {
        TILE_GRID[idx] = 3 + (hash2D(tx, ty) > 0.5 ? 1 : 0);
        if (hash2D(tx, ty) > 0.76) TILE_PROPS[idx] = 5;
      }
    }
  }

  function carveRiver(points) {
    for (let i = 0; i < points.length - 1; i++) {
      const [x0, y0] = points[i];
      const [x1, y1] = points[i + 1];
      const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2;
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const rx = Math.round(x0 + (x1 - x0) * t + Math.sin(t * Math.PI * 2) * 1.5);
        const ry = Math.round(y0 + (y1 - y0) * t + Math.cos(t * Math.PI * 2) * 1.2);
        for (let oy = -1; oy <= 1; oy++) {
          for (let ox = -1; ox <= 1; ox++) {
            const nx = rx + ox;
            const ny = ry + oy;
            if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS) {
              const id = ny * MAP_COLS + nx;
              if (TILE_GRID[id] >= 2) {
                TILE_GRID[id] = 10;
                TILE_PROPS[id] = 0;
              }
            }
          }
        }
      }
    }
  }

  carveRiver([
    [46, 56],
    [59, 68],
    [66, 80],
    [63, 98],
    [68, 120],
    [76, 142]
  ]);

  // Расчищаем просторную территорию усадьбы (рынок, племдвор, загон, амбар, лесопилка и 6 полей)
  for (let ty = 71; ty <= 104; ty++) {
    for (let tx = 68; tx <= 104; tx++) {
      const id = ty * MAP_COLS + tx;
      if (TILE_GRID[id] !== 10) {
        TILE_GRID[id] = (tx + ty) % 2 === 0 ? 3 : 4;
        TILE_PROPS[id] = 0;
      }
    }
  }

  function carveRoad(x0, y0, x1, y1) {
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const rx = Math.round(x0 + (x1 - x0) * t);
      const ry = Math.round(y0 + (y1 - y0) * t);
      if (rx >= 0 && rx < MAP_COLS && ry >= 0 && ry < MAP_ROWS) {
        const id = ry * MAP_COLS + rx;
        if (TILE_GRID[id] === 10) {
          TILE_PROPS[id] = 6;
        } else if (TILE_GRID[id] >= 2) {
          TILE_GRID[id] = 11;
          TILE_PROPS[id] = 0;
        }
      }
    }
  }

  carveRoad(80, 82, 65, 72);
  carveRoad(80, 82, 96, 70);
  carveRoad(80, 82, 105, 81);
  carveRoad(80, 82, 98, 96);
  carveRoad(80, 82, 58, 94);
  carveRoad(58, 94, 42, 110);
  carveRoad(80, 82, 80, 74);
  carveRoad(80, 82, 75, 120);
  carveRoad(75, 120, HARBOR_TILE.tx, HARBOR_TILE.ty);

  // Создаём 4 морских острова в океане (на которые можно попасть ТОЛЬКО на корабле!)
  SEA_ISLANDS.forEach((isl, islIdx) => {
    const rad = isl.radius || 9;
    for (let ty = Math.max(2, isl.ty - rad - 3); ty <= Math.min(MAP_ROWS - 3, isl.ty + rad + 3); ty++) {
      for (let tx = Math.max(2, isl.tx - rad - 3); tx <= Math.min(MAP_COLS - 3, isl.tx + rad + 3); tx++) {
        const idx = ty * MAP_COLS + tx;
        const d = Math.hypot(tx - isl.tx, ty - isl.ty) + (fbm(tx * 0.25, ty * 0.25) - 0.5) * 1.6;
        if (d < rad * 0.58) {
          TILE_GRID[idx] = (tx + ty) % 2 === 0 ? 3 : 5;
          TILE_PROPS[idx] = hash2D(tx, ty) > 0.45 ? 1 : (hash2D(ty, tx) > 0.5 ? 5 : 0);
        } else if (d < rad * 0.82) {
          TILE_GRID[idx] = 2; // песчаный пляж острова
          TILE_PROPS[idx] = 0;
        } else if (d < rad * 1.08) {
          if (TILE_GRID[idx] === 0) {
            TILE_GRID[idx] = 1; // лазурная лагуна вокруг острова
            TILE_PROPS[idx] = 0;
          }
        }
      }
    }
    // Очищаем центр острова под пристань/сундуки
    TILE_PROPS[isl.ty * MAP_COLS + isl.tx] = 0;

    // Добавляем богатые сокровища и брёвна на каждый морской остров
    TREASURE_SPOTS.push({
      id: `tr_isl_${islIdx}_a`,
      tx: isl.tx - 2,
      ty: isl.ty + 1,
      kind: 'chest',
      coins: 140 + islIdx * 45,
      food: 6 + islIdx * 2
    });
    TREASURE_SPOTS.push({
      id: `tr_isl_${islIdx}_b`,
      tx: isl.tx + 2,
      ty: isl.ty - 1,
      kind: 'truffle',
      coins: 120 + islIdx * 35,
      food: 5 + islIdx * 2
    });
    LOG_SPOTS.push({
      id: `log_isl_${islIdx}`,
      tx: isl.tx + 1,
      ty: isl.ty + 2,
      amount: 4 + islIdx,
      respawnAt: 0
    });
  });

  for (let i = 0; i < 46; i++) {
    const tx = 20 + Math.floor(hash2D(i, 3.7) * (MAP_COLS - 40));
    const ty = 20 + Math.floor(hash2D(8.1, i) * (MAP_ROWS - 40));
    const idx = ty * MAP_COLS + tx;
    if (TILE_GRID[idx] >= 2 && TILE_GRID[idx] <= 8 && Math.hypot(tx - 80, ty - 82) > 14) {
      TREASURE_SPOTS.push({
        id: `tr_${i}`,
        tx,
        ty,
        kind: i % 3 === 0 ? 'chest' : i % 3 === 1 ? 'truffle' : 'honey',
        coins: 12 + (i % 5) * 5,
        food: 1 + (i % 2)
      });
    }
  }

  // Брёвна для рубки и сбора: 10 штук прямо вокруг усадьбы и 44 по лесам долины
  const nearEstateLogs = [
    [68, 76], [69, 86], [71, 91], [74, 72], [88, 72],
    [95, 75], [102, 76], [102, 87], [97, 90], [67, 81]
  ];
  nearEstateLogs.forEach(([tx, ty], idx) => {
    LOG_SPOTS.push({
      id: `log_near_${idx}`,
      tx,
      ty,
      amount: 1 + (idx % 2),
      respawnAt: 0
    });
  });

  for (let i = 0; i < 55; i++) {
    const tx = 18 + Math.floor(hash2D(i * 1.7, 9.3) * (MAP_COLS - 36));
    const ty = 18 + Math.floor(hash2D(4.9, i * 2.1) * (MAP_ROWS - 36));
    const idx = ty * MAP_COLS + tx;
    const tile = TILE_GRID[idx];
    // Не ставим прямо на постройки усадьбы
    if (tx >= 70 && tx <= 101 && ty >= 73 && ty <= 99) continue;
    if (tile >= 3 && tile <= 8) {
      LOG_SPOTS.push({
        id: `log_wild_${i}`,
        tx,
        ty,
        amount: (tile === 6 || tile === 7) ? 2 : 1,
        respawnAt: 0
      });
    }
  }
}

function getMaxHerdCapacity() {
  return 6 + (state.unlockedFields.length - 1) * 2 + state.barnLevel;
}

function generateUniqueNickname(gender = 'male', preferred = null) {
  const used = new Set(state.boars.map((b) => b.nickname));
  if (preferred && !used.has(preferred)) return preferred;
  const pool = gender === 'female' ? FEMALE_NICKNAMES : MALE_NICKNAMES;
  for (const name of pool) {
    if (!used.has(name)) return name;
  }
  let counter = 2;
  const base = preferred || (gender === 'female' ? 'Свинка' : 'Хряк');
  while (used.has(`${base}-${counter}`)) counter++;
  return `${base}-${counter}`;
}

function createBoarInstance(speciesId, options = {}) {
  const cfg = BOAR_CATALOG.find((b) => b.id === speciesId) || BOAR_CATALOG[0];
  const gender = options.gender === 'female' ? 'female' : 'male';
  const uid = options.uid || ('b_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6));
  const defaultName = gender === 'female' ? (cfg.defaultFemaleNickname || 'Нюша') : cfg.defaultNickname;
  const nickname = generateUniqueNickname(gender, options.nickname || defaultName);
  return {
    uid,
    speciesId: cfg.id,
    gender,
    nickname,
    breed: cfg.breed,
    generation: options.generation || 1,
    isBred: Boolean(options.isBred),
    parents: options.parents || null
  };
}

function getBoarMarketSellPrice(boarInst) {
  const cfg = BOAR_CATALOG.find((b) => b.id === boarInst.speciesId) || BOAR_CATALOG[0];
  const genMult = 1 + Math.max(0, (boarInst.generation || 1) - 1) * 0.22;
  const originMult = boarInst.isBred ? 1.0 : 0.62;
  const hotSpecies = BOAR_CATALOG[state.marketDayIndex % BOAR_CATALOG.length].id;
  const demandMult = boarInst.speciesId === hotSpecies ? 1.25 : 1.0;
  return Math.max(15, Math.round(cfg.baseSell * genMult * originMult * demandMult));
}

function formatRealDuration(ms) {
  const totalSec = Math.max(0, Math.ceil(ms / 1000));
  const hrs = Math.floor(totalSec / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  if (hrs > 0) {
    return `${hrs}ч ${mins.toString().padStart(2, '0')}м ${secs.toString().padStart(2, '0')}с`;
  }
  return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function getBreedingPairInfo(b1, b2) {
  const c1 = BOAR_CATALOG.find((b) => b.id === b1.speciesId) || BOAR_CATALOG[0];
  const c2 = BOAR_CATALOG.find((b) => b.id === b2.speciesId) || BOAR_CATALOG[0];
  const idx1 = BOAR_CATALOG.findIndex((b) => b.id === c1.id);
  const idx2 = BOAR_CATALOG.findIndex((b) => b.id === c2.id);
  const maxIdx = Math.max(idx1, idx2);
  const nextIdx = Math.min(BOAR_CATALOG.length - 1, maxIdx + 1);
  const hasMutation = nextIdx > maxIdx;

  // Время разведения зависит от породы: 15 мин обычные, 30 мин средние, 1.5 - 3 часа дорогие
  const maxMinutes = Math.max(c1.breedMinutes, c2.breedMinutes);
  const durationMs = maxMinutes * 60 * 1000;
  const coinCost = Math.round((c1.price + c2.price) * 0.08) + 10;
  const foodCost = 2 + Math.floor((idx1 + idx2) / 2);
  const nextGen = Math.max(b1.generation || 1, b2.generation || 1) + 1;

  const outcomes = [];
  if (c1.id === c2.id) {
    if (hasMutation) {
      outcomes.push({ speciesId: c1.id, breed: c1.breed, chance: 82 });
      outcomes.push({ speciesId: BOAR_CATALOG[nextIdx].id, breed: BOAR_CATALOG[nextIdx].breed, chance: 18 });
    } else {
      outcomes.push({ speciesId: c1.id, breed: c1.breed, chance: 100 });
    }
  } else {
    if (hasMutation) {
      outcomes.push({ speciesId: c1.id, breed: c1.breed, chance: 43 });
      outcomes.push({ speciesId: c2.id, breed: c2.breed, chance: 43 });
      outcomes.push({ speciesId: BOAR_CATALOG[nextIdx].id, breed: BOAR_CATALOG[nextIdx].breed, chance: 14 });
    } else {
      outcomes.push({ speciesId: c1.id, breed: c1.breed, chance: 50 });
      outcomes.push({ speciesId: c2.id, breed: c2.breed, chance: 50 });
    }
  }

  return { c1, c2, durationMs, maxMinutes, coinCost, foodCost, nextGen, outcomes };
}

function revealFogAroundWorld(wx, wy, radiusTiles) {
  const ctxTile = Math.floor(wx / TILE_SIZE);
  const ctyTile = Math.floor(wy / TILE_SIZE);
  const rSq = radiusTiles * radiusTiles;
  const minTx = Math.max(0, Math.floor(ctxTile - radiusTiles));
  const maxTx = Math.min(MAP_COLS - 1, Math.ceil(ctxTile + radiusTiles));
  const minTy = Math.max(0, Math.floor(ctyTile - radiusTiles));
  const maxTy = Math.min(MAP_ROWS - 1, Math.ceil(ctyTile + radiusTiles));

  let changed = false;
  for (let ty = minTy; ty <= maxTy; ty++) {
    for (let tx = minTx; tx <= maxTx; tx++) {
      const dx = tx - ctxTile;
      const dy = ty - ctyTile;
      if (dx * dx + dy * dy <= rSq) {
        const idx = ty * MAP_COLS + tx;
        if (FOG_GRID[idx] === 0) {
          FOG_GRID[idx] = 1;
          changed = true;
        }
      }
    }
  }
  if (changed) {
    fogLayerDirty = true;
  }
}

function getBarnPassiveRate() {
  if (state.barnLevel <= 0) return 0;
  return Math.max(1, Math.round(state.barnLevel * 1.5 * Math.max(1, state.boars.length)));
}

function getBarnCapacity() {
  if (state.barnLevel <= 0) return 0;
  return state.barnLevel * 240;
}

function initPlots() {
  const maxAllowed = getMaxPlotsAllowed();
  if (typeof state.plotCount !== 'number' || state.plotCount < 3) state.plotCount = 3;
  if (state.plotCount > maxAllowed) state.plotCount = maxAllowed;
  if (!Array.isArray(state.plots)) state.plots = [];
  for (let i = 0; i < state.plots.length; i++) {
    if (!state.plots[i] || typeof state.plots[i] !== 'object') {
      state.plots[i] = { crop: null, progress: 0, ready: false, hasWeed: false, weedChecked: false };
    } else if (state.plots[i].crop && !CROPS[state.plots[i].crop]) {
      state.plots[i].crop = null;
      state.plots[i].progress = 0;
      state.plots[i].ready = false;
      state.plots[i].hasWeed = false;
      state.plots[i].weedChecked = false;
    } else if (typeof state.plots[i].progress !== 'number') {
      state.plots[i].progress = state.plots[i].ready ? 1 : 0;
      state.plots[i].hasWeed = false;
      state.plots[i].weedChecked = false;
    }
  }
  while (state.plots.length < state.plotCount) {
    state.plots.push({ crop: null, progress: 0, ready: false, hasWeed: false, weedChecked: false });
  }
}

function serializeFog() {
  const chars = new Array(Math.ceil(FOG_GRID.length / 4));
  let cIdx = 0;
  for (let i = 0; i < FOG_GRID.length; i += 4) {
    const nibble =
      (FOG_GRID[i] || 0) |
      ((FOG_GRID[i + 1] || 0) << 1) |
      ((FOG_GRID[i + 2] || 0) << 2) |
      ((FOG_GRID[i + 3] || 0) << 3);
    chars[cIdx++] = nibble.toString(16);
  }
  return chars.join('');
}

function deserializeFog(hex) {
  if (!hex || typeof hex !== 'string') return false;
  let loaded = false;
  for (let i = 0; i < hex.length && i * 4 < FOG_GRID.length; i++) {
    const val = parseInt(hex[i], 16);
    if (!isNaN(val)) {
      FOG_GRID[i * 4] = val & 1;
      if (i * 4 + 1 < FOG_GRID.length) FOG_GRID[i * 4 + 1] = (val >> 1) & 1;
      if (i * 4 + 2 < FOG_GRID.length) FOG_GRID[i * 4 + 2] = (val >> 2) & 1;
      if (i * 4 + 3 < FOG_GRID.length) FOG_GRID[i * 4 + 3] = (val >> 3) & 1;
      loaded = true;
    }
  }
  return loaded;
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        state = { ...state, ...parsed };
      }
    }
  } catch (e) {}
  if (!CROPS[state.selectedSeed]) state.selectedSeed = 'carrot';
  if (!Array.isArray(state.unlockedBoars) || state.unlockedBoars.length === 0) {
    state.unlockedBoars = ['boar_classic'];
  }
  if (!Array.isArray(state.boars) || state.boars.length === 0) {
    state.boars = [
      createBoarInstance('boar_classic', { gender: 'male', nickname: 'Борька', generation: 1, isBred: false }),
      createBoarInstance('boar_classic', { gender: 'female', nickname: 'Нюша', generation: 1, isBred: false })
    ];
  } else {
    state.boars = state.boars.filter((b) => b && BOAR_CATALOG.some((c) => c.id === b.speciesId));
    state.boars.forEach((b, idx) => {
      if (b.gender !== 'male' && b.gender !== 'female') {
        b.gender = idx % 2 === 1 ? 'female' : 'male';
      }
    });
    if (state.boars.length === 0) {
      state.boars = [
        createBoarInstance('boar_classic', { gender: 'male', nickname: 'Борька', generation: 1, isBred: false }),
        createBoarInstance('boar_classic', { gender: 'female', nickname: 'Нюша', generation: 1, isBred: false })
      ];
    }
  }
  if (state.breeding && (!state.breeding.active || !state.breeding.resultSpeciesId)) {
    state.breeding = null;
  }
  if (typeof state.marketDayIndex !== 'number') state.marketDayIndex = 0;
  if (!Array.isArray(state.unlockedFields) || state.unlockedFields.length === 0) {
    state.unlockedFields = [0];
  }
  if (!Array.isArray(state.discoveredLandmarks) || state.discoveredLandmarks.length === 0) {
    state.discoveredLandmarks = ['khryakograd'];
  }
  if (!Array.isArray(state.collectedTreasures)) state.collectedTreasures = [];
  if (typeof state.coins !== 'number' || isNaN(state.coins)) state.coins = 40;
  if (typeof state.food !== 'number' || isNaN(state.food)) state.food = 2;
  if (typeof state.logs !== 'number' || isNaN(state.logs)) state.logs = 3;
  if (typeof state.sawmillLevel !== 'number' || state.sawmillLevel < 0) state.sawmillLevel = 0;
  if (typeof state.axeLevel !== 'number' || state.axeLevel < 1) state.axeLevel = 1;
  if (typeof state.feederLevel !== 'number' || state.feederLevel < 0) state.feederLevel = 0;
  if (typeof state.sawmillQueueLogs !== 'number' || state.sawmillQueueLogs < 0) state.sawmillQueueLogs = 0;
  if (typeof state.sawmillProgress !== 'number' || isNaN(state.sawmillProgress)) state.sawmillProgress = 0;
  if (typeof state.sawmillStoredCoins !== 'number' || isNaN(state.sawmillStoredCoins)) state.sawmillStoredCoins = 0;
  if (typeof state.growthSpeedLevel !== 'number' || state.growthSpeedLevel < 1) state.growthSpeedLevel = 1;
  if (typeof state.barnLevel !== 'number' || state.barnLevel < 0) state.barnLevel = 0;
  if (typeof state.barnStoredCoins !== 'number' || isNaN(state.barnStoredCoins)) state.barnStoredCoins = 0;
  if (typeof state.scoutSpeedLevel !== 'number' || state.scoutSpeedLevel < 1) state.scoutSpeedLevel = 1;
  if (typeof state.scoutVisionLevel !== 'number' || state.scoutVisionLevel < 1) state.scoutVisionLevel = 1;
  if (typeof state.gameMinutes !== 'number' || isNaN(state.gameMinutes)) state.gameMinutes = 9 * 60 + 15;

  const hadFog = deserializeFog(state.fogHex);
  if (!hadFog) {
    revealFogAroundWorld(WORLD.homeTile.tx * TILE_SIZE, WORLD.homeTile.ty * TILE_SIZE, 15);
  }
  // Слегка приоткрываем облака над 4 морскими островами, чтобы игрок видел их в море
  SEA_ISLANDS.forEach((isl) => {
    revealFogAroundWorld(isl.tx * TILE_SIZE + TILE_SIZE / 2, isl.ty * TILE_SIZE + TILE_SIZE / 2, 5.5);
  });

  if (typeof state.shipBuilt !== 'boolean') state.shipBuilt = false;
  if (state.shipBuild && (!state.shipBuild.active || typeof state.shipBuild.startTimeMs !== 'number')) {
    state.shipBuild = null;
  }

  // Восстанавливаем состояние морского похода при перезаходе
  if (state.voyage && state.voyage.active) {
    caravan.targetX = state.voyage.targetX;
    caravan.targetY = state.voyage.targetY;
    if (state.voyage.phase === 'prep') {
      caravan.status = 'voyage_prep';
      caravan.x = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
      caravan.y = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;
    } else if (state.voyage.phase === 'sailing') {
      caravan.status = 'voyage_sailing';
    }
  }

  initPlots();
  displayedCoins = state.coins;
}

function saveGame(immediate = false) {
  saveDirty = true;
  if (immediate) flushSave();
}

function flushSave() {
  if (!saveDirty) return;
  saveDirty = false;
  lastSaveAt = performance.now();
  try {
    state.fogHex = serializeFog();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function getScoutSpeed() {
  const phase = getDayPhaseInfo(state.gameMinutes);
  const nightPenalty = phase.label === 'ночь' ? 0.68 : 1.0;
  return (120 + (state.scoutSpeedLevel - 1) * 34) * nightPenalty;
}

function getScoutVisionRadius() {
  const phase = getDayPhaseInfo(state.gameMinutes);
  const nightPenalty = phase.label === 'ночь' ? 0.75 : 1.0;
  return (5.2 + (state.scoutVisionLevel - 1) * 1.2) * nightPenalty;
}

const BIOME_NAMES = {

function classifyDestination(wx, wy) {
  const clampedX = Math.max(96, Math.min(WORLD.w - 96, wx));
  const clampedY = Math.max(96, Math.min(WORLD.h - 96, wy));
  const tx = Math.max(0, Math.min(MAP_COLS - 1, Math.floor(clampedX / TILE_SIZE)));
  const ty = Math.max(0, Math.min(MAP_ROWS - 1, Math.floor(clampedY / TILE_SIZE)));
  const tileType = TILE_GRID[ty * MAP_COLS + tx];

  // Проверяем, нажал ли игрок на один из 4 морских островов
  for (const isl of SEA_ISLANDS) {
    if (Math.hypot(tx - isl.tx, ty - isl.ty) <= (isl.radius + 3)) {
      return {
        isDistantSea: true,
        isIsland: true,
        island: isl,
        destName: `${isl.name} (Только на корабле ⛵)`,
        targetX: isl.tx * TILE_SIZE + TILE_SIZE / 2,
        targetY: isl.ty * TILE_SIZE + TILE_SIZE / 2,
        cost: SEA_VOYAGE_COST
      };
    }
  }

  // Только открытое море (глубокая вода 0 и отмель 1) требует корабль! Весь материк (лес, луга, горы, берег) доступен обозу пешком
  if (tileType === 0 || tileType === 1) {
    return {
      isDistantSea: true,
      isIsland: false,
      island: null,
      destName: 'Открытое море (Только на корабле ⛵)',
      targetX: clampedX,
      targetY: clampedY,
      cost: SEA_VOYAGE_COST
    };
  }

  // Проверяем, не нажал ли игрок рядом с известным ориентиром долины
  let nearLandmarkName = null;
  for (const lm of LANDMARKS) {
    if (lm.id !== 'khryakograd' && !lm.isIsland && Math.hypot(tx - lm.tx, ty - lm.ty) <= 4.5) {
      nearLandmarkName = `📍 ${lm.name}`;
      break;
    }
  }

  const distMeters = Math.max(10, Math.round(Math.hypot(clampedX - caravan.x, clampedY - caravan.y) / 8));
  const estSeconds = Math.max(2, Math.round(Math.hypot(clampedX - caravan.x, clampedY - caravan.y) / getScoutSpeed()));

  return {
    isDistantSea: false,
    isIsland: false,
    island: null,
    destName: nearLandmarkName || (BIOME_NAMES[tileType] || 'Лесная поляна 🌲'),
    distMeters,
    estSeconds,
    targetX: clampedX,
    targetY: clampedY,
    cost: EXPEDITION_COST
  };
}

let pendingVoyageTarget = null;

function executeLandExpedition(dest) {
  const clampedX = dest.targetX;
  const clampedY = dest.targetY;
  const sx = caravan.x;
  const sy = caravan.y;
  const dx = clampedX - sx;
  const dy = clampedY - sy;
  const dist = Math.hypot(dx, dy);
  if (dist < 28) return;

  if (state.coins < EXPEDITION_COST) {
    SoundManager.uiClick();
    spawnFloatingText(clampedX, clampedY - 20, `Нужно ${EXPEDITION_COST} монет на обоз!`, '#ff6b6b');
    return;
  }
  state.coins -= EXPEDITION_COST;

  const nx = -dy / dist;
  const ny = dx / dist;
  const curve = Math.min(160, dist * 0.13) * (dx >= 0 ? 1 : -1);

  caravan.waypoints = [
    { x: sx + dx * 0.35 + nx * curve, y: sy + dy * 0.35 + ny * curve },
    { x: sx + dx * 0.70 + nx * (curve * 0.65), y: sy + dy * 0.70 + ny * (curve * 0.65) },
    { x: clampedX, y: clampedY }
  ];
  caravan.targetX = clampedX;
  caravan.targetY = clampedY;
  caravan.status = 'moving';
  caravan.campTimer = 0;

  SoundManager.marchStart();
  triggerHaptic('medium');
  spawnFloatingText(clampedX, clampedY - 26, `ОБОЗ ВЫЕХАЛ! (-${EXPEDITION_COST}💰)`, '#ffcf56');
  saveGame();
}

function sendCaravanTo(wx, wy) {
  // 1. Если хряки уже плывут по морю (30 мин) или идут в походе — в другой поход отправить НЕЛЬЗЯ!
  if (caravan.status === 'voyage_sailing') {
    SoundManager.uiClick();
    triggerHaptic('medium');
    spawnFloatingText(wx, wy - 24, '⛵ Хряки в плавании! В другой поход нельзя!', '#ff6b6b');
    openVoyageModal();
    return;
  }
  if (caravan.status === 'moving') {
    SoundManager.uiClick();
    triggerHaptic('light');
    spawnFloatingText(wx, wy - 24, 'Обоз уже в пути! В другой поход пока нельзя!', '#ff6b6b');
    return;
  }

  // 2. Если хряки сейчас на 15-минутных сборах перед отплытием — открываем окно «Вы уверены?», где можно передумать и отменить!
  if (caravan.status === 'voyage_prep') {
    SoundManager.uiClick();
    triggerHaptic('medium');
    openVoyageModal();
    return;
  }

  const dest = classifyDestination(wx, wy);
  if (!dest.isDistantSea && Math.hypot(dest.targetX - caravan.x, dest.targetY - caravan.y) < 28) {
    return;
  }

  // 3. ПРЕДОТВРАЩЕНИЕ СЛУЧАЙНЫХ КАСАНИЙ:
  //    Куда бы ни нажал игрок (в лес, на поляну, к реке или в море) — хряки НЕ отправляются, пока игрок не подтвердит отправку!
  pendingVoyageTarget = dest;
  SoundManager.uiClick();
  triggerHaptic('light');
  openVoyageModal();
}

function syncActiveBoars() {
  const validUids = new Set(state.boars.map((b) => b.uid));

  const existingUids = new Set(activeBoars.map((ab) => ab.uid));

  state.boars.forEach((inst) => {
    const cfg = BOAR_CATALOG.find((b) => b.id === inst.speciesId) || BOAR_CATALOG[0];
    const genMult = 1 + Math.max(0, (inst.generation || 1) - 1) * 0.1;
    if (!existingUids.has(inst.uid)) {
      activeBoars.push({
        ...cfg,
        uid: inst.uid,
        speciesId: cfg.id,
        gender: inst.gender || 'male',
        nickname: inst.nickname,
        breed: cfg.breed,
        generation: inst.generation || 1,
        income: Math.round(cfg.income * genMult),
        feedBonus: Math.round(cfg.feedBonus * genMult),
        x: 0.16 + Math.random() * 0.68,
        y: 0.22 + Math.random() * 0.56,
        targetX: 0.14 + Math.random() * 0.72,
        targetY: 0.18 + Math.random() * 0.62,
        facing: Math.random() > 0.5 ? 1 : -1,
        bounceTime: 0,
        heartsTime: 0,
        fullnessTimer: 0,
        labelTimer: 3.0,
        waitTimer: Math.random() * 2,
        walkPhase: Math.random() * Math.PI * 2,
        breathPhase: Math.random() * Math.PI * 2,
        blinkCooldown: 1.5 + Math.random() * 3.0,
        blinkTimer: 0,
        dustCooldown: 0
      });
    } else {
      const existing = activeBoars.find((ab) => ab.uid === inst.uid);
      if (existing) {
        existing.gender = inst.gender || 'male';
        existing.nickname = inst.nickname;
        existing.generation = inst.generation || 1;
        existing.income = Math.round(cfg.income * genMult);
        existing.feedBonus = Math.round(cfg.feedBonus * genMult);
      }
    }
  });
}

function clampZoom(z) {
  return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
}

function clampCamera(cx, cy, z = camera.zoom) {
  const viewW = W / z;
  const viewH = H / z;
  const marginX = Math.max(40, viewW * 0.15);
  const marginY = Math.max(120, viewH * 0.15);
  const minX = -marginX;
  const maxX = Math.max(minX, WORLD.w - viewW + marginX);
  const minY = -marginY;
  const maxY = Math.max(minY, WORLD.h - viewH + marginY);
  return {
    x: Math.max(minX, Math.min(maxX, cx)),
    y: Math.max(minY, Math.min(maxY, cy))
  };
}

function setZoomAroundScreenPoint(newZoom, sx = W / 2, sy = H / 2, smooth = true) {
  const clampedZ = clampZoom(newZoom);
  if (smooth) {
    camera.targetZoom = clampedZ;
    camera.zoomAnchorSx = sx;
    camera.zoomAnchorSy = sy;
  } else {
    const wx = sx / camera.zoom + camera.x;
    const wy = sy / camera.zoom + camera.y;
    camera.zoom = clampedZ;
    camera.targetZoom = clampedZ;
    camera.zoomAnchorSx = null;
    camera.zoomAnchorSy = null;
    const c = clampCamera(wx - sx / clampedZ, wy - sy / clampedZ, clampedZ);
    camera.x = c.x;
    camera.y = c.y;
  }
}

function focusCameraOn(worldCenterX, worldCenterY, z = camera.targetZoom) {
  const topReservePx = hudLayout.safeTop + 115;
  const bottomReservePx = 92;
  const visibleCenterY = topReservePx + (H - topReservePx - bottomReservePx) / 2;
  const rawX = worldCenterX - (W / 2) / z;
  const rawY = worldCenterY - visibleCenterY / z;
  const clamped = clampCamera(rawX, rawY, z);
  camera.targetX = clamped.x;
  camera.targetY = clamped.y;
  camera.vx = 0;
  camera.vy = 0;
}

function resize() {
  // Ограничиваем DPR до 1.5 для плавных 60 FPS на смартфонах
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const vv = window.visualViewport;
  const nextW = Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth);
  const nextH = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight);
  if (nextW > 20 && nextH > 20) {
    W = nextW;
    H = nextH;
  }
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  computeHudLayout();
  const c = clampCamera(camera.x, camera.y);
  camera.x = c.x;
  camera.y = c.y;
}
