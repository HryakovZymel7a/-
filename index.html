/**
 * ОБНОВЛЕНИЕ ЛОГИКИ ИГРЫ
 */
let lastTime = performance.now();

function update(dt) {
 const prevDay = Math.floor(state.gameMinutes / 1440);
 state.gameMinutes += dt * 4.0;
 const curDay = Math.floor(state.gameMinutes / 1440);
 if (curDay !== prevDay) {
 state.marketDayIndex = (state.marketDayIndex + 1) % BOAR_CATALOG.length;
 saveGame();
 }

 if (Math.abs(state.coins - displayedCoins) > 0.1) {
 displayedCoins += (state.coins - displayedCoins) * Math.min(1, dt * 12);
 } else {
 displayedCoins = state.coins;
 }

 if (state.barnLevel > 0) {
 const rate = getBarnPassiveRate();
 const cap = getBarnCapacity();
 if (state.barnStoredCoins < cap) {
 state.barnStoredCoins = Math.min(cap, state.barnStoredCoins + rate * dt);
 }
 }

 if (state.sawmillLevel > 0) {
 if (state.sawmillQueueLogs > 0) {
 const procTime = getSawmillProcessTime();
 state.sawmillProgress += dt / procTime;
 if (state.sawmillProgress >= 1) {
 state.sawmillProgress = 0;
 state.sawmillQueueLogs -= 1;
 state.sawmillStoredCoins += getSawmillPlankValue();
 saveGame();
 }
 } else if (state.sawmillLevel >= 2) {
 // Лесопилка со 2 уровня сама потихоньку заготавливает и пилит валежник
 state.sawmillProgress += (dt * (state.sawmillLevel - 1) * 0.08);
 if (state.sawmillProgress >= 1) {
 state.sawmillProgress = 0;
 state.sawmillStoredCoins += Math.round(getSawmillPlankValue() * 0.6);
 }
 }
 }

 if (barnBounce > 0) barnBounce = Math.max(0, barnBounce - dt * 2.5);
 if (shopBtnBounce > 0) shopBtnBounce = Math.max(0, shopBtnBounce - dt * 3.5);
 CROP_ORDER.forEach((id) => {
 if (seedBounce[id] > 0) seedBounce[id] = Math.max(0, seedBounce[id] - dt * 4);
 });

 if (caravan.status === 'moving' && caravan.waypoints.length > 0) {
 const wp = caravan.waypoints[0];
 const dx = wp.x - caravan.x;
 const dy = wp.y - caravan.y;
 const dist = Math.hypot(dx, dy);
 const step = getScoutSpeed() * dt;

 caravan.stepPhase += dt * 11;
 if (Math.abs(dx) > 1) caravan.facing = dx >= 0 ? 1 : -1;
 revealFogAroundWorld(caravan.x, caravan.y, getScoutVisionRadius());

 for (let i = 0; i < TREASURE_SPOTS.length; i++) {
 const tr = TREASURE_SPOTS[i];
 if (state.collectedTreasures.includes(tr.id)) continue;
 const tx = tr.tx * TILE_SIZE + TILE_SIZE / 2;
 const ty = tr.ty * TILE_SIZE + TILE_SIZE / 2;
 if (Math.hypot(caravan.x - tx, caravan.y - ty) < 85) {
 state.collectedTreasures.push(tr.id);
 state.coins += tr.coins;
 state.food += tr.food;
 SoundManager.coin();
 triggerHaptic('success');
 spawnParticles(tx, ty, 'coin', 6);
 spawnFloatingText(tx, ty - 24, `Клад: ${formatCoinsText(tr.coins)}, +${tr.food} корма`, '#ffe047');
 saveGame();
 }
 }

 const sqBtn = hudLayout.navBtns.find((b) => b.id === 'squad');
 if (sqBtn) {
 sqBtn.wx = caravan.x;
 sqBtn.wy = caravan.y;
 }

 if (dist <= step) {
 caravan.x = wp.x;
 caravan.y = wp.y;
 caravan.waypoints.shift();
 if (caravan.waypoints.length === 0) {
 caravan.status = 'camp';
 caravan.campTimer = 5.0;
 revealFogAroundWorld(caravan.x, caravan.y, getScoutVisionRadius() + 2.5);

 const lootCoins = Math.round((9 + Math.random() * 12) * (1 + state.scoutVisionLevel * 0.15));
 const lootFood = 1 + Math.floor(state.scoutVisionLevel * 0.35);
 const cTx = Math.floor(caravan.x / TILE_SIZE);
 const cTy = Math.floor(caravan.y / TILE_SIZE);
 const cTile = TILE_GRID[cTy * MAP_COLS + cTx] || 0;
 const lootLogs = (cTile === 6 || cTile === 7) ? (2 + Math.floor(state.axeLevel * 0.5)) : 1;
 state.coins += lootCoins;
 state.food += lootFood;
 state.logs += lootLogs;
 SoundManager.discover();
 triggerHaptic('success');
 spawnParticles(caravan.x, caravan.y - 16, 'log', 5);
 spawnFloatingText(caravan.x, caravan.y - 42, `Обоз вернулся: ${formatCoinsText(lootCoins)}, +${lootLogs} брев.`, '#ffe047');
 saveGame();
 }
 } else {
 caravan.x += (dx / dist) * step;
 caravan.y += (dy / dist) * step;
 }

 const lastTr = caravan.trailHistory[caravan.trailHistory.length - 1];
 if (!lastTr || Math.hypot(caravan.x - lastTr.x, caravan.y - lastTr.y) > 24) {
 caravan.trailHistory.push({ x: caravan.x, y: caravan.y });
 if (caravan.trailHistory.length > 45) caravan.trailHistory.shift();
 }
 } else if (caravan.status === 'voyage_prep' && state.voyage && state.voyage.active) {
 const nowMs = Date.now();
 const prepEnd = state.voyage.prepStartTimeMs + state.voyage.prepDurationMs;
 const sqBtn = hudLayout.navBtns.find((b) => b.id === 'squad');
 if (sqBtn) {
 sqBtn.wx = caravan.x;
 sqBtn.wy = caravan.y;
 }
 if (nowMs >= prepEnd) {
 // 15 минут сборов истекли — корабль отплывает в 30-минутное морское плавание!
 state.voyage.phase = 'sailing';
 state.voyage.sailStartTimeMs = nowMs;
 caravan.status = 'voyage_sailing';
 caravan.startX = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
 caravan.startY = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;
 caravan.x = caravan.startX;
 caravan.y = caravan.startY;
 caravan.trailHistory = [{ x: caravan.x, y: caravan.y }];
 SoundManager.marchStart();
 triggerHaptic('success');
 spawnFloatingText(caravan.x, caravan.y - 36, 'Парус поднят! Курс на острова (30 мин)', '#48dbfb');
 saveGame(true);
 }
 } else if (caravan.status === 'voyage_sailing' && state.voyage && state.voyage.active) {
 const nowMs = Date.now();
 const elapsed = Math.max(0, nowMs - state.voyage.sailStartTimeMs);
 const total = Math.max(1000, state.voyage.sailDurationMs);
 const prog = Math.min(1, elapsed / total);

 const startX = state.voyage.startX || (HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2);
 const startY = state.voyage.startY || (HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2);
 const prevX = caravan.x;
 caravan.x = startX + (state.voyage.targetX - startX) * prog;
 caravan.y = startY + (state.voyage.targetY - startY) * prog;
 if (Math.abs(caravan.x - prevX) > 0.05) {
 caravan.facing = caravan.x >= prevX ? 1 : -1;
 }

 revealFogAroundWorld(caravan.x, caravan.y, getScoutVisionRadius() + 1.5);

 const lastTr = caravan.trailHistory[caravan.trailHistory.length - 1];
 if (!lastTr || Math.hypot(caravan.x - lastTr.x, caravan.y - lastTr.y) > 32) {
 caravan.trailHistory.push({ x: caravan.x, y: caravan.y });
 if (caravan.trailHistory.length > 55) caravan.trailHistory.shift();
 }

 const sqBtn = hudLayout.navBtns.find((b) => b.id === 'squad');
 if (sqBtn) {
 sqBtn.wx = caravan.x;
 sqBtn.wy = caravan.y;
 }

 if (prog >= 1) {
 // Корабль прибыл на остров / в дальнее море спустя 30 минут!
 caravan.x = state.voyage.targetX;
 caravan.y = state.voyage.targetY;
 caravan.status = 'camp';
 caravan.campTimer = 8.0;
 revealFogAroundWorld(caravan.x, caravan.y, getScoutVisionRadius() + 6.5);

 const bonusCoins = state.voyage.isIsland ? 340 : 160;
 const bonusFood = state.voyage.isIsland ? 14 : 7;
 const bonusLogs = state.voyage.isIsland ? 8 : 4;
 state.coins += bonusCoins;
 state.food += bonusFood;
 state.logs += bonusLogs;
 state.voyage = null;

 SoundManager.discover();
 triggerHaptic('success');
 spawnParticles(caravan.x, caravan.y - 20, 'coin', 10);
 spawnParticles(caravan.x, caravan.y - 28, 'sparkle', 6);
 spawnFloatingText(caravan.x, caravan.y - 48, `Причалили: ${formatCoinsText(bonusCoins)}, +${bonusLogs} брев.`, '#ffe047');
 saveGame(true);
 }
 } else if (caravan.status === 'camp') {
 caravan.campTimer -= dt;
 if (caravan.campTimer <= 0) {
 caravan.status = 'idle';
 }
 }

 if (Math.abs(camera.targetZoom - camera.zoom) > 0.001) {
 const prevZoom = camera.zoom;
 camera.zoom += (camera.targetZoom - camera.zoom) * Math.min(1, dt * 12);
 if (camera.targetX === null) {
 const anchorSx = camera.zoomAnchorSx !== null ? camera.zoomAnchorSx : W / 2;
 const anchorSy = camera.zoomAnchorSy !== null ? camera.zoomAnchorSy : H / 2;
 const anchorWx = camera.x + anchorSx / prevZoom;
 const anchorWy = camera.y + anchorSy / prevZoom;
 const c = clampCamera(anchorWx - anchorSx / camera.zoom, anchorWy - anchorSy / camera.zoom, camera.zoom);
 camera.x = c.x;
 camera.y = c.y;
 }
 } else {
 camera.zoom = camera.targetZoom;
 camera.zoomAnchorSx = null;
 camera.zoomAnchorSy = null;
 }

 if (camera.targetX !== null && camera.targetY !== null) {
 const dx = camera.targetX - camera.x;
 const dy = camera.targetY - camera.y;
 if (Math.hypot(dx, dy) < 2) {
 camera.x = camera.targetX;
 camera.y = camera.targetY;
 camera.targetX = null;
 camera.targetY = null;
 } else {
 camera.x += dx * Math.min(1, dt * 10);
 camera.y += dy * Math.min(1, dt * 10);
 }
 } else if (!camera.isDragging && !camera.isMinimapDragging && (Math.abs(camera.vx) > 0.5 || Math.abs(camera.vy) > 0.5)) {
 const c = clampCamera(camera.x + camera.vx * dt, camera.y + camera.vy * dt);
 camera.x = c.x;
 camera.y = c.y;
 camera.vx *= Math.pow(0.04, dt);
 camera.vy *= Math.pow(0.04, dt);
 }

 // Рост культур на грядках и появление сорняков
 const cropSpeedMult = 1 + (state.growthSpeedLevel - 1) * 0.2;
 for (let i = 0; i < state.plots.length; i++) {
 const plot = state.plots[i];
 if (!plot || !plot.crop || plot.ready) continue;
 const cropCfg = CROPS[plot.crop];
 if (!cropCfg) continue;

 if (!plot.weedChecked && plot.progress >= 0.42) {
 plot.weedChecked = true;
 if (Math.random() < 0.48) {
 plot.hasWeed = true;
 }
 }

 const weedPenalty = plot.hasWeed ? 0.32 : 1.0;
 plot.progress += (dt * cropSpeedMult * weedPenalty) / cropCfg.growTime;
 if (plot.progress >= 1) {
 plot.progress = 1;
 plot.ready = true;
 plot.hasWeed = false;
 }
 }

 if (cameraShakeTime > 0) {
 cameraShakeTime = Math.max(0, cameraShakeTime - dt);
 if (cameraShakeTime <= 0) cameraShakeMag = 0;
 }
 if (pillBounce.coin > 0) pillBounce.coin = Math.max(0, pillBounce.coin - dt * 4);
 if (pillBounce.food > 0) pillBounce.food = Math.max(0, pillBounce.food - dt * 4);
 if (pillBounce.log > 0) pillBounce.log = Math.max(0, pillBounce.log - dt * 4);

 // Дрейф воздушных облаков над долиной
 for (let i = 0; i < driftingClouds.length; i++) {
 const cl = driftingClouds[i];
 cl.x += cl.speed * dt;
 if (cl.x > WORLD.penRect.x + 2200) {
 cl.x = WORLD.penRect.x - 1100;
 }
 }

 for (let i = 0; i < activeBoars.length; i++) {
 const boar = activeBoars[i];
 boar.breathPhase = (boar.breathPhase || 0) + dt * 3.6;
 if (boar.bounceTime > 0) boar.bounceTime = Math.max(0, boar.bounceTime - dt * 2.4);
 if (boar.heartsTime > 0) boar.heartsTime = Math.max(0, boar.heartsTime - dt * 1.4);
 if (boar.fullnessTimer > 0) boar.fullnessTimer = Math.max(0, boar.fullnessTimer - dt);
 if (boar.labelTimer > 0) boar.labelTimer = Math.max(0, boar.labelTimer - dt);

 // Периодическое живое моргание глазок
 if (boar.blinkTimer > 0) {
 boar.blinkTimer = Math.max(0, boar.blinkTimer - dt);
 } else {
 boar.blinkCooldown = (boar.blinkCooldown || 2.5) - dt;
 if (boar.blinkCooldown <= 0) {
 boar.blinkTimer = 0.14;
 boar.blinkCooldown = 2.4 + Math.random() * 3.2;
 }
 }

 if (boar.waitTimer > 0) {
 boar.waitTimer -= dt;
 continue;
 }

 const dx = boar.targetX - boar.x;
 const dy = boar.targetY - boar.y;
 const dist = Math.hypot(dx, dy);

 if (dist < 0.02) {
 boar.waitTimer = 1.2 + Math.random() * 2.5;
 boar.targetX = 0.1 + Math.random() * 0.8;
 boar.targetY = 0.15 + Math.random() * 0.72;
 } else {
 const speed = 0.15;
 boar.x += (dx / dist) * speed * dt;
 boar.y += (dy / dist) * speed * dt;
 boar.facing = dx > 0 ? 1 : -1;
 boar.walkPhase += dt * 10;

 // Пыль из-под копыт при беге
 boar.dustCooldown = (boar.dustCooldown || 0) - dt;
 if (boar.dustCooldown <= 0 && camera.zoom >= 0.45) {
 boar.dustCooldown = 0.28 + Math.random() * 0.15;
 const wx = WORLD.penRect.x + 56 + boar.x * (WORLD.penRect.w - 112);
 const wy = WORLD.penRect.y + 56 + boar.y * (WORLD.penRect.h - 94) + 34;
 spawnDustPuff(wx - boar.facing * 12, wy, 1, 'rgba(218, 240, 175, 0.55)');
 }
 }
 }

 for (let i = dustPuffs.length - 1; i >= 0; i--) {
 const dp = dustPuffs[i];
 dp.x += dp.vx * dt;
 dp.y += dp.vy * dt;
 dp.r += 12 * dt;
 dp.life -= dt * 1.65;
 if (dp.life <= 0) dustPuffs.splice(i, 1);
 }

 for (let i = particles.length - 1; i >= 0; i--) {
 const p = particles[i];
 p.x += p.vx * dt;
 p.y += p.vy * dt;
 p.vy += 205 * dt;
 if (p.vRot) p.rot = (p.rot || 0) + p.vRot * dt;
 p.life -= dt * 1.28;
 if (p.life <= 0) particles.splice(i, 1);
 }

 for (let i = floatingTexts.length - 1; i >= 0; i--) {
 const ft = floatingTexts[i];
 ft.y += ft.vy * dt;
 ft.vy *= Math.pow(0.25, dt);
 ft.life -= dt * 1.08;
 if (ft.life <= 0) floatingTexts.splice(i, 1);
 }

 if (saveDirty && performance.now() - lastSaveAt > 2000) {
 flushSave();
 }
}

function drawWorldEffects() {
 const invScale = Math.min(2.6, Math.max(1.0, 0.75 / camera.zoom));

 // Облачка пыли из-под копыт и колёс
 for (let i = 0; i < dustPuffs.length; i++) {
 const dp = dustPuffs[i];
 ctx.save();
 ctx.globalAlpha = Math.max(0, dp.life * 0.75);
 ctx.fillStyle = dp.color;
 ctx.beginPath();
 ctx.arc(dp.x, dp.y, dp.r, 0, Math.PI * 2);
 ctx.fill();
 ctx.restore();
 }

 // Разлетающиеся частицы (монетки, сердечки, щепки, искорки)
 for (let i = 0; i < particles.length; i++) {
 const p = particles[i];
 ctx.save();
 ctx.translate(p.x, p.y);
 if (p.rot) ctx.rotate(p.rot);
 ctx.globalAlpha = Math.max(0, p.life);
 drawCartoonIcon(ctx, p.iconKey, 0, 0, 25 * p.scale * invScale);
 ctx.restore();
 }

 // Всплывающие пиксельные цифры при сборе урожая, монет и продаже хряков
 for (let i = 0; i < floatingTexts.length; i++) {
 const ft = floatingTexts[i];
 const progress = 1 - ft.life;
 const popScale = progress < 0.16
 ? 0.65 + (progress / 0.16) * 0.45
 : Math.max(0.92, 1.1 - (progress - 0.16) * 0.22);
 ctx.save();
 ctx.translate(Math.round(ft.x), Math.round(ft.y));
 ctx.scale(invScale * popScale, invScale * popScale);
 ctx.globalAlpha = Math.max(0, Math.min(1, ft.life * 1.3));
 drawOutlinedText(ft.text, 0, 0, 14.5, ft.color, 'center', 3.0, true);
 ctx.restore();
 }
}

let rafId = null;

function renderSceneFrame(now) {
 if (!worldInitialized) {
 ctx.fillStyle = '#14283c';
 ctx.fillRect(0, 0, W, H);
 drawOutlinedText('ЗАГРУЗКА «ХРЯКИ ФЕРМА»...', W / 2, H / 2, 18, '#ffe047', 'center', 3.0);
 return;
 }

 try {
 ctx.save();
 const shakeX = cameraShakeTime > 0 ? (Math.random() - 0.5) * cameraShakeMag * 2 : 0;
 const shakeY = cameraShakeTime > 0 ? (Math.random() - 0.5) * cameraShakeMag * 2 : 0;
 ctx.translate(shakeX, shakeY);
 ctx.scale(camera.zoom, camera.zoom);
 ctx.translate(-camera.x, -camera.y);
 drawTerrainAndTiles(now);
 drawEstateProps(now);
 drawMarketZone(now);
 drawBreedingHouse(now);
 drawBarnZone(now);
 drawSawmillZone(now);
 drawPenAndBoars();
 drawAllFields(now);
 drawLogSpots(now);
 drawTreasures(now);
 drawLandmarks(now);
 drawAmbientLife(now);
 drawCloudsAndDayNight(now);
 drawCaravan(now);
 drawWorldEffects();
 ctx.restore();
 } catch (err) {
 try { ctx.restore(); } catch (e) {}
 }

 try {
 drawHUD(now);
 } catch (err) {}
}

function gameLoop(now) {
 if (document.hidden) {
 rafId = null;
 return;
 }
 rafId = requestAnimationFrame(gameLoop);

 if (!worldInitialized) {
 renderSceneFrame(now);
 return;
 }

 const dt = Math.min((now - lastTime) / 1000, 0.1);
 lastTime = now;

 try {
 update(dt);
 } catch (err) {}

 renderSceneFrame(now);
}

document.addEventListener('visibilitychange', () => {
 if (document.hidden) {
 flushSave();
 } else {
 lastTime = performance.now();
 if (!rafId) rafId = requestAnimationFrame(gameLoop);
 }
});

window.addEventListener('pagehide', flushSave);
window.addEventListener('resize', resize);
if (window.visualViewport) {
 window.visualViewport.addEventListener('resize', resize);
}

// Надёжный мгновенный старт игры при открытии в Chrome, WebView и Telegram Mini App
function bootGame() {
 if (worldInitialized) return;
 try {
 resize();
 buildValleyMap();
 loadGame();
 syncActiveBoars();
 loadAllSprites();
 bakeOverviewTerrain();
 rebuildFogCanvas();
 const startZoom = Math.min(0.85, Math.max(0.54, (W - 24) / 600));
 camera.zoom = startZoom;
 camera.targetZoom = startZoom;
 focusCameraOn(WORLD.penRect.x + WORLD.penRect.w / 2, WORLD.penRect.y + WORLD.penRect.h * 0.72, startZoom);
 if (camera.targetX !== null) {
 camera.x = camera.targetX;
 camera.y = camera.targetY;
 camera.targetX = null;
 camera.targetY = null;
 }
 } catch (e) {
 console.error('Boot error:', e);
 }
 lastTime = performance.now();
 worldInitialized = true;
 renderSceneFrame(lastTime);
 if (!rafId) {
 rafId = requestAnimationFrame(gameLoop);
 }
 setTimeout(() => {
 resize();
 renderSceneFrame(performance.now());
 }, 120);
 initTelegramAsync();
}

if (document.readyState === 'loading') {
 document.addEventListener('DOMContentLoaded', bootGame, { once: true });
} else {
 bootGame();
}

/**
 * УПРАВЛЕНИЕ: PINCH-TO-ZOOM, КОЛЁСИКО, ТАП ПО КАРТЕ
 */
function pointInRect(px, py, r) {
 return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

function isHudHit(sx, sy) {
 if (pointInRect(sx, sy, hudLayout.shopBtn)) return true;
 if (pointInRect(sx, sy, hudLayout.soundBtn)) return true;
 if (pointInRect(sx, sy, hudLayout.zoomOutBtn)) return true;
 if (pointInRect(sx, sy, hudLayout.zoomResetBtn)) return true;
 if (pointInRect(sx, sy, hudLayout.zoomInBtn)) return true;
 if (pointInRect(sx, sy, hudLayout.minimap)) return true;
 if (pointInRect(sx, sy, hudLayout.sunDialCard)) return true;
 if (pointInRect(sx, sy, hudLayout.starsShopBtn)) return true;
 for (const btn of hudLayout.seedBtns) {
 if (pointInRect(sx, sy, btn)) return true;
 }
 for (const btn of hudLayout.navBtns) {
 if (pointInRect(sx, sy, btn)) return true;
 }
 if (sy >= H - 76) return true;
 return false;
}

function jumpFromMinimap(sx, sy, instant = false) {
 const mm = hudLayout.minimap;
 const wx = Math.max(0, Math.min(WORLD.w, ((sx - mm.x) / mm.w) * WORLD.w));
 const wy = Math.max(0, Math.min(WORLD.h, ((sy - mm.y) / mm.h) * WORLD.h));
 if (instant) {
 const c = clampCamera(wx - (W / 2) / camera.zoom, wy - (H / 2) / camera.zoom);
 camera.x = c.x;
 camera.y = c.y;
 camera.targetX = null;
 camera.targetY = null;
 camera.vx = 0;
 camera.vy = 0;
 } else {
 focusCameraOn(wx, wy);
 }
}

function getTwoPointers() {
 const pts = Array.from(activePointers.values());
 return pts.length >= 2 ? [pts[0], pts[1]] : null;
}

canvas.addEventListener('pointerdown', (e) => {
 if (!worldInitialized || shopModal.classList.contains('active') || breedModal.classList.contains('active') || marketModal.classList.contains('active') || sawmillModal.classList.contains('active') || voyageModal.classList.contains('active') || starsShopModal.classList.contains('active')) return;
 const rect = canvas.getBoundingClientRect();
 const sx = e.clientX - rect.left;
 const sy = e.clientY - rect.top;

 activePointers.set(e.pointerId, { x: sx, y: sy });

 if (activePointers.size === 2) {
 const pair = getTwoPointers();
 if (pair) {
 const [p1, p2] = pair;
 camera.isPinching = true;
 camera.isDragging = false;
 camera.isMinimapDragging = false;
 camera.dragMoved = true;
 camera.targetX = null;
 camera.targetY = null;
 camera.vx = 0;
 camera.vy = 0;
 camera.pinchStartDist = Math.max(10, Math.hypot(p2.x - p1.x, p2.y - p1.y));
 camera.pinchStartZoom = camera.zoom;
 camera.pinchLastMidX = (p1.x + p2.x) / 2;
 camera.pinchLastMidY = (p1.y + p2.y) / 2;
 }
 return;
 }

 if (activePointers.size > 2) return;

 camera.activePointerId = e.pointerId;
 camera.downX = sx;
 camera.downY = sy;
 camera.lastX = sx;
 camera.lastY = sy;
 camera.dragMoved = false;

 if (pointInRect(sx, sy, hudLayout.shopBtn)) pressedHudKey = 'shop';
 else if (pointInRect(sx, sy, hudLayout.soundBtn)) pressedHudKey = 'sound';
 else if (pointInRect(sx, sy, hudLayout.zoomOutBtn)) pressedHudKey = 'zoomOut';
 else if (pointInRect(sx, sy, hudLayout.zoomInBtn)) pressedHudKey = 'zoomIn';
 else if (pointInRect(sx, sy, hudLayout.zoomResetBtn)) pressedHudKey = 'zoomReset';
 else if (pointInRect(sx, sy, hudLayout.sunDialCard)) pressedHudKey = 'sundial';
 else if (pointInRect(sx, sy, hudLayout.starsShopBtn)) pressedHudKey = 'starsShop';
 else {
 for (const btn of hudLayout.seedBtns) {
 if (pointInRect(sx, sy, btn)) {
 pressedHudKey = `seed_${btn.cropId}`;
 break;
 }
 }
 }

 if (pointInRect(sx, sy, hudLayout.minimap)) {
 camera.isMinimapDragging = true;
 SoundManager.uiClick();
 jumpFromMinimap(sx, sy, true);
 return;
 }

 if (!isHudHit(sx, sy)) {
 camera.isDragging = true;
 camera.targetX = null;
 camera.targetY = null;
 camera.vx = 0;
 camera.vy = 0;
 }
});

canvas.addEventListener('pointermove', (e) => {
 if (!activePointers.has(e.pointerId)) return;
 const rect = canvas.getBoundingClientRect();
 const sx = e.clientX - rect.left;
 const sy = e.clientY - rect.top;
 activePointers.set(e.pointerId, { x: sx, y: sy });

 if (camera.isPinching && activePointers.size >= 2) {
 const pair = getTwoPointers();
 if (!pair) return;
 const [p1, p2] = pair;
 const dist = Math.max(10, Math.hypot(p2.x - p1.x, p2.y - p1.y));
 const midX = (p1.x + p2.x) / 2;
 const midY = (p1.y + p2.y) / 2;

 const anchorWx = camera.x + camera.pinchLastMidX / camera.zoom;
 const anchorWy = camera.y + camera.pinchLastMidY / camera.zoom;

 const nextZoom = clampZoom(camera.pinchStartZoom * (dist / camera.pinchStartDist));
 camera.zoom = nextZoom;
 camera.targetZoom = nextZoom;
 camera.zoomAnchorSx = null;
 camera.zoomAnchorSy = null;

 const c = clampCamera(anchorWx - midX / nextZoom, anchorWy - midY / nextZoom, nextZoom);
 camera.x = c.x;
 camera.y = c.y;

 camera.pinchLastMidX = midX;
 camera.pinchLastMidY = midY;
 return;
 }

 if (e.pointerId !== camera.activePointerId) return;

 if (camera.isMinimapDragging) {
 jumpFromMinimap(sx, sy, true);
 return;
 }

 if (!camera.isDragging) return;

 const totalDist = Math.hypot(sx - camera.downX, sy - camera.downY);
 if (totalDist > 18) {
 camera.dragMoved = true;
 }

 if (camera.dragMoved) {
 const dx = (sx - camera.lastX) / camera.zoom;
 const dy = (sy - camera.lastY) / camera.zoom;
 const c = clampCamera(camera.x - dx, camera.y - dy);
 camera.x = c.x;
 camera.y = c.y;
 camera.vx = -dx * 26;
 camera.vy = -dy * 26;
 }

 camera.lastX = sx;
 camera.lastY = sy;
});

function handlePointerFinish(e) {
 pressedHudKey = null;
 activePointers.delete(e.pointerId);

 if (camera.isPinching) {
 if (activePointers.size < 2) {
 camera.isPinching = false;
 if (activePointers.size === 1) {
 const [remId, remPt] = activePointers.entries().next().value;
 camera.activePointerId = remId;
 camera.lastX = remPt.x;
 camera.lastY = remPt.y;
 camera.isDragging = true;
 camera.dragMoved = true;
 } else {
 camera.isDragging = false;
 camera.activePointerId = null;
 }
 }
 return;
 }

 if (e.pointerId !== camera.activePointerId) return;
 const wasDrag = camera.dragMoved;
 const wasMinimap = camera.isMinimapDragging;
 camera.isDragging = false;
 camera.isMinimapDragging = false;
 camera.activePointerId = null;

 if (!wasDrag && !wasMinimap && worldInitialized && !shopModal.classList.contains('active') && !breedModal.classList.contains('active') && !marketModal.classList.contains('active') && !sawmillModal.classList.contains('active') && !voyageModal.classList.contains('active')) {
 const rect = canvas.getBoundingClientRect();
 const sx = e.clientX - rect.left;
 const sy = e.clientY - rect.top;
 handleSingleTap(sx, sy);
 }
}

canvas.addEventListener('pointerup', handlePointerFinish);
canvas.addEventListener('pointercancel', (e) => {
 pressedHudKey = null;
 activePointers.delete(e.pointerId);
 if (activePointers.size === 0) {
 camera.isDragging = false;
 camera.isMinimapDragging = false;
 camera.isPinching = false;
 camera.activePointerId = null;
 }
});

canvas.addEventListener('wheel', (e) => {
 if (!worldInitialized || shopModal.classList.contains('active') || breedModal.classList.contains('active') || marketModal.classList.contains('active') || sawmillModal.classList.contains('active') || voyageModal.classList.contains('active') || starsShopModal.classList.contains('active')) return;
 e.preventDefault();
 const rect = canvas.getBoundingClientRect();
 const sx = e.clientX - rect.left;
 const sy = e.clientY - rect.top;
 const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
 setZoomAroundScreenPoint(camera.targetZoom * factor, sx, sy, true);
}, { passive: false });

function handleSingleTap(sx, sy) {
 if (pointInRect(sx, sy, hudLayout.shopBtn)) {
 shopBtnBounce = 1.0;
 triggerHaptic('medium');
 SoundManager.uiClick();
 openShop('boars');
 return;
 }

 if (pointInRect(sx, sy, hudLayout.soundBtn)) {
 SoundManager.toggleMute();
 triggerHaptic('light');
 return;
 }

 if (pointInRect(sx, sy, hudLayout.zoomOutBtn)) {
 setZoomAroundScreenPoint(camera.targetZoom * 0.72, W / 2, H / 2, true);
 SoundManager.zoomStep(-1);
 triggerHaptic('light');
 return;
 }
 if (pointInRect(sx, sy, hudLayout.zoomInBtn)) {
 setZoomAroundScreenPoint(camera.targetZoom * 1.38, W / 2, H / 2, true);
 SoundManager.zoomStep(1);
 triggerHaptic('light');
 return;
 }
 if (pointInRect(sx, sy, hudLayout.zoomResetBtn)) {
 const nextZ = camera.targetZoom > 0.3 ? 0.092 : 0.85;
 setZoomAroundScreenPoint(nextZ, W / 2, H / 2, true);
 SoundManager.zoomStep(nextZ > camera.targetZoom ? 1 : -1);
 triggerHaptic('light');
 return;
 }

 if (pointInRect(sx, sy, hudLayout.starsShopBtn)) {
 SoundManager.uiClick();
 triggerHaptic('medium');
 openStarsShopModal();
 return;
 }

 if (pointInRect(sx, sy, hudLayout.sunDialCard)) {
 state.gameMinutes = (state.gameMinutes + 240) % 1440;
 SoundManager.uiClick();
 triggerHaptic('light');
 saveGame();
 return;
 }

 for (const btn of hudLayout.seedBtns) {
 if (pointInRect(sx, sy, btn)) {
 state.selectedSeed = btn.cropId;
 seedBounce[btn.cropId] = 1.0;
 SoundManager.uiClick();
 triggerHaptic('light');
 saveGame();
 return;
 }
 }



 if (pointInRect(sx, sy, hudLayout.minimap)) {
 SoundManager.uiClick();
 triggerHaptic('light');
 jumpFromMinimap(sx, sy, false);
 return;
 }

 const wx = sx / camera.zoom + camera.x;
 const wy = sy / camera.zoom + camera.y;
 const barnMult = getBarnBonusMultiplier();

 if (state.food > 0 && activeBoars.length > 0 && pointInRect(wx, wy, getFeedAllWorldRect())) {
 let totalReward = 0;
 let fedCount = 0;
 const { x, y, w, h } = WORLD.penRect;

 activeBoars.forEach((boar) => {
 if (state.food > 0 && boar.fullnessTimer <= 0) {
 state.food -= 1;
 const reward = Math.round(boar.feedBonus * barnMult);
 totalReward += reward;
 boar.bounceTime = 1.0;
 boar.heartsTime = 1.0;
 boar.fullnessTimer = boar.digestTime || 7.0;
 boar.labelTimer = 3.5;
 fedCount++;
 const bx = x + 56 + boar.x * (w - 112);
 const by = y + 56 + boar.y * (h - 94);
 spawnParticles(bx, by - 16, 'coin', 4);
 }
 });

 if (fedCount > 0) {
 state.coins += totalReward;
 SoundManager.crunch();
 SoundManager.coin();
 triggerHaptic('success');
 spawnFloatingText(x + w / 2, y + h / 2, `Хрум x${fedCount}: ${formatCoinsText(totalReward)}`, '#ffdd59');
 saveGame();
 } else {
 SoundManager.uiClick();
 spawnFloatingText(x + w / 2, y + h / 2, 'Хряки наелись и отдыхают', '#ff9ff3');
 }
 return;
 }

 const { x: px0, y: py0, w: pw, h: ph } = WORLD.penRect;
 for (let i = activeBoars.length - 1; i >= 0; i--) {
 const boar = activeBoars[i];
 const bx = px0 + 56 + boar.x * (pw - 112);
 const by = py0 + 56 + boar.y * (ph - 94);
 const hitRadius = 58 * boar.scale;

 if (Math.hypot(wx - bx, wy - by) <= hitRadius) {
 boar.bounceTime = 1.0;
 boar.labelTimer = 3.5;

 if (state.food > 0 && boar.fullnessTimer <= 0) {
 state.food -= 1;
 const reward = Math.round(boar.feedBonus * barnMult);
 state.coins += reward;
 boar.heartsTime = 1.0;
 boar.fullnessTimer = boar.digestTime || 7.0;
 SoundManager.crunch();
 SoundManager.coin();
 triggerHaptic('success');
 spawnParticles(bx, by - 20, 'coin', 6);
 spawnParticles(bx, by - 32, 'heart', 4);
 spawnDustPuff(bx, by + 26, 4);
 triggerCameraShake(3.2, 0.12);
 spawnFloatingText(bx, by - 48, `${boar.nickname}: ${formatCoinsText(reward)}`, '#ffdd59');
 } else {
 const reward = Math.round(boar.income * barnMult);
 state.coins += reward;
 const pitchMap = { boar_classic: 1.05, boar_curly: 1.12, boar_apple: 1.2, boar_spotted: 0.95, boar_forest: 0.86, boar_black: 0.78 };
 SoundManager.oink(pitchMap[boar.id] || 1.0);
 SoundManager.coin();
 triggerHaptic('medium');
 spawnParticles(bx, by - 20, 'coin', 4);
 spawnParticles(bx, by - 28, 'sparkle', 2);
 spawnDustPuff(bx, by + 26, 3);
 const statusHint = boar.fullnessTimer > 0 ? ` • сыт ${Math.ceil(boar.fullnessTimer)}с` : '';
 spawnFloatingText(bx, by - 42, `${boar.nickname}: ${formatCoinsText(reward)}${statusHint}`, '#ffffff');
 }

 saveGame();
 return;
 }
 }

 // Проверка нажатия по бревну на карте
 for (let i = 0; i < LOG_SPOTS.length; i++) {
 const lg = LOG_SPOTS[i];
 if (lg.respawnAt > performance.now()) continue;
 const tileIdx = lg.ty * MAP_COLS + lg.tx;
 if (FOG_GRID[tileIdx] === 0) continue;
 const lx = lg.tx * TILE_SIZE + TILE_SIZE / 2;
 const ly = lg.ty * TILE_SIZE + TILE_SIZE / 2;
 const hitR = Math.max(36, 28 / camera.zoom);
 if (Math.hypot(wx - lx, wy - ly) <= hitR) {
 const gained = lg.amount + (state.axeLevel - 1);
 state.logs += gained;
 lg.respawnAt = performance.now() + 45000;
 SoundManager.chop();
 triggerHaptic('medium');
 spawnParticles(lx, ly - 10, 'log', 4);
 spawnParticles(lx, ly - 14, 'woodchip', 6);
 triggerCameraShake(4.0, 0.15);
 spawnFloatingText(lx, ly - 24, `+${gained} брев.`, '#deb887');
 saveGame();
 return;
 }
 }

 if (pointInRect(wx, wy, SAWMILL_CONFIG.rect)) {
 if (state.sawmillLevel === 0) {
 if (state.coins >= SAWMILL_CONFIG.buildPrice) {
 state.coins -= SAWMILL_CONFIG.buildPrice;
 state.sawmillLevel = 1;
 saveGame(true);
 SoundManager.purchase();
 triggerHaptic('success');
 spawnParticles(SAWMILL_CONFIG.rect.x + 170, SAWMILL_CONFIG.rect.y + 180, 'log', 8);
 spawnFloatingText(SAWMILL_CONFIG.rect.x + 170, SAWMILL_CONFIG.rect.y + 120, 'Лесопилка готова!', '#ffe047');
 openSawmillModal();
 } else {
 SoundManager.uiClick();
 spawnFloatingText(SAWMILL_CONFIG.rect.x + 170, SAWMILL_CONFIG.rect.y + 180, `Нужно ${SAWMILL_CONFIG.buildPrice} монет`, '#ff6b6b');
 }
 } else if (state.sawmillStoredCoins >= 1) {
 const collected = Math.floor(state.sawmillStoredCoins);
 state.coins += collected;
 state.sawmillStoredCoins -= collected;
 SoundManager.coin();
 triggerHaptic('success');
 spawnParticles(SAWMILL_CONFIG.rect.x + 170, SAWMILL_CONFIG.rect.y + 120, 'coin', 7);
 spawnFloatingText(SAWMILL_CONFIG.rect.x + 170, SAWMILL_CONFIG.rect.y + 85, `${formatCoinsText(collected)} за доски`, '#ffe047');
 saveGame();
 } else {
 SoundManager.uiClick();
 triggerHaptic('medium');
 openSawmillModal();
 }
 return;
 }

 if (pointInRect(wx, wy, BREEDING_CONFIG.rect)) {
 SoundManager.uiClick();
 triggerHaptic('medium');
 openBreedModal();
 return;
 }

 if (pointInRect(wx, wy, MARKET_CONFIG.rect)) {
 SoundManager.uiClick();
 triggerHaptic('medium');
 openMarketModal();
 return;
 }

 if (pointInRect(wx, wy, BARN_CONFIG.rect)) {
 if (state.barnLevel === 0) {
 triggerHaptic('medium');
 openShop('territory');
 } else {
 barnBounce = 1.0;
 const collected = Math.floor(state.barnStoredCoins);
 if (collected >= 1) {
 state.coins += collected;
 state.barnStoredCoins -= collected;
 SoundManager.coin();
 triggerHaptic('success');
 spawnParticles(BARN_CONFIG.rect.x + BARN_CONFIG.rect.w / 2, BARN_CONFIG.rect.y + 130, 'coin', 7);
 spawnFloatingText(BARN_CONFIG.rect.x + BARN_CONFIG.rect.w / 2, BARN_CONFIG.rect.y + 90, `${formatCoinsText(collected)}`, '#ffdd59');
 } else {
 state.coins += 1;
 SoundManager.coin();
 triggerHaptic('light');
 spawnParticles(BARN_CONFIG.rect.x + BARN_CONFIG.rect.w / 2, BARN_CONFIG.rect.y + 130, 'coin', 2);
 spawnFloatingText(BARN_CONFIG.rect.x + BARN_CONFIG.rect.w / 2, BARN_CONFIG.rect.y + 90, '+1', '#ffffff');
 }
 saveGame();
 }
 return;
 }

 for (const fieldCfg of FIELD_CONFIGS) {
 if (!pointInRect(wx, wy, fieldCfg.rect)) continue;

 const isUnlocked = state.unlockedFields.includes(fieldCfg.id);
 if (!isUnlocked) {
 triggerHaptic('medium');
 openShop('territory');
 return;
 }

 const unlockPos = state.unlockedFields.indexOf(fieldCfg.id);
 const startPlotIdx = unlockPos * 6;
 const endPlotIdx = startPlotIdx + 6;

 let readyCount = 0;
 for (let gi = startPlotIdx; gi < endPlotIdx; gi++) {
 if (state.plots[gi] && state.plots[gi].ready) readyCount++;
 }

 if (readyCount >= 2 && pointInRect(wx, wy, getFieldHarvestRect(fieldCfg))) {
 let totalFood = 0;
 const plotRects = getFieldPlotRects(fieldCfg);
 plotRects.forEach((pRect) => {
 const gi = startPlotIdx + pRect.localIndex;
 const plot = state.plots[gi];
 if (plot && plot.ready) {
 const cropCfg = CROPS[plot.crop];
 totalFood += cropCfg.feedValue;
 plot.crop = null;
 plot.ready = false;
 spawnParticles(pRect.x + pRect.w / 2, pRect.y + pRect.h / 2, cropCfg.iconKey, 5);
 }
 });
 state.food += totalFood;
 SoundManager.harvest();
 triggerHaptic('success');
 spawnFloatingText(fieldCfg.rect.x + fieldCfg.rect.w / 2, fieldCfg.rect.y + 45, `+${totalFood} корма`, '#a3e635');
 saveGame();
 return;
 }

 const plotRects = getFieldPlotRects(fieldCfg);
 for (const pRect of plotRects) {
 if (!pointInRect(wx, wy, pRect)) continue;

 const globalIdx = startPlotIdx + pRect.localIndex;
 if (globalIdx >= state.plotCount) {
 triggerHaptic('light');
 openShop('upgrades');
 return;
 }

 const plot = state.plots[globalIdx];
 const cx = pRect.x + pRect.w / 2;
 const cy = pRect.y + pRect.h / 2;

 if (!plot.crop) {
 const seedCfg = CROPS[state.selectedSeed];
 if (state.coins < seedCfg.seedCost) {
 SoundManager.uiClick();
 spawnFloatingText(cx, cy - 10, `Нужно ${seedCfg.seedCost} монет`, '#ff6b6b');
 return;
 }
 state.coins -= seedCfg.seedCost;
 plot.crop = state.selectedSeed;
 plot.progress = 0;
 plot.ready = false;
 plot.hasWeed = false;
 plot.weedChecked = false;
 SoundManager.plant();
 triggerHaptic('light');
 spawnParticles(cx, cy, 'plot', 4);
 spawnFloatingText(cx, cy - 12, `-${seedCfg.seedCost} монет`, '#ffcf56');
 saveGame();
 } else if (plot.ready) {
 const cropCfg = CROPS[plot.crop];
 state.food += cropCfg.feedValue;
 plot.crop = null;
 plot.progress = 0;
 plot.ready = false;
 plot.hasWeed = false;
 plot.weedChecked = false;
 SoundManager.harvest();
 triggerHaptic('success');
 spawnParticles(cx, cy, cropCfg.iconKey, 5);
 spawnParticles(cx, cy - 8, 'sparkle', 4);
 triggerCameraShake(2.8, 0.11);
 spawnFloatingText(cx, cy - 10, formatCropHarvestText(cropCfg.id, cropCfg.feedValue), '#a3e635');
 saveGame();
 } else if (plot.hasWeed) {
 plot.hasWeed = false;
 plot.progress = Math.min(1, plot.progress + 0.06);
 SoundManager.harvest();
 triggerHaptic('medium');
 spawnParticles(cx, cy, 'fertilizer', 4);
 spawnFloatingText(cx, cy - 10, 'Сорняк вырван!', '#a3e635');
 saveGame();
 } else {
 const cropCfg = CROPS[plot.crop];
 plot.progress = Math.min(1, plot.progress + 0.25 / cropCfg.growTime);
 if (plot.progress >= 1) plot.ready = true;
 SoundManager.waterBoost();
 triggerHaptic('light');
 spawnParticles(cx, cy, 'fertilizer', 2);
 }
 return;
 }
 }

 // Если нажали на Верфь / Порт «Морской Пятачок» — открываем окно постройки корабля или морского похода
 const harborWx = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
 const harborWy = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;
 if (Math.hypot(wx - harborWx, wy - harborWy) <= Math.max(78, 56 / camera.zoom)) {
 SoundManager.uiClick();
 triggerHaptic('medium');
 openVoyageModal();
 return;
 }

 // Если нажали прямо на корабль/обоз во время сборов или плавания — открываем окно похода
 if ((caravan.status === 'voyage_prep' || caravan.status === 'voyage_sailing') &&
 Math.hypot(wx - caravan.x, wy - caravan.y) <= Math.max(65, 48 / camera.zoom)) {
 SoundManager.uiClick();
 triggerHaptic('medium');
 openVoyageModal();
 return;
 }

 if (wx >= 60 && wx <= WORLD.w - 60 && wy >= 60 && wy <= WORLD.h - 60) {
 sendCaravanTo(wx, wy);
 }
}

function drawBoarToMiniCanvas(canvasEl, speciesId, size = 48, gender = 'male') {
 if (!canvasEl) return;
 const c = canvasEl.getContext('2d');
 c.clearRect(0, 0, canvasEl.width, canvasEl.height);
 const sprite = boarSprites[speciesId];
 if (sprite && sprite.complete && sprite.naturalWidth > 0) {
 const aspect = sprite.naturalWidth / sprite.naturalHeight;
 let dw = size, dh = size;
 if (aspect > 1) dh = size / aspect;
 else dw = size * aspect;
 const ox = (canvasEl.width - dw) / 2;
 const oy = (canvasEl.height - dh) / 2;
 c.drawImage(sprite, ox, oy, dw, dh);
 if (gender === 'female') {
 drawGirlBow(c, canvasEl.width / 2 + dw * 0.04, oy + dh * 0.06, 0.56);
 }
 }
}

 breedModal.classList.add('active');
 if (breedTimerInterval) clearInterval(breedTimerInterval);

 }

 if (remMs <= 0) {

 claimBtn.style.width = '100%';

 });
 if (!state.unlockedBoars.includes(baby.speciesId)) {

 state.boars.push(baby);

 syncActiveBoars();

/**
 * МОРСКОЙ ПОХОД НА ОСТРОВА И В ДАЛЬНЕЕ МОРЕ («ВЫ УВЕРЕНЫ?», 15 МИН СБОРЫ, 30 МИН ПЛАВАНИЕ)
 */
const voyageModal = document.getElementById('voyageModal');
const voyageBody = document.getElementById('voyageBody');
const voyageModalTitle = document.getElementById('voyageModalTitle');
let voyageOpenedAt = 0;
let voyageTimerInterval = null;

function openVoyageModal() {
 voyageOpenedAt = performance.now();
 renderIconToCanvas(document.getElementById('voyageHeaderIcon'), 'ship');
 renderIconToCanvas(document.getElementById('voyageBalanceCoin'), 'coin');
 renderVoyageModal();
 voyageModal.classList.add('active');
 if (voyageTimerInterval) clearInterval(voyageTimerInterval);
 voyageTimerInterval = setInterval(() => {
 if (voyageModal.classList.contains('active')) {
 renderVoyageModal();
 }
 }, 1000);
}

function closeVoyageModal() {
 voyageModal.classList.remove('active');
 pendingVoyageTarget = null;
 if (voyageTimerInterval) {
 clearInterval(voyageTimerInterval);
 voyageTimerInterval = null;
 }
}

document.getElementById('closeVoyageBtn').addEventListener('click', (e) => {
 e.stopPropagation();
 SoundManager.uiClick();
 closeVoyageModal();
});

voyageModal.addEventListener('pointerdown', (e) => {
 if (e.target === voyageModal && performance.now() - voyageOpenedAt > 450) {
 closeVoyageModal();
 }
});

function renderVoyageModal() {
 document.getElementById('voyageCoinText').textContent = Math.floor(state.coins).toString();
 voyageBody.innerHTML = '';

 // Сценарий 1: Идут 15-минутные сборы перед отплытием (игрок ЕЩЁ МОЖЕТ ПЕРЕДУМАТЬ!)
 if (caravan.status === 'voyage_prep' && state.voyage && state.voyage.active) {
 voyageModalTitle.textContent = 'ВЫ УВЕРЕНЫ? (СБОРЫ)';
 const remMs = Math.max(0, state.voyage.prepStartTimeMs + state.voyage.prepDurationMs - Date.now());
 const pct = Math.min(100, Math.round((1 - remMs / state.voyage.prepDurationMs) * 100));

 const infoCard = document.createElement('div');
 infoCard.className = 'forecast-panel';
 infoCard.innerHTML = `
 <div style="font-size:14.5px;margin-bottom:6px">⛵ <b>Пункт назначения: ${state.voyage.destName}</b></div>
 <div>Хряки грузят припасы на корабль в порту. До отплытия осталось время, поэтому <b>вы ещё можете передумать и отменить поход!</b></div>
 <div style="margin-top:6px;color:#b71c1c">⚠️ Как только корабль отплывёт (на 30 минут), во время пути хряков нельзя будет использовать в другой поход!</div>
 <div class="upgrade-bar" style="height:12px;margin-top:8px"><div class="upgrade-bar-fill" style="width:${pct}%"></div></div>
 `;
 voyageBody.appendChild(infoCard);

 const timerDiv = document.createElement('div');
 timerDiv.className = 'timer-banner';
 timerDiv.textContent = `Отплытие через: ${formatRealDuration(remMs)}`;
 voyageBody.appendChild(timerDiv);

 const cancelBtn = document.createElement('button');
 cancelBtn.type = 'button';
 cancelBtn.className = 'sell-btn';
 cancelBtn.style.width = '100%';
 cancelBtn.style.justifyContent = 'center';
 cancelBtn.style.padding = '12px';
 cancelBtn.style.fontSize = '14px';
 cancelBtn.style.background = 'linear-gradient(180deg, #ff7b7b 0%, #e03131 100%)';
 cancelBtn.style.color = '#ffffff';
 cancelBtn.textContent = `Отменить поход (+${state.voyage.cost || SEA_VOYAGE_COST} монет)`;
 cancelBtn.onclick = () => {
 const refund = state.voyage.cost || SEA_VOYAGE_COST;
 state.coins += refund;
 state.voyage = null;
 caravan.status = 'idle';
 caravan.targetX = null;
 caravan.targetY = null;
 saveGame(true);
 SoundManager.uiClick();
 triggerHaptic('medium');
 spawnFloatingText(caravan.x, caravan.y - 30, `Поход отменён: ${formatCoinsText(refund)}`, '#a3e635');
 closeVoyageModal();
 };
 voyageBody.appendChild(cancelBtn);

 const keepBtn = document.createElement('button');
 keepBtn.type = 'button';
 keepBtn.className = 'buy-btn';
 keepBtn.style.width = '100%';
 keepBtn.style.justifyContent = 'center';
 keepBtn.style.padding = '11px';
 keepBtn.textContent = 'Продолжать подготовку к отплытию';
 keepBtn.onclick = () => {
 SoundManager.uiClick();
 closeVoyageModal();
 };
 voyageBody.appendChild(keepBtn);
 return;
 }

 // Сценарий 2: Корабль УЖЕ в 30-минутном плавании по морю (отменить и перенаправить нельзя!)
 if (caravan.status === 'voyage_sailing' && state.voyage && state.voyage.active) {
 voyageModalTitle.textContent = 'КОРАБЛЬ В МОРЕ';
 const remMs = Math.max(0, state.voyage.sailStartTimeMs + state.voyage.sailDurationMs - Date.now());
 const pct = Math.min(100, Math.round((1 - remMs / state.voyage.sailDurationMs) * 100));

 const sailCard = document.createElement('div');
 sailCard.className = 'forecast-panel';
 sailCard.innerHTML = `
 <div style="font-size:14.5px;margin-bottom:6px">⛵ <b>Курс: ${state.voyage.destName}</b></div>
 <div>Хряки плывут на корабле по открытому морю!</div>
 <div style="margin-top:6px;color:#b71c1c">🔒 <b>Во время пути их нельзя использовать в другой поход</b> — дождитесь прибытия корабля к берегу!</div>
 <div class="upgrade-bar" style="height:12px;margin-top:8px"><div class="upgrade-bar-fill" style="width:${pct}%"></div></div>
 `;
 voyageBody.appendChild(sailCard);

 const timerDiv = document.createElement('div');
 timerDiv.className = 'timer-banner';
 timerDiv.textContent = `До прибытия: ${formatRealDuration(remMs)} (${pct}%)`;
 voyageBody.appendChild(timerDiv);

 const showShipBtn = document.createElement('button');
 showShipBtn.type = 'button';
 showShipBtn.className = 'buy-btn';
 showShipBtn.style.width = '100%';
 showShipBtn.style.justifyContent = 'center';
 showShipBtn.style.padding = '11px';
 showShipBtn.textContent = 'Показать корабль на карте';
 showShipBtn.onclick = () => {
 closeVoyageModal();
 focusCameraOn(caravan.x, caravan.y, 0.55);
 };
 voyageBody.appendChild(showShipBtn);
 return;
 }

 // Сценарий 3A: Обычный сухопутный поход (лес, луг, холмы, ориентир долины) — КОРАБЛЬ НЕ НУЖЕН!
 if (pendingVoyageTarget && !pendingVoyageTarget.isDistantSea) {
 const target = pendingVoyageTarget;
 voyageModalTitle.textContent = 'ОТПРАВИТЬ ХРЯКОВ?';
 renderIconToCanvas(document.getElementById('voyageHeaderIcon'), 'flag');
 const cost = target.cost || EXPEDITION_COST;
 const canAfford = state.coins >= cost;

 const landBox = document.createElement('div');
 landBox.className = 'forecast-panel';
 landBox.innerHTML = `
 <div style="font-size:15px;margin-bottom:6px">🧭 <b>Подтвердите отправку обоза хряков</b></div>
 <div style="margin-bottom:4px">📍 Куда: <b>${target.destName}</b></div>
 <div style="margin-bottom:6px">📏 Расстояние: <b>~${target.distMeters || 45} м</b> • В пути: <b>~${target.estSeconds || 6} сек</b></div>
 <div class="stat-chips" style="margin-bottom:6px">
 <span class="stat-chip highlight">💰 Стоимость: <b>${cost} монет</b></span>
 <span class="stat-chip">🎁 Добыча: монеты, корм и 🪵 брёвна</span>
 </div>
 <div style="font-size:11.5px;color:#5c3818">Если вы нажали на карту случайно — просто нажмите «Отмена».</div>
 `;
 voyageBody.appendChild(landBox);

 const btnRow = document.createElement('div');
 btnRow.style.display = 'flex';
 btnRow.style.flexDirection = 'column';
 btnRow.style.gap = '8px';

 const goBtn = document.createElement('button');
 goBtn.type = 'button';
 goBtn.className = 'buy-btn';
 goBtn.style.width = '100%';
 goBtn.style.justifyContent = 'center';
 goBtn.style.padding = '12px';
 goBtn.style.fontSize = '14.5px';
 goBtn.textContent = canAfford
 ? `Отправить обоз (${cost} монет)`
 : `Не хватает монет (${cost})`;
 goBtn.disabled = !canAfford;
 goBtn.onclick = () => {
 const chosen = pendingVoyageTarget;
 closeVoyageModal();
 if (chosen) executeLandExpedition(chosen);
 };

 const cancelLandBtn = document.createElement('button');
 cancelLandBtn.type = 'button';
 cancelLandBtn.className = 'sell-btn';
 cancelLandBtn.style.width = '100%';
 cancelLandBtn.style.justifyContent = 'center';
 cancelLandBtn.style.padding = '11px';
 cancelLandBtn.style.fontSize = '13.5px';
 cancelLandBtn.style.background = 'linear-gradient(180deg, #ff8787 0%, #e03131 100%)';
 cancelLandBtn.style.color = '#ffffff';
 cancelLandBtn.textContent = 'Отмена';
 cancelLandBtn.onclick = () => {
 SoundManager.uiClick();
 closeVoyageModal();
 };

 btnRow.appendChild(goBtn);
 btnRow.appendChild(cancelLandBtn);
 voyageBody.appendChild(btnRow);
 return;
 }

 // Сценарий 0A: Корабль сейчас строится на верфи (идут 2 часа реального времени)
 if (!state.shipBuilt && state.shipBuild && state.shipBuild.active) {
 voyageModalTitle.textContent = 'ВЕРФЬ: ПОСТРОЙКА КОРАБЛЯ';
 const remMs = Math.max(0, state.shipBuild.startTimeMs + state.shipBuild.durationMs - Date.now());
 const pct = Math.min(100, Math.round((1 - remMs / state.shipBuild.durationMs) * 100));

 const buildCard = document.createElement('div');
 buildCard.className = 'forecast-panel';
 buildCard.innerHTML = `
 <div style="font-size:15px;margin-bottom:6px">🔨 <b>Хряки-плотники строят парусный корабль!</b></div>
 <div>На постройку ушло <b>${SHIP_BUILD_LOGS} брёвен</b> и <b>${SHIP_BUILD_COINS} монет</b>. Полное время строительства — <b>2 часа реального времени</b>.</div>
 <div style="margin-top:6px">После спуска корабля на воду откроются морские походы на все 4 острова!</div>
 <div class="upgrade-bar" style="height:13px;margin-top:9px"><div class="upgrade-bar-fill" style="width:${pct}%"></div></div>
 `;
 voyageBody.appendChild(buildCard);

 const timerDiv = document.createElement('div');
 timerDiv.className = 'timer-banner';
 timerDiv.textContent = remMs > 0 ? `До спуска на воду: ${formatRealDuration(remMs)}` : '🎉 КОРАБЛЬ ПОСТРОЕН!';
 voyageBody.appendChild(timerDiv);

 if (remMs <= 0) {
 const claimShipBtn = document.createElement('button');
 claimShipBtn.type = 'button';
 claimShipBtn.className = 'buy-btn';
 claimShipBtn.style.width = '100%';
 claimShipBtn.style.justifyContent = 'center';
 claimShipBtn.style.padding = '13px';
 claimShipBtn.style.fontSize = '15px';
 claimShipBtn.textContent = 'Спустить корабль на воду';
 claimShipBtn.onclick = () => {
 state.shipBuilt = true;
 state.shipBuild = null;
 saveGame(true);
 SoundManager.discover();
 triggerHaptic('success');
 const hWx = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
 const hWy = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;
 spawnParticles(hWx, hWy - 16, 'ship', 6);
 spawnParticles(hWx, hWy - 24, 'sparkle', 8);
 spawnFloatingText(hWx, hWy - 42, 'Корабль спущен на воду!', '#74ff52');
 renderVoyageModal();
 };
 voyageBody.appendChild(claimShipBtn);
 } else {
 const okBtn = document.createElement('button');
 okBtn.type = 'button';
 okBtn.className = 'buy-btn';
 okBtn.style.width = '100%';
 okBtn.style.justifyContent = 'center';
 okBtn.style.padding = '11px';
 okBtn.textContent = 'Понятно, жду окончания стройки';
 okBtn.onclick = () => {
 SoundManager.uiClick();
 closeVoyageModal();
 };
 voyageBody.appendChild(okBtn);
 }
 return;
 }

 if (!state.shipBuilt) {
 voyageModalTitle.textContent = 'СОЗДАНИЕ КОРАБЛЯ';
 const hasLogs = state.logs >= SHIP_BUILD_LOGS;
 const hasCoins = state.coins >= SHIP_BUILD_COINS;

 needCard.innerHTML = `

 <div class="stat-chips" style="margin-bottom:8px">
 <span class="stat-chip" style="background:${hasLogs ? '#c8ff6b' : '#ffcdd2'}">🪵 Брёвна: <b>${state.logs} / ${SHIP_BUILD_LOGS}</b></span>
 <span class="stat-chip highlight" style="background:${hasCoins ? '#fff08a' : '#ffcdd2'}">💰 Монеты: <b>${Math.floor(state.coins)} / ${SHIP_BUILD_COINS}</b></span>
 </div>
 <div>⏳ <b>Время создания корабля: 2 часа</b> реального времени.</div>
 `;
 voyageBody.appendChild(needCard);

 const buildBtn = document.createElement('button');
 buildBtn.type = 'button';
 buildBtn.className = 'buy-btn';
 buildBtn.style.width = '100%';
 buildBtn.style.justifyContent = 'center';
 buildBtn.style.padding = '13px';
 buildBtn.style.fontSize = '14.5px';
 buildBtn.textContent = canBuild
 ? `Заложить корабль (${SHIP_BUILD_LOGS} бр. + ${SHIP_BUILD_COINS} мон.)`
 : `Нужно ${SHIP_BUILD_LOGS} бр. и ${SHIP_BUILD_COINS} мон.`;
 buildBtn.disabled = !canBuild;
 buildBtn.onclick = () => {
 if (state.logs < SHIP_BUILD_LOGS || state.coins < SHIP_BUILD_COINS || state.shipBuilt || state.shipBuild) return;
 state.logs -= SHIP_BUILD_LOGS;
 state.coins -= SHIP_BUILD_COINS;
 state.shipBuild = {
 active: true,
 startTimeMs: Date.now(),
 durationMs: SHIP_BUILD_DURATION_MS
 };
 saveGame(true);
 SoundManager.purchase();
 SoundManager.chop();
 triggerHaptic('success');
 const hWx = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
 const hWy = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;
 spawnParticles(hWx, hWy - 14, 'woodchip', 8);
 spawnFloatingText(hWx, hWy - 36, 'Верфь застучала топорами (2 ч)', '#ffe047');
 renderVoyageModal();
 };
 voyageBody.appendChild(buildBtn);

 const closeBtn2 = document.createElement('button');
 closeBtn2.type = 'button';
 closeBtn2.className = 'sell-btn';
 closeBtn2.style.width = '100%';
 closeBtn2.style.justifyContent = 'center';
 closeBtn2.style.padding = '11px';
 closeBtn2.textContent = 'Вернуться на ферму';
 closeBtn2.onclick = () => {
 SoundManager.uiClick();
 closeVoyageModal();
 };
 voyageBody.appendChild(closeBtn2);
 return;
 }

 // Сценарий 3B: Дальний морской поход (море или острова, когда корабль уже построен!)
 const target = pendingVoyageTarget || classifyDestination(SEA_ISLANDS[0].tx * TILE_SIZE, SEA_ISLANDS[0].ty * TILE_SIZE);
 voyageModalTitle.textContent = 'ВЫ УВЕРЕНЫ?';
 const cost = target.cost || SEA_VOYAGE_COST;
 const canAfford = state.coins >= cost;

 const confirmBox = document.createElement('div');
 confirmBox.className = 'forecast-panel';
 confirmBox.innerHTML = `
 <div style="font-size:15px;margin-bottom:6px">❓ <b>Вы уверены, что хотите отправить хряков в дальний морской поход?</b></div>
 <div style="margin-bottom:4px">📍 Цель: <b>${target.destName}</b></div>
 <div>⏳ <b>Отправление через: 15 минут</b> реального времени <i>(пока идут сборы, вы сможете передумать и отменить поход!)</i>.</div>
 <div style="margin-top:4px">⛵ <b>Время в пути по морю: ~30 минут</b> реального времени.</div>
 <div style="margin-top:6px;color:#b71c1c">⚠️ <b>Важно:</b> когда корабль отплывёт, во время пути хряков нельзя будет использовать в другой поход!</div>
 <div style="margin-top:6px">💰 Снаряжение корабля: <b>${cost} монет</b></div>
 `;
 voyageBody.appendChild(confirmBox);

 const btnRow = document.createElement('div');
 btnRow.style.display = 'flex';
 btnRow.style.flexDirection = 'column';
 btnRow.style.gap = '8px';

 const confirmBtn = document.createElement('button');
 confirmBtn.type = 'button';
 confirmBtn.className = 'buy-btn';
 confirmBtn.style.width = '100%';
 confirmBtn.style.justifyContent = 'center';
 confirmBtn.style.padding = '12px';
 confirmBtn.style.fontSize = '14px';
 confirmBtn.textContent = canAfford
 ? `Начать сборы (15 мин • ${cost} монет)`
 : `Не хватает монет (нужно ${cost}💰)`;
 confirmBtn.disabled = !canAfford;
 confirmBtn.onclick = () => {
 if (state.coins < cost) return;
 state.coins -= cost;

 const harborWx = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
 const harborWy = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;

 state.voyage = {
 active: true,
 phase: 'prep',
 destName: target.destName,
 isIsland: Boolean(target.isIsland),
 startX: harborWx,
 startY: harborWy,
 targetX: target.targetX,
 targetY: target.targetY,
 cost,
 prepStartTimeMs: Date.now(),
 prepDurationMs: VOYAGE_PREP_DURATION_MS,
 sailStartTimeMs: 0,
 sailDurationMs: VOYAGE_SAIL_DURATION_MS
 };

 caravan.x = harborWx;
 caravan.y = harborWy;
 caravan.targetX = target.targetX;
 caravan.targetY = target.targetY;
 caravan.status = 'voyage_prep';
 caravan.waypoints = [];
 revealFogAroundWorld(harborWx, harborWy, 6);

 saveGame(true);
 SoundManager.marchStart();
 triggerHaptic('success');
 spawnFloatingText(harborWx, harborWy - 30, 'Сборы в порту (15 мин)', '#ffe047');
 renderVoyageModal();
 };

 const cancelBtn = document.createElement('button');
 cancelBtn.type = 'button';
 cancelBtn.className = 'sell-btn';
 cancelBtn.style.width = '100%';
 cancelBtn.style.justifyContent = 'center';
 cancelBtn.style.padding = '11px';
 cancelBtn.style.fontSize = '13.5px';
 cancelBtn.textContent = 'Передумал';
 cancelBtn.onclick = () => {
 pendingVoyageTarget = null;
 SoundManager.uiClick();
 closeVoyageModal();
 };

 btnRow.appendChild(confirmBtn);
 btnRow.appendChild(cancelBtn);
 voyageBody.appendChild(btnRow);
}


/**
 * ЛАВКА БОНУСОВ 🎬 — МОНЕТИЗАЦИЯ ЧЕРЕЗ ADSGRAM REWARDED ADS
 */
const starsShopModal = document.getElementById('starsShopModal');
const starsShopBody = document.getElementById('starsShopBody');
let starsShopOpenedAt = 0;
let bonusTimerInterval = null;
let adShowInProgress = false;

const ADSGRAM_BLOCK_ID = "60521";
const AD_REWARD_COOLDOWN_MS = 3 * 60 * 1000; // Перезарядка 3 минуты на каждую карточку
const AD_COOLDOWNS_STORAGE_KEY = 'khryakograd_ad_cooldowns_v1';

let AdController = null;
let adsgramSdkPromise = null;

function ensureAdsgramSdkLoaded() {
 if (window.Adsgram && typeof window.Adsgram.init === 'function') {
 return Promise.resolve(window.Adsgram);
 }
 if (adsgramSdkPromise) return adsgramSdkPromise;
 adsgramSdkPromise = new Promise((resolve, reject) => {
 const s = document.createElement('script');
 s.src = 'https://sad.adsgram.ai/js/sad.min.js';
 s.async = true;
 s.onload = () => {
 adsgramSdkPromise = null;
 if (window.Adsgram && typeof window.Adsgram.init === 'function') {
 resolve(window.Adsgram);
 } else {
 reject(new Error('window.Adsgram не определён после загрузки sad.min.js'));
 }
 };
 s.onerror = () => {
 adsgramSdkPromise = null;
 reject(new Error('Не удалось загрузить https://sad.adsgram.ai/js/sad.min.js (проверь интернет или VPN)'));
 };
 document.head.appendChild(s);
 });
 return adsgramSdkPromise;
}

function loadAdCooldowns() {
 try {
 const raw = window.localStorage.getItem(AD_COOLDOWNS_STORAGE_KEY) || SafeStorage.get(AD_COOLDOWNS_STORAGE_KEY);
 if (raw) {
 const parsed = JSON.parse(raw);
 if (parsed && typeof parsed === 'object') return parsed;
 }
 } catch (e) {}
 return {};
}

function saveAdCooldowns(map) {
 try {
 const serialized = JSON.stringify(map);
 window.localStorage.setItem(AD_COOLDOWNS_STORAGE_KEY, serialized);
 SafeStorage.set(AD_COOLDOWNS_STORAGE_KEY, serialized);
 } catch (e) {}
}

function getAdRewardRemainingMs(rewardId) {
 const map = loadAdCooldowns();
 const readyAt = Number(map[rewardId] || 0);
 return Math.max(0, readyAt - Date.now());
}

function setAdRewardCooldown(rewardId) {
 const map = loadAdCooldowns();
 map[rewardId] = Date.now() + AD_REWARD_COOLDOWN_MS;
 saveAdCooldowns(map);
}

const AD_REWARD_CATALOG = [
 {
 id: 'turbo',
 title: 'Турбо-инкубатор (+1 ускорение скрещивания)',
 rewardLabel: '+1 ⚡ ускорение',
 iconKey: 'heart',
 desc: 'Мгновенно завершает ожидание в Племенном дворе после просмотра ролика.',
 getStatus: () => `В запасе: ${state.turboBoosts || 0} ускор.`,
 grant: () => {
 state.turboBoosts = (state.turboBoosts || 0) + 1;
 spawnFloatingText(BREEDING_CONFIG.rect.x + 160, BREEDING_CONFIG.rect.y + 80, '+1 ускорение случки!', '#ffe047');
 showPixelToast('Награда получена: +1 ускорение скрещивания!', 'success', 'heart');
 }
 },
 {
 id: 'gold',
 title: 'Мешок золота (+1 500 монет)',
 rewardLabel: '+1 500 монет',
 iconKey: 'coin',
 desc: 'Тяжёлый купеческий мешок звонкой монеты прямо в казну усадьбы.',
 getStatus: () => `В казне: ${Math.floor(state.coins)} монет`,
 grant: () => {
 state.coins += 1500;
 spawnParticles(WORLD.penRect.x + WORLD.penRect.w / 2, WORLD.penRect.y + 120, 'coin', 10);
 spawnFloatingText(WORLD.penRect.x + WORLD.penRect.w / 2, WORLD.penRect.y + 70, '+1 500 монет!', '#ffe047');
 showPixelToast('Награда получена: +1 500 монет!', 'success', 'coin');
 }
 },
 {
 id: 'food',
 title: 'Корзина деликатесов (+15 корма)',
 rewardLabel: '+15 корма',
 iconKey: 'basket',
 desc: 'Свежие корнеплоды и отборные жёлуди для сытости всего стада.',
 getStatus: () => `На складе: ${state.food} корма`,
 grant: () => {
 state.food += 15;
 spawnParticles(WORLD.penRect.x + WORLD.penRect.w / 2, WORLD.penRect.y + 120, 'basket', 8);
 spawnFloatingText(WORLD.penRect.x + WORLD.penRect.w / 2, WORLD.penRect.y + 70, '+15 корма!', '#a3e635');
 showPixelToast('Награда получена: +15 корма!', 'success', 'basket');
 }
 },
 {
 id: 'logs',
 title: 'Вязанка дров (+10 брёвен)',
 rewardLabel: '+10 брёвен',
 iconKey: 'log',
 desc: 'Сухие сосновые брёвна для лесопилки, верфи и построек усадьбы.',
 getStatus: () => `В запасе: ${state.logs} брёвен`,
 grant: () => {
 state.logs += 10;
 spawnParticles(SAWMILL_CONFIG.rect.x + SAWMILL_CONFIG.rect.w / 2, SAWMILL_CONFIG.rect.y + 130, 'log', 8);
 spawnFloatingText(SAWMILL_CONFIG.rect.x + SAWMILL_CONFIG.rect.w / 2, SAWMILL_CONFIG.rect.y + 80, '+10 брёвен!', '#ffcf56');
 showPixelToast('Награда получена: +10 брёвен!', 'success', 'log');
 }
 }
];

function showPixelToast(message, kind = 'success', iconKey = 'star') {
 const container = document.getElementById('pixelToastContainer');
 if (!container) return;
 while (container.children.length >= 3) {
 container.removeChild(container.firstChild);
 }
 const toast = document.createElement('div');
 toast.className = `pixel-toast ${kind === 'error' ? 'toast-error' : 'toast-success'}`;

 const ico = document.createElement('canvas');
 ico.width = 24;
 ico.height = 24;
 renderIconToCanvas(ico, kind === 'error' ? 'flag' : iconKey);

 const txt = document.createElement('div');
 txt.style.flex = '1';
 txt.textContent = message;

 toast.appendChild(ico);
 toast.appendChild(txt);
 container.appendChild(toast);

 setTimeout(() => {
 if (toast.parentNode) toast.parentNode.removeChild(toast);
 }, 3600);
}

function openStarsShopModal() {
 starsShopOpenedAt = performance.now();
 renderIconToCanvas(document.getElementById('starsShopHeaderIcon'), 'star');
 renderStarsShopModal();
 starsShopModal.classList.add('active');
 if (bonusTimerInterval) clearInterval(bonusTimerInterval);
 bonusTimerInterval = setInterval(() => {
 if (starsShopModal.classList.contains('active') && !adShowInProgress) {
 renderStarsShopModal();
 }
 }, 1000);
}

function closeStarsShopModal() {
 starsShopModal.classList.remove('active');
 if (bonusTimerInterval) {
 clearInterval(bonusTimerInterval);
 bonusTimerInterval = null;
 }
}

document.getElementById('closeStarsShopBtn').addEventListener('click', (e) => {
 e.stopPropagation();
 SoundManager.uiClick();
 closeStarsShopModal();
});

starsShopModal.addEventListener('pointerdown', (e) => {
 if (e.target === starsShopModal && performance.now() - starsShopOpenedAt > 450) {
 closeStarsShopModal();
 }
});

function startAdsgramShow(item) {
 if (!AdController) {
 try {
 AdController = window.Adsgram.init({ blockId: "60521" });
 } catch (initErr) {
 AdController = null;
 adShowInProgress = false;
 SoundManager.uiClick();
 triggerHaptic('medium');
 const initReason = (initErr && initErr.description) || (initErr && initErr.message) || JSON.stringify(initErr);
 showPixelToast(`Ошибка инициализации Adsgram: ${initReason}`, 'error', 'flag');
 renderStarsShopModal();
 return;
 }
 }

 try {
 AdController.show()
 .then((result) => {
 adShowInProgress = false;
 if (result && result.done === false) {
 SoundManager.uiClick();
 triggerHaptic('medium');
 const reason = result.description || 'Реклама не досмотрена, награда не начислена';
 showPixelToast(reason, 'error', 'flag');
 renderStarsShopModal();
 return;
 }
 setAdRewardCooldown(item.id);
 item.grant();
 saveGame(true);
 SoundManager.purchase();
 SoundManager.discover();
 triggerHaptic('success');
 renderStarsShopModal();
 })
 .catch((result) => {
 adShowInProgress = false;
 SoundManager.uiClick();
 triggerHaptic('medium');
 let reason = 'неизвестная ошибка Adsgram';
 if (result && typeof result === 'object') {
 reason = result.description || result.message || JSON.stringify(result);
 } else if (result !== undefined && result !== null) {
 reason = String(result);
 }
 showPixelToast(`Реклама не показана: ${reason}`, 'error', 'flag');
 renderStarsShopModal();
 });
 } catch (err) {
 adShowInProgress = false;
 SoundManager.uiClick();
 triggerHaptic('medium');
 const syncReason = (err && err.description) || (err && err.message) || JSON.stringify(err);
 showPixelToast(`Ошибка запуска рекламы: ${syncReason}`, 'error', 'flag');
 renderStarsShopModal();
 }
}

function watchRewardedAdForItem(item) {
 if (!item || adShowInProgress) return;

 const remMs = getAdRewardRemainingMs(item.id);
 if (remMs > 0) {
 SoundManager.uiClick();
 triggerHaptic('light');
 showPixelToast(`Подожди ${formatRealDuration(remMs)} до следующей награды!`, 'error', 'flag');
 return;
 }

 adShowInProgress = true;
 renderStarsShopModal();

 if (window.Adsgram && typeof window.Adsgram.init === 'function') {
 startAdsgramShow(item);
 } else {
 ensureAdsgramSdkLoaded()
 .then(() => {
 startAdsgramShow(item);
 })
 .catch((loadErr) => {
 adShowInProgress = false;
 SoundManager.uiClick();
 triggerHaptic('medium');
 const reason = (loadErr && loadErr.message) || String(loadErr);
 showPixelToast(reason, 'error', 'flag');
 renderStarsShopModal();
 });
 }
}

function renderStarsShopModal() {
 const turboCounter = document.getElementById('starsTurboCount');
 if (turboCounter) turboCounter.textContent = (state.turboBoosts || 0).toString();
 starsShopBody.innerHTML = '';

 const infoBanner = document.createElement('div');
 infoBanner.className = 'ads-info-banner';
 infoBanner.textContent = 'Посмотри короткий рекламный ролик до конца, чтобы получить награду. Перезарядка каждой карточки — 3 минуты.';
 starsShopBody.appendChild(infoBanner);

 AD_REWARD_CATALOG.forEach((item) => {
 const remMs = getAdRewardRemainingMs(item.id);
 const isCooldown = remMs > 0;

 const card = document.createElement('div');
 card.className = 'shop-card' + (!isCooldown ? ' unlocked-card' : '');

 const av = document.createElement('div');
 av.className = 'card-avatar';
 const c = document.createElement('canvas');
 c.width = 56;
 c.height = 56;
 renderIconToCanvas(c, item.iconKey);
 av.appendChild(c);

 const info = document.createElement('div');
 info.className = 'card-info';
 info.innerHTML = `
 <div class="card-name"><span>${item.title}</span></div>
 <div class="card-desc">${item.desc}</div>
 <div class="stat-chips">
 <span class="stat-chip highlight">${item.rewardLabel}</span>
 <span class="stat-chip">${item.getStatus()}</span>
 </div>
 `;

 const watchBtn = document.createElement('button');
 watchBtn.type = 'button';
 watchBtn.className = isCooldown ? 'sell-btn' : 'buy-btn';
 watchBtn.disabled = isCooldown || adShowInProgress;
 if (adShowInProgress) {
 watchBtn.textContent = 'Загрузка...';
 } else if (isCooldown) {
 watchBtn.textContent = `⏳ ${formatRealDuration(remMs)}`;
 } else {
 watchBtn.textContent = 'Смотреть 🎬';
 }
 watchBtn.onclick = (e) => {
 if (e) e.stopPropagation();
 SoundManager.uiClick();
 triggerHaptic('light');
 watchRewardedAdForItem(item);
 };

 card.appendChild(av);
 card.appendChild(info);
 card.appendChild(watchBtn);
 starsShopBody.appendChild(card);
 });
}
