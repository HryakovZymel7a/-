/**
 * ПЛЕМЕННОЙ ДВОР (СКРЕЩИВАНИЕ В РЕАЛЬНОМ ВРЕМЕНИ) И РЫНОК ХРЯКОВ
 */
const breedModal = document.getElementById('breedModal');
const breedBody = document.getElementById('breedBody');
let breedOpenedAt = 0;
let breedTimerInterval = null;
let selectedParent1Uid = null;
let selectedParent2Uid = null;

function drawBoarToMiniCanvas(canvasEl, speciesId, size = 48, gender = 'male') {
  if (!canvasEl) return;
  const c = canvasEl.getContext('2d');
  c.clearRect(0, 0, canvasEl.width, canvasEl.height);
  const sprite = boarSprites[speciesId];
  if (sprite && sprite.complete && sprite.naturalWidth > 0) {
    const aspect = sprite.naturalWidth / sprite.naturalHeight;
    let dw = size, dh = size;
    if (aspect > 1) dh = size / aspect;
    else dw = size * aspect;
    const ox = (canvasEl.width - dw) / 2;
    const oy = (canvasEl.height - dh) / 2;
    c.drawImage(sprite, ox, oy, dw, dh);
    if (gender === 'female') {
      drawGirlBow(c, canvasEl.width / 2 + dw * 0.04, oy + dh * 0.06, 0.56);
    }
  }
}

function openBreedModal() {
  breedOpenedAt = performance.now();
  renderIconToCanvas(document.getElementById('breedHeaderIcon'), 'feed_all');
  const males = state.boars.filter((b) => b.gender === 'male');
  const females = state.boars.filter((b) => b.gender === 'female');
  if (males.length > 0 && (!selectedParent1Uid || !males.some((b) => b.uid === selectedParent1Uid))) {
    selectedParent1Uid = males[0].uid;
  }
  if (females.length > 0 && (!selectedParent2Uid || !females.some((b) => b.uid === selectedParent2Uid))) {
    selectedParent2Uid = females[0].uid;
  }
  renderBreedModal();
  breedModal.classList.add('active');
  if (breedTimerInterval) clearInterval(breedTimerInterval);
  breedTimerInterval = setInterval(() => {
    if (breedModal.classList.contains('active') && state.breeding && state.breeding.active) {
      renderBreedModal();
    }
  }, 1000);
}

function closeBreedModal() {
  breedModal.classList.remove('active');
  if (breedTimerInterval) {
    clearInterval(breedTimerInterval);
    breedTimerInterval = null;
  }
}

document.getElementById('closeBreedBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  SoundManager.uiClick();
  closeBreedModal();
});

breedModal.addEventListener('pointerdown', (e) => {
  if (e.target === breedModal && performance.now() - breedOpenedAt > 200) {
    closeBreedModal();
  }
});

function renderBreedModal() {
  document.getElementById('breedHerdCount').textContent = `Стадо: ${state.boars.length}/${getMaxHerdCapacity()}`;
  breedBody.innerHTML = '';

  // Если идёт активное скрещивание
  if (state.breeding && state.breeding.active) {
    const br = state.breeding;
    const remMs = Math.max(0, br.startTimeMs + br.durationMs - Date.now());
    const pct = Math.min(100, Math.round((1 - remMs / br.durationMs) * 100));
    const resCfg = BOAR_CATALOG.find((b) => b.id === br.resultSpeciesId) || BOAR_CATALOG[0];

    const pairBox = document.createElement('div');
    pairBox.className = 'breed-pair-box';
    pairBox.innerHTML = `
      <div class="parent-slot">
        <div class="card-name" style="justify-content:center">${br.parent1Name}</div>
        <div class="card-desc" style="margin:0">${br.parent1Breed}</div>
      </div>
      <div class="breed-heart-mid">❤️</div>
      <div class="parent-slot">
        <div class="card-name" style="justify-content:center">${br.parent2Name}</div>
        <div class="card-desc" style="margin:0">${br.parent2Breed}</div>
      </div>
    `;
    breedBody.appendChild(pairBox);

    const statusCard = document.createElement('div');
    statusCard.className = 'forecast-panel';
    statusCard.innerHTML = `
      <div>Ожидаемый приплод: <b>${resCfg.breed}</b> (Поколение ${br.resultGen})</div>
      <div>Длительность породы: <b>${Math.round(br.durationMs / 60000)} мин</b> реального времени</div>
      <div class="upgrade-bar" style="height:12px;margin-top:8px"><div class="upgrade-bar-fill" style="width:${pct}%"></div></div>
    `;
    breedBody.appendChild(statusCard);

    const timerDiv = document.createElement('div');
    timerDiv.className = 'timer-banner';
    timerDiv.textContent = remMs > 0 ? `Осталось: ${formatRealDuration(remMs)}` : '🎉 Поросёнок готов!';
    breedBody.appendChild(timerDiv);

    if (remMs <= 0) {
      const claimBtn = document.createElement('button');
      claimBtn.type = 'button';
      claimBtn.className = 'buy-btn';
      claimBtn.style.width = '100%';
      claimBtn.style.justifyContent = 'center';
      claimBtn.style.padding = '12px';
      claimBtn.style.fontSize = '15px';
      claimBtn.textContent = 'ЗАБРАТЬ ПОРОСЁНКА В ЗАГОН';
      claimBtn.onclick = () => {
        if (state.boars.length >= getMaxHerdCapacity()) {
          spawnFloatingText(BREEDING_CONFIG.rect.x + 160, BREEDING_CONFIG.rect.y + 80, 'Освободите место в загоне на Рынке!', '#ff6b6b');
          closeBreedModal();
          openMarketModal();
          return;
        }
        const babyGender = br.resultGender || (Math.random() < 0.5 ? 'female' : 'male');
        const baby = createBoarInstance(br.resultSpeciesId, {
          gender: babyGender,
          generation: br.resultGen,
          isBred: true,
          parents: `${br.parent1Name} × ${br.parent2Name}`
        });
        if (!state.unlockedBoars.includes(baby.speciesId)) {
          state.unlockedBoars.push(baby.speciesId);
        }
        state.boars.push(baby);
        state.breeding = null;
        syncActiveBoars();
        saveGame(true);
        SoundManager.discover();
        SoundManager.oink(babyGender === 'female' ? 1.3 : 1.1);
        triggerHaptic('success');
        closeBreedModal();
        focusCameraOn(WORLD.penRect.x + WORLD.penRect.w / 2, WORLD.penRect.y + WORLD.penRect.h / 2);
        const bornText = babyGender === 'female'
          ? `Родилась девочка: ♀ ${baby.nickname} (${baby.breed})!`
          : `Родился мальчик: ♂ ${baby.nickname} (${baby.breed})!`;
        spawnFloatingText(WORLD.penRect.x + WORLD.penRect.w / 2, WORLD.penRect.y + 90, bornText, babyGender === 'female' ? '#ff9ff3' : '#ffe047');
      };
      breedBody.appendChild(claimBtn);
    }
    return;
  }

  const males = state.boars.filter((b) => b.gender === 'male');
  const females = state.boars.filter((b) => b.gender === 'female');

  if (males.length === 0 || females.length === 0) {
    const missingText = females.length === 0
      ? 'В загоне нет ни одной <b>♀ девочки (свинки)</b>!'
      : 'В загоне нет ни одного <b>♂ мальчика (хряка)</b>!';
    const infoBox = document.createElement('div');
    infoBox.className = 'forecast-panel';
    infoBox.innerHTML = `
      <div style="font-size:14px;margin-bottom:4px">Для скрещивания нужна пара: <b>♂ Мальчик + ♀ Девочка</b>!</div>
      <div>${missingText} Купите пару в Лавке во вкладке «Хряки».</div>
    `;
    breedBody.appendChild(infoBox);

    const goShopBtn = document.createElement('button');
    goShopBtn.type = 'button';
    goShopBtn.className = 'buy-btn';
    goShopBtn.style.width = '100%';
    goShopBtn.style.justifyContent = 'center';
    goShopBtn.textContent = 'Открыть Лавку (Купить пару)';
    goShopBtn.onclick = () => {
      window._shopBuyGender = females.length === 0 ? 'female' : 'male';
      closeBreedModal();
      openShop('boars');
    };
    breedBody.appendChild(goShopBtn);
    return;
  }

  const p1 = males.find((b) => b.uid === selectedParent1Uid) || males[0];
  const p2 = females.find((b) => b.uid === selectedParent2Uid) || females[0];
  selectedParent1Uid = p1.uid;
  selectedParent2Uid = p2.uid;

  const pairBox = document.createElement('div');
  pairBox.className = 'breed-pair-box';

  const slot1 = document.createElement('div');
  slot1.className = 'parent-slot';
  const c1 = document.createElement('canvas');
  c1.width = 52;
  c1.height = 52;
  slot1.appendChild(c1);
  slot1.innerHTML += `<div class="card-name" style="justify-content:center;font-size:13px"><span class="gender-tag-male">♂</span> ${p1.nickname}</div><div class="card-desc" style="margin:0;font-size:10.5px">${p1.breed} (Пок.${p1.generation})</div>`;
  drawBoarToMiniCanvas(slot1.querySelector('canvas'), p1.speciesId, 48, 'male');
  slot1.onclick = () => {
    const idx = males.findIndex((b) => b.uid === selectedParent1Uid);
    selectedParent1Uid = males[(idx + 1) % males.length].uid;
    SoundManager.uiClick();
    renderBreedModal();
  };

  const mid = document.createElement('div');
  mid.className = 'breed-heart-mid';
  mid.textContent = '❤️';

  const slot2 = document.createElement('div');
  slot2.className = 'parent-slot';
  const c2 = document.createElement('canvas');
  c2.width = 52;
  c2.height = 52;
  slot2.appendChild(c2);
  slot2.innerHTML += `<div class="card-name" style="justify-content:center;font-size:13px"><span class="gender-tag-female">♀</span> ${p2.nickname}</div><div class="card-desc" style="margin:0;font-size:10.5px">${p2.breed} (Пок.${p2.generation})</div>`;
  drawBoarToMiniCanvas(slot2.querySelector('canvas'), p2.speciesId, 48, 'female');
  slot2.onclick = () => {
    const idx = females.findIndex((b) => b.uid === selectedParent2Uid);
    selectedParent2Uid = females[(idx + 1) % females.length].uid;
    SoundManager.uiClick();
    renderBreedModal();
  };

  pairBox.appendChild(slot1);
  pairBox.appendChild(mid);
  pairBox.appendChild(slot2);
  breedBody.appendChild(pairBox);

  const info = getBreedingPairInfo(p1, p2);
  const outcomesHtml = info.outcomes.map((o) => `<b>${o.breed}</b> (${o.chance}%)`).join(' • ');
  const timeText = info.maxMinutes >= 60
    ? `${Math.floor(info.maxMinutes / 60)} ч ${info.maxMinutes % 60 > 0 ? (info.maxMinutes % 60) + ' мин' : ''}`
    : `${info.maxMinutes} мин`;

  const forecast = document.createElement('div');
  forecast.className = 'forecast-panel';
  forecast.innerHTML = `
    <div>Нажмите на карточку родителя сверху, чтобы сменить пару.</div>
    <div style="margin-top:4px">Потомство (Пок. ${info.nextGen}): ${outcomesHtml}</div>
    <div>Реальное время разведения: <b>${timeText}</b></div>
    <div>Затраты: <b>${info.coinCost} 💰</b> и <b>${info.foodCost} корма</b></div>
  `;
  breedBody.appendChild(forecast);

  const herdFull = state.boars.length >= getMaxHerdCapacity();
  const canStart = !herdFull && state.coins >= info.coinCost && state.food >= info.foodCost;
  const startBtn = document.createElement('button');
  startBtn.type = 'button';
  startBtn.className = 'buy-btn';
  startBtn.style.width = '100%';
  startBtn.style.justifyContent = 'center';
  startBtn.style.padding = '11px';
  startBtn.style.fontSize = '14px';

  if (herdFull) {
    startBtn.textContent = 'Загон полон (продай хряка на Рынке)';
    startBtn.disabled = true;
  } else {
    startBtn.textContent = `Скрестить (${info.coinCost}💰 + ${info.foodCost} корма)`;
    startBtn.disabled = !canStart;
    startBtn.onclick = () => {
      if (state.coins >= info.coinCost && state.food >= info.foodCost && !state.breeding) {
        state.coins -= info.coinCost;
        state.food -= info.foodCost;

        // Выбор породы по шансам
        const roll = Math.random() * 100;
        let acc = 0;
        let chosenSpecies = info.outcomes[0].speciesId;
        for (const o of info.outcomes) {
          acc += o.chance;
          if (roll <= acc) {
            chosenSpecies = o.speciesId;
            break;
          }
        }

        state.breeding = {
          active: true,
          parent1Uid: p1.uid,
          parent2Uid: p2.uid,
          parent1Name: p1.nickname,
          parent1Breed: p1.breed,
          parent2Name: p2.nickname,
          parent2Breed: p2.breed,
          resultSpeciesId: chosenSpecies,
          resultGen: info.nextGen,
          startTimeMs: Date.now(),
          durationMs: info.durationMs
        };

        saveGame(true);
        SoundManager.purchase();
        SoundManager.oink(1.0);
        triggerHaptic('success');
        renderBreedModal();
      }
    };
  }
  breedBody.appendChild(startBtn);
}

/**
 * СВИНОВОДЧЕСКИЙ РЫНОК (ПРОДАЖА ХРЯКОВ)
 */
const marketModal = document.getElementById('marketModal');
const marketBody = document.getElementById('marketBody');
let marketOpenedAt = 0;

function openMarketModal() {
  marketOpenedAt = performance.now();
  renderIconToCanvas(document.getElementById('marketHeaderIcon'), 'coin');
  renderIconToCanvas(document.getElementById('marketBalanceCoin'), 'coin');
  renderMarketModal();
  marketModal.classList.add('active');
}

function closeMarketModal() {
  marketModal.classList.remove('active');
}

document.getElementById('closeMarketBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  SoundManager.uiClick();
  closeMarketModal();
});

marketModal.addEventListener('pointerdown', (e) => {
  if (e.target === marketModal && performance.now() - marketOpenedAt > 200) {
    closeMarketModal();
  }
});

function renderMarketModal() {
  document.getElementById('marketCoinText').textContent = Math.floor(state.coins).toString();
  marketBody.innerHTML = '';

  const hotCfg = BOAR_CATALOG[state.marketDayIndex % BOAR_CATALOG.length];
  const banner = document.createElement('div');
  banner.className = 'hot-demand-banner';
  banner.innerHTML = `
    <span>🔥 Спрос дня (+25%): <b>${hotCfg.breed}</b></span>
    <span>Стадо: ${state.boars.length}/${getMaxHerdCapacity()}</span>
  `;
  marketBody.appendChild(banner);

  state.boars.forEach((inst) => {
    const cfg = BOAR_CATALOG.find((b) => b.id === inst.speciesId) || BOAR_CATALOG[0];
    const sellPrice = getBoarMarketSellPrice(inst);
    const isHot = inst.speciesId === hotCfg.id;
    const isBusyBreeding = Boolean(
      state.breeding && state.breeding.active &&
      (state.breeding.parent1Uid === inst.uid || state.breeding.parent2Uid === inst.uid)
    );
    const isLastBoar = state.boars.length <= 1;

    const card = document.createElement('div');
    card.className = 'shop-card' + (isHot ? ' unlocked-card' : '');

    const avatar = document.createElement('div');
    avatar.className = 'card-avatar';
    const miniCanvas = document.createElement('canvas');
    miniCanvas.width = 64;
    miniCanvas.height = 64;
    drawBoarToMiniCanvas(miniCanvas, inst.speciesId, 52, inst.gender || 'male');
    avatar.appendChild(miniCanvas);

    const isGirl = inst.gender === 'female';
    const originText = inst.isBred
      ? (isGirl ? `Выведена (${inst.parents || 'племдвор'})` : `Выведен (${inst.parents || 'племдвор'})`)
      : (isGirl ? 'Племенная из лавки' : 'Племенной из лавки');
    const sexBadge = isGirl
      ? '<span class="gender-tag-female">♀</span>'
      : '<span class="gender-tag-male">♂</span>';

    const info = document.createElement('div');
    info.className = 'card-info';
    info.innerHTML = `
      <div class="card-name">${sexBadge}<span>${inst.nickname}</span><span class="breed-badge">${inst.breed}</span></div>
      <div class="card-desc">${originText} • Поколение ${inst.generation || 1}</div>
      <div class="stat-chips">
        <span class="stat-chip">Клик: +${cfg.income}</span>
        ${isHot ? '<span class="stat-chip highlight">Спрос +25%</span>' : ''}
      </div>
    `;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sell-btn';

    if (isLastBoar) {
      btn.textContent = 'Последний';
      btn.disabled = true;
    } else if (isBusyBreeding) {
      btn.textContent = 'На случке';
      btn.disabled = true;
    } else {
      btn.appendChild(createCoinBadgeEl(`+${sellPrice}`));
      btn.onclick = () => {
        if (state.boars.length <= 1) return;
        state.boars = state.boars.filter((b) => b.uid !== inst.uid);
        state.coins += sellPrice;
        syncActiveBoars();
        saveGame(true);
        SoundManager.coin();
        SoundManager.oink(0.95);
        triggerHaptic('success');
        spawnFloatingText(MARKET_CONFIG.rect.x + MARKET_CONFIG.rect.w / 2, MARKET_CONFIG.rect.y + 80, `Продан ${inst.nickname}: +${sellPrice}💰`, '#ffe047');
        renderMarketModal();
      };
    }

    card.appendChild(avatar);
    card.appendChild(info);
    card.appendChild(btn);
    marketBody.appendChild(card);
  });
}


/**
 * ЛЕСОПИЛКА: РАСПИЛОВКА БРЁВЕН, ПРОДАЖА И УЛУЧШЕНИЯ
 */
const sawmillModal = document.getElementById('sawmillModal');
const sawmillBody = document.getElementById('sawmillBody');
let sawmillOpenedAt = 0;
let sawmillTimerInterval = null;

function openSawmillModal() {
  sawmillOpenedAt = performance.now();
  renderIconToCanvas(document.getElementById('sawmillHeaderIcon'), 'sawmill');
  renderIconToCanvas(document.getElementById('sawmillBalanceLog'), 'log');
  renderSawmillModal();
  sawmillModal.classList.add('active');
  if (sawmillTimerInterval) clearInterval(sawmillTimerInterval);
  sawmillTimerInterval = setInterval(() => {
    if (sawmillModal.classList.contains('active') || voyageModal.classList.contains('active')) {
      renderSawmillModal();
    }
  }, 600);
}

function closeSawmillModal() {
  sawmillModal.classList.remove('active');
  if (sawmillTimerInterval) {
    clearInterval(sawmillTimerInterval);
    sawmillTimerInterval = null;
  }
}

document.getElementById('closeSawmillBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  SoundManager.uiClick();
  closeSawmillModal();
});

sawmillModal.addEventListener('pointerdown', (e) => {
  if (e.target === sawmillModal && performance.now() - sawmillOpenedAt > 200) {
    closeSawmillModal();
  }
});

function renderSawmillModal() {
  document.getElementById('sawmillLogText').textContent = `${state.logs} бр.`;
  sawmillBody.innerHTML = '';

  const plankPrice = getSawmillPlankValue();
  const procTime = getSawmillProcessTime().toFixed(1).replace('.0', '');
  const queuePct = Math.min(100, Math.round((state.sawmillProgress || 0) * 100));

  // Карточка работы пилорамы
  const workCard = document.createElement('div');
  workCard.className = 'forecast-panel';
  workCard.innerHTML = `
    <div style="font-size:14px;margin-bottom:4px">🪵 <b>Распил брёвен на пиломатериалы</b></div>
    <div>Цена 1 распиленного бревна: <b>${plankPrice} 💰</b> (время: ${procTime} сек)</div>
    <div>В очереди пилы: <b>${state.sawmillQueueLogs} бр.</b> • Готово монет: <b>${Math.floor(state.sawmillStoredCoins)} 💰</b></div>
    <div class="upgrade-bar" style="height:11px;margin-top:7px"><div class="upgrade-bar-fill" style="width:${queuePct}%"></div></div>
  `;
  sawmillBody.appendChild(workCard);

  // Кнопки загрузки брёвен на распил
  const actionRow = document.createElement('div');
  actionRow.style.display = 'flex';
  actionRow.style.gap = '8px';

  const saw1Btn = document.createElement('button');
  saw1Btn.type = 'button';
  saw1Btn.className = 'buy-btn';
  saw1Btn.style.flex = '1';
  saw1Btn.style.justifyContent = 'center';
  saw1Btn.textContent = `Пилить 1 🪵 (+${plankPrice}💰)`;
  saw1Btn.disabled = state.logs < 1;
  saw1Btn.onclick = () => {
    if (state.logs >= 1) {
      state.logs -= 1;
      state.sawmillQueueLogs += 1;
      SoundManager.saw();
      triggerHaptic('light');
      saveGame();
      renderSawmillModal();
    }
  };

  const batchCount = Math.min(5, Math.max(1, state.logs));
  const sawAllBtn = document.createElement('button');
  sawAllBtn.type = 'button';
  sawAllBtn.className = 'buy-btn';
  sawAllBtn.style.flex = '1';
  sawAllBtn.style.justifyContent = 'center';
  sawAllBtn.textContent = state.logs > 1 ? `Пилить ${batchCount} 🪵` : 'Нет брёвен';
  sawAllBtn.disabled = state.logs < 2;
  sawAllBtn.onclick = () => {
    const n = Math.min(5, state.logs);
    if (n >= 1) {
      state.logs -= n;
      state.sawmillQueueLogs += n;
      SoundManager.saw();
      triggerHaptic('medium');
      saveGame();
      renderSawmillModal();
    }
  };

  actionRow.appendChild(saw1Btn);
  actionRow.appendChild(sawAllBtn);
  sawmillBody.appendChild(actionRow);

  // Кнопка сбора готовой выручки или быстрой продажи сырых брёвен
  if (state.sawmillStoredCoins >= 1) {
    const collectBtn = document.createElement('button');
    collectBtn.type = 'button';
    collectBtn.className = 'sell-btn';
    collectBtn.style.width = '100%';
    collectBtn.style.justifyContent = 'center';
    collectBtn.style.padding = '11px';
    collectBtn.style.fontSize = '14px';
    collectBtn.textContent = `ЗАБРАТЬ ВЫРУЧКУ: +${Math.floor(state.sawmillStoredCoins)} 💰`;
    collectBtn.onclick = () => {
      const c = Math.floor(state.sawmillStoredCoins);
      if (c >= 1) {
        state.coins += c;
        state.sawmillStoredCoins -= c;
        SoundManager.coin();
        triggerHaptic('success');
        saveGame(true);
        renderSawmillModal();
      }
    };
    sawmillBody.appendChild(collectBtn);
  }

  // Улучшение самой Лесопилки
  const maxSmLvl = SAWMILL_CONFIG.maxLevel;
  const smPrice = getSawmillUpgradePrice();
  const smLogs = getSawmillUpgradeLogCost();
  const smPct = Math.round((state.sawmillLevel / maxSmLvl) * 100);

  const smCard = document.createElement('div');
  smCard.className = 'shop-card';
  const smAv = document.createElement('div');
  smAv.className = 'card-avatar';
  const smC = document.createElement('canvas');
  smC.width = 56;
  smC.height = 56;
  renderIconToCanvas(smC, 'sawmill');
  smAv.appendChild(smC);

  const smInfo = document.createElement('div');
  smInfo.className = 'card-info';
  smInfo.innerHTML = `
    <div class="card-name">Пилорама (Ур. ${state.sawmillLevel}/${maxSmLvl})</div>
    <div class="card-desc">Дороже доски (+28%), быстрее пила и авто-заготовка леса.</div>
    <div class="upgrade-bar"><div class="upgrade-bar-fill" style="width:${smPct}%"></div></div>
  `;

  const smBtn = document.createElement('button');
  smBtn.type = 'button';
  smBtn.className = 'buy-btn' + (state.sawmillLevel >= maxSmLvl ? ' owned' : '');
  if (state.sawmillLevel >= maxSmLvl) {
    smBtn.textContent = 'Максимум';
    smBtn.disabled = true;
  } else {
    smBtn.textContent = `${smPrice}💰 + ${smLogs}🪵`;
    smBtn.disabled = state.coins < smPrice || state.logs < smLogs;
    smBtn.onclick = () => {
      if (state.coins >= smPrice && state.logs >= smLogs && state.sawmillLevel < maxSmLvl) {
        state.coins -= smPrice;
        state.logs -= smLogs;
        state.sawmillLevel += 1;
        saveGame(true);
        SoundManager.purchase();
        triggerHaptic('success');
        renderSawmillModal();
      }
    };
  }
  smCard.appendChild(smAv);
  smCard.appendChild(smInfo);
  smCard.appendChild(smBtn);
  sawmillBody.appendChild(smCard);

  // Улучшение Топора лесоруба
  const maxAxeLvl = 5;
  const axePrice = getAxeUpgradePrice();
  const axeLogs = getAxeUpgradeLogCost();
  const axePct = Math.round((state.axeLevel / maxAxeLvl) * 100);

  const axeCard = document.createElement('div');
  axeCard.className = 'shop-card';
  const axeAv = document.createElement('div');
  axeAv.className = 'card-avatar';
  const axeC = document.createElement('canvas');
  axeC.width = 56;
  axeC.height = 56;
  renderIconToCanvas(axeC, 'log');
  axeAv.appendChild(axeC);

  const axeInfo = document.createElement('div');
  axeInfo.className = 'card-info';
  axeInfo.innerHTML = `
    <div class="card-name">Кованый топор (Ур. ${state.axeLevel}/${maxAxeLvl})</div>
    <div class="card-desc">Даёт +${state.axeLevel} доп. брёвен с каждого срубленного ствола на карте!</div>
    <div class="upgrade-bar"><div class="upgrade-bar-fill" style="width:${axePct}%"></div></div>
  `;

  const axeBtn = document.createElement('button');
  axeBtn.type = 'button';
  axeBtn.className = 'buy-btn' + (state.axeLevel >= maxAxeLvl ? ' owned' : '');
  if (state.axeLevel >= maxAxeLvl) {
    axeBtn.textContent = 'Максимум';
    axeBtn.disabled = true;
  } else {
    axeBtn.textContent = `${axePrice}💰 + ${axeLogs}🪵`;
    axeBtn.disabled = state.coins < axePrice || state.logs < axeLogs;
    axeBtn.onclick = () => {
      if (state.coins >= axePrice && state.logs >= axeLogs && state.axeLevel < maxAxeLvl) {
        state.coins -= axePrice;
        state.logs -= axeLogs;
        state.axeLevel += 1;
        saveGame(true);
        SoundManager.purchase();
        triggerHaptic('success');
        renderSawmillModal();
      }
    };
  }
  axeCard.appendChild(axeAv);
  axeCard.appendChild(axeInfo);
  axeCard.appendChild(axeBtn);
  sawmillBody.appendChild(axeCard);

  // Строительство дубовых кормушек за брёвна (бонус к доходу всех хряков!)
  const maxFeedLvl = 5;
  const fPrice = getFeederUpgradePrice();
  const fLogs = getFeederUpgradeLogCost();
  const fPct = Math.round(((state.feederLevel || 0) / maxFeedLvl) * 100);

  const fCard = document.createElement('div');
  fCard.className = 'shop-card';
  const fAv = document.createElement('div');
  fAv.className = 'card-avatar';
  const fC = document.createElement('canvas');
  fC.width = 56;
  fC.height = 56;
  renderIconToCanvas(fC, 'feed_all');
  fAv.appendChild(fC);

  const fInfo = document.createElement('div');
  fInfo.className = 'card-info';
  fInfo.innerHTML = `
    <div class="card-name">Дубовые кормушки (Ур. ${state.feederLevel || 0}/${maxFeedLvl})</div>
    <div class="card-desc">Бонус к монетам от всех хряков: <b>+${(state.feederLevel || 0) * 10}%</b></div>
    <div class="upgrade-bar"><div class="upgrade-bar-fill" style="width:${fPct}%"></div></div>
  `;

  const fBtn = document.createElement('button');
  fBtn.type = 'button';
  fBtn.className = 'buy-btn' + ((state.feederLevel || 0) >= maxFeedLvl ? ' owned' : '');
  if ((state.feederLevel || 0) >= maxFeedLvl) {
    fBtn.textContent = 'Максимум';
    fBtn.disabled = true;
  } else {
    fBtn.textContent = `${fPrice}💰 + ${fLogs}🪵`;
    fBtn.disabled = state.coins < fPrice || state.logs < fLogs;
    fBtn.onclick = () => {
      if (state.coins >= fPrice && state.logs >= fLogs && (state.feederLevel || 0) < maxFeedLvl) {
        state.coins -= fPrice;
        state.logs -= fLogs;
        state.feederLevel = (state.feederLevel || 0) + 1;
        saveGame(true);
        SoundManager.purchase();
        triggerHaptic('success');
        renderSawmillModal();
      }
    };
  }
  fCard.appendChild(fAv);
  fCard.appendChild(fInfo);
  fCard.appendChild(fBtn);
  sawmillBody.appendChild(fCard);
}


/**
 * МОРСКОЙ ПОХОД НА ОСТРОВА И В ДАЛЬНЕЕ МОРЕ («ВЫ УВЕРЕНЫ?», 15 МИН СБОРЫ, 30 МИН ПЛАВАНИЕ)
 */
const voyageModal = document.getElementById('voyageModal');
const voyageBody = document.getElementById('voyageBody');
const voyageModalTitle = document.getElementById('voyageModalTitle');
let voyageOpenedAt = 0;
let voyageTimerInterval = null;

function openVoyageModal() {
  voyageOpenedAt = performance.now();
  renderIconToCanvas(document.getElementById('voyageHeaderIcon'), 'ship');
  renderIconToCanvas(document.getElementById('voyageBalanceCoin'), 'coin');
  renderVoyageModal();
  voyageModal.classList.add('active');
  if (voyageTimerInterval) clearInterval(voyageTimerInterval);
  voyageTimerInterval = setInterval(() => {
    if (voyageModal.classList.contains('active')) {
      renderVoyageModal();
    }
  }, 1000);
}

function closeVoyageModal() {
  voyageModal.classList.remove('active');
  pendingVoyageTarget = null;
  if (voyageTimerInterval) {
    clearInterval(voyageTimerInterval);
    voyageTimerInterval = null;
  }
}

document.getElementById('closeVoyageBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  SoundManager.uiClick();
  closeVoyageModal();
});

voyageModal.addEventListener('pointerdown', (e) => {
  if (e.target === voyageModal && performance.now() - voyageOpenedAt > 200) {
    closeVoyageModal();
  }
});

function renderVoyageModal() {
  document.getElementById('voyageCoinText').textContent = Math.floor(state.coins).toString();
  voyageBody.innerHTML = '';

  // Сценарий 1: Идут 15-минутные сборы перед отплытием (игрок ЕЩЁ МОЖЕТ ПЕРЕДУМАТЬ!)
  if (caravan.status === 'voyage_prep' && state.voyage && state.voyage.active) {
    voyageModalTitle.textContent = 'ВЫ УВЕРЕНЫ? (СБОРЫ)';
    const remMs = Math.max(0, state.voyage.prepStartTimeMs + state.voyage.prepDurationMs - Date.now());
    const pct = Math.min(100, Math.round((1 - remMs / state.voyage.prepDurationMs) * 100));

    const infoCard = document.createElement('div');
    infoCard.className = 'forecast-panel';
    infoCard.innerHTML = `
      <div style="font-size:14.5px;margin-bottom:6px">⛵ <b>Пункт назначения: ${state.voyage.destName}</b></div>
      <div>Хряки грузят припасы на корабль в порту. До отплытия осталось время, поэтому <b>вы ещё можете передумать и отменить поход!</b></div>
      <div style="margin-top:6px;color:#b71c1c">⚠️ Как только корабль отплывёт (на 30 минут), во время пути хряков нельзя будет использовать в другой поход!</div>
      <div class="upgrade-bar" style="height:12px;margin-top:8px"><div class="upgrade-bar-fill" style="width:${pct}%"></div></div>
    `;
    voyageBody.appendChild(infoCard);

    const timerDiv = document.createElement('div');
    timerDiv.className = 'timer-banner';
    timerDiv.textContent = `Отплытие через: ${formatRealDuration(remMs)}`;
    voyageBody.appendChild(timerDiv);

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'sell-btn';
    cancelBtn.style.width = '100%';
    cancelBtn.style.justifyContent = 'center';
    cancelBtn.style.padding = '12px';
    cancelBtn.style.fontSize = '14px';
    cancelBtn.style.background = 'linear-gradient(180deg, #ff7b7b 0%, #e03131 100%)';
    cancelBtn.style.color = '#ffffff';
    cancelBtn.textContent = `🛑 ПЕРЕДУМАЛ — ОТМЕНИТЬ ПОХОД (+${state.voyage.cost || SEA_VOYAGE_COST} 💰)`;
    cancelBtn.onclick = () => {
      const refund = state.voyage.cost || SEA_VOYAGE_COST;
      state.coins += refund;
      state.voyage = null;
      caravan.status = 'idle';
      caravan.targetX = null;
      caravan.targetY = null;
      saveGame(true);
      SoundManager.uiClick();
      triggerHaptic('medium');
      spawnFloatingText(caravan.x, caravan.y - 30, `Поход отменён! +${refund}💰`, '#a3e635');
      closeVoyageModal();
    };
    voyageBody.appendChild(cancelBtn);

    const keepBtn = document.createElement('button');
    keepBtn.type = 'button';
    keepBtn.className = 'buy-btn';
    keepBtn.style.width = '100%';
    keepBtn.style.justifyContent = 'center';
    keepBtn.style.padding = '11px';
    keepBtn.textContent = 'Продолжать подготовку к отплытию';
    keepBtn.onclick = () => {
      SoundManager.uiClick();
      closeVoyageModal();
    };
    voyageBody.appendChild(keepBtn);
    return;
  }

  // Сценарий 2: Корабль УЖЕ в 30-минутном плавании по морю (отменить и перенаправить нельзя!)
  if (caravan.status === 'voyage_sailing' && state.voyage && state.voyage.active) {
    voyageModalTitle.textContent = 'КОРАБЛЬ В МОРЕ';
    const remMs = Math.max(0, state.voyage.sailStartTimeMs + state.voyage.sailDurationMs - Date.now());
    const pct = Math.min(100, Math.round((1 - remMs / state.voyage.sailDurationMs) * 100));

    const sailCard = document.createElement('div');
    sailCard.className = 'forecast-panel';
    sailCard.innerHTML = `
      <div style="font-size:14.5px;margin-bottom:6px">⛵ <b>Курс: ${state.voyage.destName}</b></div>
      <div>Хряки плывут на корабле по открытому морю!</div>
      <div style="margin-top:6px;color:#b71c1c">🔒 <b>Во время пути их нельзя использовать в другой поход</b> — дождитесь прибытия корабля к берегу!</div>
      <div class="upgrade-bar" style="height:12px;margin-top:8px"><div class="upgrade-bar-fill" style="width:${pct}%"></div></div>
    `;
    voyageBody.appendChild(sailCard);

    const timerDiv = document.createElement('div');
    timerDiv.className = 'timer-banner';
    timerDiv.textContent = `До прибытия: ${formatRealDuration(remMs)} (${pct}%)`;
    voyageBody.appendChild(timerDiv);

    const showShipBtn = document.createElement('button');
    showShipBtn.type = 'button';
    showShipBtn.className = 'buy-btn';
    showShipBtn.style.width = '100%';
    showShipBtn.style.justifyContent = 'center';
    showShipBtn.style.padding = '11px';
    showShipBtn.textContent = 'Показать корабль на карте';
    showShipBtn.onclick = () => {
      closeVoyageModal();
      focusCameraOn(caravan.x, caravan.y, 0.55);
    };
    voyageBody.appendChild(showShipBtn);
    return;
  }

  // Сценарий 3A: Обычный сухопутный поход (лес, луг, холмы, ориентир долины) — КОРАБЛЬ НЕ НУЖЕН!
  if (pendingVoyageTarget && !pendingVoyageTarget.isDistantSea) {
    const target = pendingVoyageTarget;
    voyageModalTitle.textContent = 'ОТПРАВИТЬ ХРЯКОВ?';
    renderIconToCanvas(document.getElementById('voyageHeaderIcon'), 'flag');
    const cost = target.cost || EXPEDITION_COST;
    const canAfford = state.coins >= cost;

    const landBox = document.createElement('div');
    landBox.className = 'forecast-panel';
    landBox.innerHTML = `
      <div style="font-size:15px;margin-bottom:6px">🧭 <b>Подтвердите отправку обоза хряков</b></div>
      <div style="margin-bottom:4px">📍 Куда: <b>${target.destName}</b></div>
      <div style="margin-bottom:6px">📏 Расстояние: <b>~${target.distMeters || 45} м</b> • В пути: <b>~${target.estSeconds || 6} сек</b></div>
      <div class="stat-chips" style="margin-bottom:6px">
        <span class="stat-chip highlight">💰 Стоимость: <b>${cost} монет</b></span>
        <span class="stat-chip">🎁 Добыча: монеты, корм и 🪵 брёвна</span>
      </div>
      <div style="font-size:11.5px;color:#5c3818">Если вы нажали на карту случайно — просто нажмите «Отмена».</div>
    `;
    voyageBody.appendChild(landBox);

    const btnRow = document.createElement('div');
    btnRow.style.display = 'flex';
    btnRow.style.flexDirection = 'column';
    btnRow.style.gap = '8px';

    const goBtn = document.createElement('button');
    goBtn.type = 'button';
    goBtn.className = 'buy-btn';
    goBtn.style.width = '100%';
    goBtn.style.justifyContent = 'center';
    goBtn.style.padding = '12px';
    goBtn.style.fontSize = '14.5px';
    goBtn.textContent = canAfford
      ? `✅ Да, отправить хряков! (${cost} 💰)`
      : `Не хватает монет (нужно ${cost} 💰)`;
    goBtn.disabled = !canAfford;
    goBtn.onclick = () => {
      const chosen = pendingVoyageTarget;
      closeVoyageModal();
      if (chosen) executeLandExpedition(chosen);
    };

    const cancelLandBtn = document.createElement('button');
    cancelLandBtn.type = 'button';
    cancelLandBtn.className = 'sell-btn';
    cancelLandBtn.style.width = '100%';
    cancelLandBtn.style.justifyContent = 'center';
    cancelLandBtn.style.padding = '11px';
    cancelLandBtn.style.fontSize = '13.5px';
    cancelLandBtn.style.background = 'linear-gradient(180deg, #ff8787 0%, #e03131 100%)';
    cancelLandBtn.style.color = '#ffffff';
    cancelLandBtn.textContent = '❌ Отмена (случайно нажал)';
    cancelLandBtn.onclick = () => {
      SoundManager.uiClick();
      closeVoyageModal();
    };

    btnRow.appendChild(goBtn);
    btnRow.appendChild(cancelLandBtn);
    voyageBody.appendChild(btnRow);
    return;
  }

  // Сценарий 0A: Корабль сейчас строится на верфи (идут 2 часа реального времени)
  if (!state.shipBuilt && state.shipBuild && state.shipBuild.active) {
    voyageModalTitle.textContent = 'ВЕРФЬ: ПОСТРОЙКА КОРАБЛЯ';
    const remMs = Math.max(0, state.shipBuild.startTimeMs + state.shipBuild.durationMs - Date.now());
    const pct = Math.min(100, Math.round((1 - remMs / state.shipBuild.durationMs) * 100));

    const buildCard = document.createElement('div');
    buildCard.className = 'forecast-panel';
    buildCard.innerHTML = `
      <div style="font-size:15px;margin-bottom:6px">🔨 <b>Хряки-плотники строят парусный корабль!</b></div>
      <div>На постройку ушло <b>${SHIP_BUILD_LOGS} брёвен</b> и <b>${SHIP_BUILD_COINS} монет</b>. Полное время строительства — <b>2 часа реального времени</b>.</div>
      <div style="margin-top:6px">После спуска корабля на воду откроются морские походы на все 4 острова!</div>
      <div class="upgrade-bar" style="height:13px;margin-top:9px"><div class="upgrade-bar-fill" style="width:${pct}%"></div></div>
    `;
    voyageBody.appendChild(buildCard);

    const timerDiv = document.createElement('div');
    timerDiv.className = 'timer-banner';
    timerDiv.textContent = remMs > 0 ? `До спуска на воду: ${formatRealDuration(remMs)}` : '🎉 КОРАБЛЬ ПОСТРОЕН!';
    voyageBody.appendChild(timerDiv);

    if (remMs <= 0) {
      const claimShipBtn = document.createElement('button');
      claimShipBtn.type = 'button';
      claimShipBtn.className = 'buy-btn';
      claimShipBtn.style.width = '100%';
      claimShipBtn.style.justifyContent = 'center';
      claimShipBtn.style.padding = '13px';
      claimShipBtn.style.fontSize = '15px';
      claimShipBtn.textContent = '⛵ СПУСТИТЬ КОРАБЛЬ НА ВОДУ!';
      claimShipBtn.onclick = () => {
        state.shipBuilt = true;
        state.shipBuild = null;
        saveGame(true);
        SoundManager.discover();
        triggerHaptic('success');
        const hWx = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
        const hWy = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;
        spawnParticles(hWx, hWy - 16, 'ship', 6);
        spawnParticles(hWx, hWy - 24, 'sparkle', 8);
        spawnFloatingText(hWx, hWy - 42, '⛵ КОРАБЛЬ ГОТОВ К ПЛАВАНИЮ!', '#74ff52');
        renderVoyageModal();
      };
      voyageBody.appendChild(claimShipBtn);
    } else {
      const okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.className = 'buy-btn';
      okBtn.style.width = '100%';
      okBtn.style.justifyContent = 'center';
      okBtn.style.padding = '11px';
      okBtn.textContent = 'Понятно, жду окончания стройки';
      okBtn.onclick = () => {
        SoundManager.uiClick();
        closeVoyageModal();
      };
      voyageBody.appendChild(okBtn);
    }
    return;
  }

  // Сценарий 0B: Корабль ещё НЕ построен (показывается только при попытке поплыть в море/на остров или при клике на Верфь!)
  if (!state.shipBuilt) {
    voyageModalTitle.textContent = 'СОЗДАНИЕ КОРАБЛЯ';
    const hasLogs = state.logs >= SHIP_BUILD_LOGS;
    const hasCoins = state.coins >= SHIP_BUILD_COINS;
    const canBuild = hasLogs && hasCoins;

    const needCard = document.createElement('div');
    needCard.className = 'forecast-panel';
    needCard.innerHTML = `
      <div style="font-size:15px;margin-bottom:6px">⛵ <b>Чтобы плыть в море и на острова, сначала постройте корабль!</b></div>
      <div style="margin-bottom:6px">Для строительства на верфи требуются материалы и время:</div>
      <div class="stat-chips" style="margin-bottom:8px">
        <span class="stat-chip" style="background:${hasLogs ? '#c8ff6b' : '#ffcdd2'}">🪵 Брёвна: <b>${state.logs} / ${SHIP_BUILD_LOGS}</b></span>
        <span class="stat-chip highlight" style="background:${hasCoins ? '#fff08a' : '#ffcdd2'}">💰 Монеты: <b>${Math.floor(state.coins)} / ${SHIP_BUILD_COINS}</b></span>
      </div>
      <div>⏳ <b>Время создания корабля: 2 часа</b> реального времени.</div>
    `;
    voyageBody.appendChild(needCard);

    const buildBtn = document.createElement('button');
    buildBtn.type = 'button';
    buildBtn.className = 'buy-btn';
    buildBtn.style.width = '100%';
    buildBtn.style.justifyContent = 'center';
    buildBtn.style.padding = '13px';
    buildBtn.style.fontSize = '14.5px';
    buildBtn.textContent = canBuild
      ? `🔨 Построить корабль (${SHIP_BUILD_LOGS}🪵 + ${SHIP_BUILD_COINS}💰 • 2 ч)`
      : `Не хватает ресурсов (${SHIP_BUILD_LOGS}🪵 и ${SHIP_BUILD_COINS}💰)`;
    buildBtn.disabled = !canBuild;
    buildBtn.onclick = () => {
      if (state.logs < SHIP_BUILD_LOGS || state.coins < SHIP_BUILD_COINS || state.shipBuilt || state.shipBuild) return;
      state.logs -= SHIP_BUILD_LOGS;
      state.coins -= SHIP_BUILD_COINS;
      state.shipBuild = {
        active: true,
        startTimeMs: Date.now(),
        durationMs: SHIP_BUILD_DURATION_MS
      };
      saveGame(true);
      SoundManager.purchase();
      SoundManager.chop();
      triggerHaptic('success');
      const hWx = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
      const hWy = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;
      spawnParticles(hWx, hWy - 14, 'woodchip', 8);
      spawnFloatingText(hWx, hWy - 36, '🔨 СТРОЙКА КОРАБЛЯ НАЧАЛАСЬ (2 Ч)!', '#ffe047');
      renderVoyageModal();
    };
    voyageBody.appendChild(buildBtn);

    const closeBtn2 = document.createElement('button');
    closeBtn2.type = 'button';
    closeBtn2.className = 'sell-btn';
    closeBtn2.style.width = '100%';
    closeBtn2.style.justifyContent = 'center';
    closeBtn2.style.padding = '11px';
    closeBtn2.textContent = 'Вернуться на ферму';
    closeBtn2.onclick = () => {
      SoundManager.uiClick();
      closeVoyageModal();
    };
    voyageBody.appendChild(closeBtn2);
    return;
  }

  // Сценарий 3B: Дальний морской поход (море или острова, когда корабль уже построен!)
  const target = pendingVoyageTarget || classifyDestination(SEA_ISLANDS[0].tx * TILE_SIZE, SEA_ISLANDS[0].ty * TILE_SIZE);
  voyageModalTitle.textContent = 'ВЫ УВЕРЕНЫ?';
  const cost = target.cost || SEA_VOYAGE_COST;
  const canAfford = state.coins >= cost;

  const confirmBox = document.createElement('div');
  confirmBox.className = 'forecast-panel';
  confirmBox.innerHTML = `
    <div style="font-size:15px;margin-bottom:6px">❓ <b>Вы уверены, что хотите отправить хряков в дальний морской поход?</b></div>
    <div style="margin-bottom:4px">📍 Цель: <b>${target.destName}</b></div>
    <div>⏳ <b>Отправление через: 15 минут</b> реального времени <i>(пока идут сборы, вы сможете передумать и отменить поход!)</i>.</div>
    <div style="margin-top:4px">⛵ <b>Время в пути по морю: ~30 минут</b> реального времени.</div>
    <div style="margin-top:6px;color:#b71c1c">⚠️ <b>Важно:</b> когда корабль отплывёт, во время пути хряков нельзя будет использовать в другой поход!</div>
    <div style="margin-top:6px">💰 Снаряжение корабля: <b>${cost} монет</b></div>
  `;
  voyageBody.appendChild(confirmBox);

  const btnRow = document.createElement('div');
  btnRow.style.display = 'flex';
  btnRow.style.flexDirection = 'column';
  btnRow.style.gap = '8px';

  const confirmBtn = document.createElement('button');
  confirmBtn.type = 'button';
  confirmBtn.className = 'buy-btn';
  confirmBtn.style.width = '100%';
  confirmBtn.style.justifyContent = 'center';
  confirmBtn.style.padding = '12px';
  confirmBtn.style.fontSize = '14px';
  confirmBtn.textContent = canAfford
    ? `✅ Да, я уверен! Начать сборы (15 мин • ${cost}💰)`
    : `Не хватает монет (нужно ${cost}💰)`;
  confirmBtn.disabled = !canAfford;
  confirmBtn.onclick = () => {
    if (state.coins < cost) return;
    state.coins -= cost;

    const harborWx = HARBOR_TILE.tx * TILE_SIZE + TILE_SIZE / 2;
    const harborWy = HARBOR_TILE.ty * TILE_SIZE + TILE_SIZE / 2;

    state.voyage = {
      active: true,
      phase: 'prep',
      destName: target.destName,
      isIsland: Boolean(target.isIsland),
      startX: harborWx,
      startY: harborWy,
      targetX: target.targetX,
      targetY: target.targetY,
      cost,
      prepStartTimeMs: Date.now(),
      prepDurationMs: VOYAGE_PREP_DURATION_MS,
      sailStartTimeMs: 0,
      sailDurationMs: VOYAGE_SAIL_DURATION_MS
    };

    caravan.x = harborWx;
    caravan.y = harborWy;
    caravan.targetX = target.targetX;
    caravan.targetY = target.targetY;
    caravan.status = 'voyage_prep';
    caravan.waypoints = [];
    revealFogAroundWorld(harborWx, harborWy, 6);

    saveGame(true);
    SoundManager.marchStart();
    triggerHaptic('success');
    spawnFloatingText(harborWx, harborWy - 30, '⏳ СБОРЫ В ПОРТУ: 15 МИН!', '#ffe047');
    renderVoyageModal();
  };

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'sell-btn';
  cancelBtn.style.width = '100%';
  cancelBtn.style.justifyContent = 'center';
  cancelBtn.style.padding = '11px';
  cancelBtn.style.fontSize = '13.5px';
  cancelBtn.textContent = '❌ Нет, я передумал';
  cancelBtn.onclick = () => {
    pendingVoyageTarget = null;
    SoundManager.uiClick();
    closeVoyageModal();
  };

  btnRow.appendChild(confirmBtn);
  btnRow.appendChild(cancelBtn);
  voyageBody.appendChild(btnRow);
}

</script>
</body>
</html>
