/**
 * БЫСТРЫЙ ОФФСКРИН-КЭШ КАРТЫ И ОБЛАЧНОГО ПОКРОВА (768x768)
 */
const OVERVIEW_SCALE = 4; // 160 * 4 = 640x640 HD-кэш для чёткости при отдалении
const overviewCanvas = document.createElement('canvas');
overviewCanvas.width = MAP_COLS * OVERVIEW_SCALE;
overviewCanvas.height = MAP_ROWS * OVERVIEW_SCALE;
const octx = overviewCanvas.getContext('2d');
octx.imageSmoothingEnabled = false;

const fogCanvas = document.createElement('canvas');
fogCanvas.width = MAP_COLS * OVERVIEW_SCALE;
fogCanvas.height = MAP_ROWS * OVERVIEW_SCALE;
const fctx = fogCanvas.getContext('2d');
fctx.imageSmoothingEnabled = false;
const fogImageData = fctx.createImageData(fogCanvas.width, fogCanvas.height);
const fogPixels32 = new Uint32Array(fogImageData.data.buffer);
const cloudBasePixels32 = new Uint32Array(fogCanvas.width * fogCanvas.height);
let fogLayerDirty = true;

const TILE_PALETTE = [
  '#0277BD', // 0: насыщенный морской океан
  '#039BE5', // 1: лазурная береговая отмель
  '#ffe07d', // 2: тёплый золотой песок
  '#7ee024', // 3: сочный мультяшный луг
  '#64c91c', // 4: насыщенная изумрудная трава
  '#b8f035', // 5: солнечная поляна
  '#459624', // 6: густой кедровый бор
  '#66bf32', // 7: весенняя берёзовая роща
  '#b8925c', // 8: тёплые терракотовые холмы
  '#7a728a', // 9: скалистые вершины
  '#1ec8ff', // 10: хрустальная река и озёра
  '#eba452'  // 11: золотистая просёлочная тропа
];

function drawTileDecoration(c, tx, ty, ts, now = 0) {
  const idx = ty * MAP_COLS + tx;
  const prop = TILE_PROPS[idx];
  if (prop === 0) return;
  const x = tx * ts;
  const y = ty * ts;
  const cx = x + ts * 0.5;
  const cy = y + ts * 0.55;

  // Упрощённая быстрая отрисовка для микро-кэша (ts <= 6)
  if (ts <= 6) {
    if (prop === 1) {
      c.fillStyle = '#264a22';
      c.fillRect(x, y, ts, ts);
    } else if (prop === 3 || prop === 4) {
      c.fillStyle = prop === 4 ? '#f1f5f9' : '#655a4e';
      c.fillRect(x, y, ts, ts);
    } else if (prop === 6) {
      c.fillStyle = '#b86b28';
      c.fillRect(x, y, ts, ts);
    }
    return;
  }

  const hVal = hash2D(tx, ty);
  const shiftX = (hVal - 0.5) * ts * 0.16;
  const shiftY = (hash2D(ty, tx) - 0.5) * ts * 0.12;
  const px = cx + shiftX;
  const py = cy + shiftY;
  const sway = now > 0 ? Math.sin(now / 650 + tx * 0.7 + ty * 0.5) * (ts * 0.035) : 0;

  c.lineJoin = 'round';
  c.lineCap = 'round';
  c.strokeStyle = '#1a1a1a';
  c.lineWidth = Math.max(1.4, ts * 0.042);

  if (prop === 1) {
    // Пышный сибирский кедр в 3 яруса с тенью и бликами
    c.fillStyle = 'rgba(16, 32, 12, 0.28)';
    c.beginPath();
    c.ellipse(px, py + ts * 0.28, ts * 0.28, ts * 0.11, 0, 0, Math.PI * 2);
    c.fill();

    // Ствол
    c.fillStyle = '#6f3e18';
    c.fillRect(px - ts * 0.055, py + ts * 0.08, ts * 0.11, ts * 0.2);
    c.strokeRect(px - ts * 0.055, py + ts * 0.08, ts * 0.11, ts * 0.2);

    // 3 яруса хвои
    const tiers = [
      { w: 0.34, yBot: 0.14, yTop: -0.14, col: '#244721', hi: '#386632' },
      { w: 0.27, yBot: 0.0,  yTop: -0.28, col: '#2d5a27', hi: '#467d3e' },
      { w: 0.19, yBot: -0.14, yTop: -0.42, col: '#3b7034', hi: '#5a994f' }
    ];
    for (let t = 0; t < tiers.length; t++) {
      const tr = tiers[t];
      const topX = px + sway * (t + 1) * 0.45;
      const topY = py + ts * tr.yTop;
      const botY = py + ts * tr.yBot;
      const hw = ts * tr.w;

      c.fillStyle = tr.col;
      c.beginPath();
      c.moveTo(topX, topY);
      c.lineTo(px + hw, botY);
      c.lineTo(px - hw, botY);
      c.closePath();
      c.fill();

      // Солнечный склон слева
      c.fillStyle = tr.hi;
      c.beginPath();
      c.moveTo(topX, topY);
      c.lineTo(px, botY);
      c.lineTo(px - hw, botY);
      c.closePath();
      c.fill();

      c.beginPath();
      c.moveTo(topX, topY);
      c.lineTo(px + hw, botY);
      c.lineTo(px - hw, botY);
      c.closePath();
      c.stroke();
    }
  } else if (prop === 2) {
    // Белоствольная берёза с чёрными засечками и пышной кроной
    c.fillStyle = 'rgba(16, 32, 12, 0.25)';
    c.beginPath();
    c.ellipse(px, py + ts * 0.27, ts * 0.25, ts * 0.1, 0, 0, Math.PI * 2);
    c.fill();

    // Белый ствол
    c.fillStyle = '#f8f9fa';
    c.fillRect(px - ts * 0.045, py - ts * 0.02, ts * 0.09, ts * 0.29);
    c.strokeRect(px - ts * 0.045, py - ts * 0.02, ts * 0.09, ts * 0.29);

    // Чёрные пятнышки коры
    c.fillStyle = '#1a1a1a';
    c.fillRect(px - ts * 0.03, py + ts * 0.08, ts * 0.04, ts * 0.025);
    c.fillRect(px + ts * 0.005, py + ts * 0.16, ts * 0.035, ts * 0.025);

    // Многослойная листва
    const cxLeaf = px + sway;
    const cyLeaf = py - ts * 0.14;
    c.fillStyle = '#4c9527';
    c.beginPath();
    c.arc(cxLeaf - ts * 0.12, cyLeaf + ts * 0.05, ts * 0.17, 0, Math.PI * 2);
    c.arc(cxLeaf + ts * 0.12, cyLeaf + ts * 0.05, ts * 0.17, 0, Math.PI * 2);
    c.arc(cxLeaf, cyLeaf - ts * 0.08, ts * 0.21, 0, Math.PI * 2);
    c.fill();
    c.stroke();

    c.fillStyle = '#80ed51';
    c.beginPath();
    c.arc(cxLeaf - ts * 0.06, cyLeaf - ts * 0.11, ts * 0.11, 0, Math.PI * 2);
    c.fill();
  } else if (prop === 3 || prop === 4) {
    // Объёмная двугранная скала Алтая со снежной шапкой
    const topY = y + ts * 0.08;
    const botY = y + ts * 0.86;
    const lX = x + ts * 0.08;
    const rX = x + ts * 0.92;
    const midX = cx + shiftX * 0.5;

    // Тень под горой
    c.fillStyle = 'rgba(20, 20, 20, 0.26)';
    c.beginPath();
    c.ellipse(cx, botY, ts * 0.42, ts * 0.1, 0, 0, Math.PI * 2);
    c.fill();

    // Освещённая левая грань
    c.fillStyle = '#9b8d7e';
    c.beginPath();
    c.moveTo(lX, botY);
    c.lineTo(midX, topY);
    c.lineTo(midX + ts * 0.04, botY);
    c.closePath();
    c.fill();

    // Теневая правая грань
    c.fillStyle = '#6c5f53';
    c.beginPath();
    c.moveTo(midX, topY);
    c.lineTo(rX, botY);
    c.lineTo(midX + ts * 0.04, botY);
    c.closePath();
    c.fill();

    if (prop === 4) {
      // Искрящаяся снежная вершина
      const snowY = topY + (botY - topY) * 0.36;
      c.fillStyle = '#ffffff';
      c.beginPath();
      c.moveTo(midX, topY);
      c.lineTo(midX + (rX - midX) * 0.36, snowY);
      c.lineTo(midX + ts * 0.04, snowY - ts * 0.04);
      c.lineTo(midX - (midX - lX) * 0.36, snowY);
      c.closePath();
      c.fill();
      c.stroke();
    }

    // Общий контур и хребет
    c.beginPath();
    c.moveTo(lX, botY);
    c.lineTo(midX, topY);
    c.lineTo(rX, botY);
    c.closePath();
    c.stroke();

    c.beginPath();
    c.moveTo(midX, topY);
    c.lineTo(midX + ts * 0.04, botY);
    c.stroke();
  } else if (prop === 5 && ts >= 16) {
    // Пучок луговой травы и цветы
    c.strokeStyle = '#3b7a1e';
    c.lineWidth = 2.2;
    c.beginPath();
    c.moveTo(px - 6, py + 4);
    c.lineTo(px - 10 + sway * 0.4, py - 6);
    c.moveTo(px - 3, py + 4);
    c.lineTo(px - 2 + sway * 0.4, py - 8);
    c.moveTo(px, py + 4);
    c.lineTo(px + 5 + sway * 0.4, py - 5);
    c.stroke();

    // Цветочек с лепестками
    const flCol = hVal > 0.65 ? '#ff7eb3' : hVal > 0.35 ? '#ffffff' : '#ffe047';
    c.fillStyle = flCol;
    c.beginPath();
    c.arc(px + 6, py - 3, 4.2, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#ff9f1a';
    c.beginPath();
    c.arc(px + 6, py - 3, 1.8, 0, Math.PI * 2);
    c.fill();
  } else if (prop === 6) {
    // Бревенчатый мост с перилами
    c.fillStyle = 'rgba(0, 0, 0, 0.25)';
    c.fillRect(x + ts * 0.06, y + ts * 0.2, ts * 0.88, ts * 0.66);

    const planks = 5;
    const pw = (ts * 0.84) / planks;
    for (let i = 0; i < planks; i++) {
      c.fillStyle = i % 2 === 0 ? '#d4873f' : '#bd722c';
      roundRect(c, x + ts * 0.08 + i * pw, y + ts * 0.16, pw - 1, ts * 0.68, 3);
      c.fill();
      c.stroke();
    }
    // Перила моста
    c.fillStyle = '#8c4f1d';
    c.fillRect(x + ts * 0.06, y + ts * 0.14, ts * 0.88, ts * 0.08);
    c.strokeRect(x + ts * 0.06, y + ts * 0.14, ts * 0.88, ts * 0.08);
    c.fillRect(x + ts * 0.06, y + ts * 0.78, ts * 0.88, ts * 0.08);
    c.strokeRect(x + ts * 0.06, y + ts * 0.78, ts * 0.88, ts * 0.08);
  }
}

function hexToAbgr32(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255;
  const g = (n >> 8) & 255;
  const b = n & 255;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

function bakeOverviewTerrain() {
  const w = overviewCanvas.width;
  const h = overviewCanvas.height;
  octx.imageSmoothingEnabled = false;

  // 1. Насыщенный морской градиент (#0277BD — #01579B) на весь океан
  const seaGrad = octx.createLinearGradient(0, 0, w, h);
  seaGrad.addColorStop(0, '#0277BD');
  seaGrad.addColorStop(0.55, '#0268A6');
  seaGrad.addColorStop(1, '#01579B');
  octx.fillStyle = seaGrad;
  octx.fillRect(0, 0, w, h);

  // Лёгкая текстура морских волн на фоне океана
  octx.strokeStyle = 'rgba(129, 212, 250, 0.22)';
  octx.lineWidth = 1.6;
  for (let wy = 10; wy < h; wy += 18) {
    for (let wx = (wy % 36 === 0 ? 8 : 22); wx < w - 16; wx += 38) {
      octx.beginPath();
      octx.moveTo(wx, wy);
      octx.quadraticCurveTo(wx + 7, wy - 2.5, wx + 14, wy);
      octx.stroke();
    }
  }

  // 2. Рисуем тайлы суши, отмелей, пляжей и рек со сглаженными берегами
  for (let ty = 0; ty < MAP_ROWS; ty++) {
    const rowOff = ty * MAP_COLS;
    const pyBase = ty * OVERVIEW_SCALE;
    for (let tx = 0; tx < MAP_COLS; tx++) {
      const tType = TILE_GRID[rowOff + tx];
      if (tType === 0) continue; // океан уже отрисован морским градиентом с волнами
      const pxBase = tx * OVERVIEW_SCALE;
      octx.fillStyle = TILE_PALETTE[tType];
      octx.fillRect(pxBase, pyBase, OVERVIEW_SCALE, OVERVIEW_SCALE);
    }
  }

  // 3. Декорации для крупных объектов (горы, деревья, мосты)
  for (let ty = 0; ty < MAP_ROWS; ty++) {
    for (let tx = 0; tx < MAP_COLS; tx++) {
      const p = TILE_PROPS[ty * MAP_COLS + tx];
      if (p === 1 || p === 3 || p === 4 || p === 6) {
        drawTileDecoration(octx, tx, ty, OVERVIEW_SCALE);
      }
    }
  }

  // 4. Вместо белого фона с облаками вокруг острова — морская дымка (#0277BD — #01579B) только над неоткрытой сушей, а вокруг острова — чистое море с волнами!
  const tempCloud = document.createElement('canvas');
  tempCloud.width = w;
  tempCloud.height = h;
  const tctx = tempCloud.getContext('2d');
  tctx.clearRect(0, 0, w, h);

  const fogGrad = tctx.createLinearGradient(0, 0, w, h);
  fogGrad.addColorStop(0, 'rgba(2, 119, 189, 0.78)');
  fogGrad.addColorStop(1, 'rgba(1, 87, 155, 0.84)');

  for (let ty = 0; ty < MAP_ROWS; ty++) {
    const rowOff = ty * MAP_COLS;
    const pyBase = ty * OVERVIEW_SCALE;
    for (let tx = 0; tx < MAP_COLS; tx++) {
      const tType = TILE_GRID[rowOff + tx];
      if (tType <= 1) continue; // Вокруг острова и в море нет белых облаков — виден морской градиент с волнами!
      tctx.fillStyle = fogGrad;
      tctx.fillRect(tx * OVERVIEW_SCALE, pyBase, OVERVIEW_SCALE, OVERVIEW_SCALE);
    }
  }

  // Лёгкие волнистые линии на морской дымке
  tctx.strokeStyle = 'rgba(179, 229, 252, 0.25)';
  tctx.lineWidth = 1.5;
  for (let i = 0; i < 140; i++) {
    const cx = hash2D(i, 41) * w;
    const cy = hash2D(73, i) * h;
    const tx = Math.floor(cx / OVERVIEW_SCALE);
    const ty = Math.floor(cy / OVERVIEW_SCALE);
    if (tx >= 0 && tx < MAP_COLS && ty >= 0 && ty < MAP_ROWS && TILE_GRID[ty * MAP_COLS + tx] > 1) {
      tctx.beginPath();
      tctx.moveTo(cx - 8, cy);
      tctx.quadraticCurveTo(cx, cy - 3, cx + 8, cy);
      tctx.stroke();
    }
  }

  const cData = tctx.getImageData(0, 0, w, h);
  cloudBasePixels32.set(new Uint32Array(cData.data.buffer));
}

function rebuildFogCanvas() {
  const w = fogCanvas.width;
  fogPixels32.set(cloudBasePixels32);

  for (let ty = 0; ty < MAP_ROWS; ty++) {
    const rowOff = ty * MAP_COLS;
    const pyBase = ty * OVERVIEW_SCALE;
    for (let tx = 0; tx < MAP_COLS; tx++) {
      if (FOG_GRID[rowOff + tx] === 1) {
        const pxBase = tx * OVERVIEW_SCALE;
        for (let oy = 0; oy < OVERVIEW_SCALE; oy++) {
          const dstRow = (pyBase + oy) * w + pxBase;
          for (let ox = 0; ox < OVERVIEW_SCALE; ox++) {
            fogPixels32[dstRow + ox] = 0;
          }
        }
      }
    }
  }
  fctx.putImageData(fogImageData, 0, 0);
  fogLayerDirty = false;
}

/**
 * ЭФФЕКТЫ И ЧАСТИЦЫ
 */
let floatingTexts = [];
let particles = [];
let dustPuffs = [];
let barnBounce = 0;
let sawmillBounce = 0;
let marketBounce = 0;
let breedBounce = 0;
let shopBtnBounce = 0;
let pillBounce = { coin: 0, food: 0, log: 0 };
let plotBounces = {};
let cameraShakeTime = 0;
let cameraShakeMag = 0;
let pressedHudKey = null;
let seedBounce = { carrot: 0, pumpkin: 0, acorn: 0 };

// Плывущие полупрозрачные облака над усадьбой
const driftingClouds = Array.from({ length: 10 }, (_, idx) => ({
  x: WORLD.penRect.x - 900 + idx * 320,
  y: WORLD.penRect.y - 600 + (idx % 4) * 440,
  rx: 95 + (idx % 3) * 35,
  ry: 48 + (idx % 2) * 18,
  speed: 14 + (idx % 4) * 5
}));

function triggerCameraShake(mag = 4, dur = 0.16) {
  cameraShakeMag = Math.max(cameraShakeMag, mag);
  cameraShakeTime = Math.max(cameraShakeTime, dur);
}

function spawnDustPuff(wx, wy, count = 2, color = 'rgba(235, 215, 175, 0.55)') {
  if (dustPuffs.length > 36) dustPuffs.splice(0, count);
  for (let i = 0; i < count; i++) {
    dustPuffs.push({
      x: wx + (Math.random() - 0.5) * 18,
      y: wy + (Math.random() - 0.5) * 8,
      vx: (Math.random() - 0.5) * 26,
      vy: -10 - Math.random() * 18,
      r: 6 + Math.random() * 6,
      life: 1.0,
      color
    });
  }
}

function spawnFloatingText(wx, wy, text, color = '#ffdd59') {
  if (floatingTexts.length > 24) floatingTexts.shift();
  floatingTexts.push({ x: wx, y: wy, text, color, life: 1.0, maxLife: 1.0, vy: -68 });
  if (text.includes('💰') || text.includes('+')) pillBounce.coin = 1.0;
  if (text.includes('корма') || text.includes('🥕')) pillBounce.food = 1.0;
  if (text.includes('🪵') || text.includes('брев')) pillBounce.log = 1.0;
}

function spawnParticles(wx, wy, iconKey, count = 5) {
  if (particles.length > 56) particles.splice(0, count);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.55;
    const speed = 68 + Math.random() * 92;
    particles.push({
      x: wx,
      y: wy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 56,
      rot: (Math.random() - 0.5) * 1.2,
      vRot: (Math.random() - 0.5) * 6,
      iconKey,
      life: 1.0,
      scale: 0.8 + Math.random() * 0.48
    });
  }
}

function canAffordAnything() {
  if (!state.shipBuilt && !state.shipBuild && state.logs >= SHIP_BUILD_LOGS && state.coins >= SHIP_BUILD_COINS) return true;
  if (state.boars.length < getMaxHerdCapacity()) {
    const cheapestBoar = BOAR_CATALOG.find((b) => state.coins >= b.price);
    if (cheapestBoar) return true;
  }
  if (state.barnLevel < BARN_CONFIG.maxLevel && state.coins >= getBarnPrice()) return true;
  const nextField = FIELD_CONFIGS.find((f) => !state.unlockedFields.includes(f.id));
  if (nextField && state.coins >= nextField.price) return true;
  if (state.plotCount < getMaxPlotsAllowed() && state.coins >= getPlotPrice()) return true;
  if (state.growthSpeedLevel < 10 && state.coins >= getSpeedPrice()) return true;
  if (state.scoutSpeedLevel < 8 && state.coins >= getScoutSpeedPrice()) return true;
  if (state.scoutVisionLevel < 8 && state.coins >= getScoutVisionPrice()) return true;
  return false;
}

function getBarnPrice() {
  return Math.round(BARN_CONFIG.basePrice * Math.pow(BARN_CONFIG.priceMult, state.barnLevel));
}
function getPlotPrice() {
  return Math.round(180 * Math.pow(1.42, state.plotCount - 3));
}
function getSpeedPrice() {
  return Math.round(160 * Math.pow(1.95, state.growthSpeedLevel - 1));
}
function getScoutSpeedPrice() {
  return Math.round(270 * Math.pow(1.85, state.scoutSpeedLevel - 1));
}
function getScoutVisionPrice() {
  return Math.round(330 * Math.pow(1.9, state.scoutVisionLevel - 1));
}

/**
 * УТИЛИТЫ РИСОВАНИЯ
 */
function roundRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function drawGroundShadow(ctx, x, y, rx, ry) {
  const sg = ctx.createRadialGradient(x, y, rx * 0.1, x, y, rx);
  sg.addColorStop(0, 'rgba(15, 32, 10, 0.36)');
  sg.addColorStop(0.65, 'rgba(15, 32, 10, 0.18)');
  sg.addColorStop(1, 'rgba(15, 32, 10, 0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.ellipse(x, y, rx * 1.12, ry * 1.12, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawCartoonButton(ctx, x, y, w, h, r = 14, topColor = '#FFC107', bottomColor = '#FFA000', pressed = false) {
  const radius = 14;
  const depth = 4; // Нижняя ступенька 4px (box-shadow: 0 4px 0 #2b1d0e)
  const offset = pressed ? 3 : 0;

  ctx.save();
  // Нижняя ступенька Brawl Stars (#2b1d0e)
  ctx.fillStyle = '#2b1d0e';
  roundRect(ctx, x, y + depth, w, h, radius);
  ctx.fill();

  // Основной корпус кнопки
  const grad = ctx.createLinearGradient(0, y + offset, 0, y + offset + h);
  grad.addColorStop(0, topColor);
  grad.addColorStop(1, bottomColor);
  ctx.fillStyle = grad;
  ctx.strokeStyle = '#2b1d0e';
  ctx.lineWidth = 2;
  roundRect(ctx, x, y + offset, w, h, radius);
  ctx.fill();
  ctx.stroke();

  // Верхний глянцевый блик
  ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
  roundRect(ctx, x + 3, y + offset + 2, Math.max(4, w - 6), h * 0.36, Math.max(6, radius - 3));
  ctx.fill();
  ctx.restore();
}

function drawOutlinedText(text, x, y, fontSize, fill = '#ffffff', align = 'center', strokeW = 3.0) {
  ctx.save();
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';

  const isSmallText = fontSize <= 12.6;
  if (isSmallText) {
    // Мелкие подписи: узкий Sofia Sans Condensed (700) БЕЗ толстой чёрной обводки, с объёмной тенью 0 2px 0 rgba(0,0,0,0.75)
    ctx.font = `700 ${Math.round(fontSize * 1.08)}px 'Sofia Sans Condensed', 'Rubik', sans-serif`;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 2;
    ctx.shadowBlur = 0;
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  } else {
    // Крупный текст, цифры ресурсов и заголовки кнопок: Rubik (800/900)
    ctx.font = `900 ${fontSize}px 'Rubik', sans-serif`;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillText(text, x, y + 2);
    if (strokeW > 0) {
      ctx.strokeStyle = '#2b1d0e';
      ctx.lineWidth = Math.min(2.6, strokeW * 0.65);
      ctx.strokeText(text, x, y);
    }
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }
  ctx.restore();
}

function isRectVisible(rx, ry, rw, rh, margin = 150) {
  const viewW = W / camera.zoom;
  const viewH = H / camera.zoom;
  return (
    rx + rw + margin >= camera.x &&
    rx - margin <= camera.x + viewW &&
    ry + rh + margin >= camera.y &&
    ry - margin <= camera.y + viewH
  );
}

/**
 * ОТРИСОВКА ТОЛЬКО ВИДИМОЙ ЧАСТИ КАРТЫ (БЕЗ ПЕРЕГРУЗКИ МОБИЛЬНОГО GPU)
 */
function drawVisibleLayerCropped(sourceCanvas) {
  const viewW = W / camera.zoom;
  const viewH = H / camera.zoom;
  const visX = Math.max(0, camera.x);
  const visY = Math.max(0, camera.y);
  const visRight = Math.min(WORLD.w, camera.x + viewW);
  const visBottom = Math.min(WORLD.h, camera.y + viewH);
  const visW = visRight - visX;
  const visH = visBottom - visY;
  if (visW <= 0 || visH <= 0) return;

  const ratio = sourceCanvas.width / WORLD.w;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(
    sourceCanvas,
    visX * ratio,
    visY * ratio,
    visW * ratio,
    visH * ratio,
    visX,
    visY,
    visW,
    visH
  );
}

  ctx.fillRect(wx + 14, wy - 36, 6, 32);
  ctx.strokeRect(wx + 14, wy - 36, 6, 32);
  ctx.fillStyle = '#b5651d';
  ctx.beginPath();
  ctx.moveTo(wx - 28, wy - 32);
  ctx.lineTo(wx, wy - 52);
  ctx.lineTo(wx + 28, wy - 32);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 2. Золотистые стога сена у загона и амбара
  const hayPositions = [
    { x: px - 36, y: py + 375, s: 1.0 },
    { x: px + 915, y: py + 372, s: 0.92 },

  ];
  hayPositions.forEach((hp) => {

    ctx.fillStyle = '#f6b93b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 8, 24, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#e58e26';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, -2);
    ctx.lineTo(-4, 6);
    ctx.moveTo(6, -5);
    ctx.lineTo(12, 4);
    ctx.stroke();
    ctx.restore();
  });

  ctx.restore();
}

function drawAmbientLife(now) {
  if (camera.zoom < 0.42) return;
  const phase = getDayPhaseInfo(state.gameMinutes);
  const isNight = phase.label === 'ночь' || phase.label === 'вечер';
  const baseWx = WORLD.penRect.x + 250;
  const baseWy = WORLD.penRect.y + 220;

  ctx.save();
  const count = isNight ? 8 : 5;
  for (let i = 0; i < count; i++) {
    const angle = now / (2200 + i * 240) + i * 2.3;
    const radX = 240 + (i % 4) * 210;
    const radY = 190 + (i % 3) * 185;
    const bx = baseWx + Math.cos(angle) * radX + (i - 2) * 140;
    const by = baseWy + Math.sin(angle * 1.3) * radY + ((i % 3) - 1) * 220;
    if (!isRectVisible(bx - 20, by - 20, 40, 40, 20)) continue;

    if (isNight) {
      // Светлячки в сумерках и ночью
      const glow = 0.45 + 0.55 * Math.sin(now / 220 + i * 2.3);
      ctx.fillStyle = `rgba(184, 255, 77, ${glow * 0.38})`;
      ctx.beginPath();
      ctx.arc(bx, by, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#eaff8f';
      ctx.beginPath();
      ctx.arc(bx, by, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Дневные бабочки над лугом и грядками
      const wing = Math.abs(Math.sin(now / 75 + i));
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(Math.sin(angle) * 0.4);
      ctx.fillStyle = i % 2 === 0 ? '#ff7eb3' : '#ffe047';
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(-4 * wing, -2, 5 * wing + 1, 3.5, -0.3, 0, Math.PI * 2);
      ctx.ellipse(4 * wing, -2, 5 * wing + 1, 3.5, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawTerrainAndTiles(now = 0) {
  ctx.imageSmoothingEnabled = false;

  const viewW = W / camera.zoom;
  const viewH = H / camera.zoom;
  const seaBgGrad = ctx.createLinearGradient(camera.x, camera.y, camera.x + viewW, camera.y + viewH);
  seaBgGrad.addColorStop(0, '#0277BD');
  seaBgGrad.addColorStop(1, '#01579B');
  ctx.fillStyle = seaBgGrad;
  ctx.fillRect(camera.x - 10, camera.y - 10, viewW + 20, viewH + 20);

  drawVisibleLayerCropped(overviewCanvas);

  if (camera.zoom >= 0.36) {
    const viewW = W / camera.zoom;
    const viewH = H / camera.zoom;
    const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
    const endCol = Math.min(MAP_COLS - 1, Math.ceil((camera.x + viewW) / TILE_SIZE));
    const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
    const endRow = Math.min(MAP_ROWS - 1, Math.ceil((camera.y + viewH) / TILE_SIZE));

    // Проход 1: базовые тайлы, водные блики и каменные дорожки
    for (let ty = startRow; ty <= endRow; ty++) {
      const rowOff = ty * MAP_COLS;
      for (let tx = startCol; tx <= endCol; tx++) {
        const idx = rowOff + tx;
        if (FOG_GRID[idx] === 0) continue;
        const tType = TILE_GRID[idx];
        const x = tx * TILE_SIZE;
        const y = ty * TILE_SIZE;
        ctx.fillStyle = TILE_PALETTE[tType];
        ctx.fillRect(x, y, TILE_SIZE + 0.6, TILE_SIZE + 0.6);

        if (tType === 0 || tType === 1 || tType === 10) {
          // Мультяшная живая рябь и солнечные блики на воде
          const wave = Math.sin(now / 460 + tx * 0.9 + ty * 0.6) * 5.5;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.44)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x + 12 + wave, y + 20);
          ctx.quadraticCurveTo(x + 24 + wave, y + 17, x + 36 + wave, y + 20);
          ctx.moveTo(x + 24 - wave, y + 44);
          ctx.quadraticCurveTo(x + 37 - wave, y + 41, x + 50 - wave, y + 44);
          ctx.stroke();
        } else if (tType === 11) {
          // Объёмные камешки и золотистые блики на тропе
          ctx.fillStyle = '#ffd08a';
          ctx.beginPath();
          ctx.ellipse(x + 20, y + 19, 6, 4, 0.2, 0, Math.PI * 2);
          ctx.ellipse(x + 44, y + 43, 7, 4.5, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#b87432';
          ctx.beginPath();
          ctx.arc(x + 22, y + 21, 3.5, 0, Math.PI * 2);
          ctx.arc(x + 46, y + 45, 4, 0, Math.PI * 2);
          ctx.fill();
        } else if ((tType === 3 || tType === 4) && (tx + ty) % 3 === 0) {
          // Сочные мультяшные травинки-галочки на лугах
          ctx.strokeStyle = '#4aa812';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + 24, y + 34);
          ctx.lineTo(x + 20, y + 27);
          ctx.moveTo(x + 24, y + 34);
          ctx.lineTo(x + 29, y + 28);
          ctx.stroke();
        }
      }
    }

    // Проход 2: объёмные деревья, скалы, цветы и мосты
    for (let ty = startRow; ty <= endRow; ty++) {
      const rowOff = ty * MAP_COLS;
      for (let tx = startCol; tx <= endCol; tx++) {
        const idx = rowOff + tx;
        if (FOG_GRID[idx] === 0 || TILE_PROPS[idx] === 0) continue;
        drawTileDecoration(ctx, tx, ty, TILE_SIZE, now);
      }
    }
  }
}

function drawLogSpots(now) {
  const invScale = Math.min(3.2, Math.max(0.95, 0.72 / camera.zoom));
  for (let i = 0; i < LOG_SPOTS.length; i++) {
    const lg = LOG_SPOTS[i];
    if (lg.respawnAt > now) continue;
    const tileIdx = lg.ty * MAP_COLS + lg.tx;
    if (FOG_GRID[tileIdx] === 0) continue;

    const wx = lg.tx * TILE_SIZE + TILE_SIZE / 2;
    const wy = lg.ty * TILE_SIZE + TILE_SIZE / 2;
    if (!isRectVisible(wx - 70, wy - 70, 140, 140, 70)) continue;

    ctx.save();
    ctx.translate(wx, wy);
    ctx.scale(invScale, invScale);

    drawGroundShadow(ctx, 0, 10, 22, 7);
    drawCartoonIcon(ctx, 'log', 0, 0, 34);
    if (camera.zoom >= 0.45) {
      drawOutlinedText(`+${lg.amount + (state.axeLevel - 1)} 🪵`, 0, -20, 10.5, '#ffe047', 'center', 2.6);
    }
    ctx.restore();
  }
}

function drawSawmillZone(now) {
  const { x, y, w, h } = SAWMILL_CONFIG.rect;
  if (!isRectVisible(x, y, w, h, 140)) return;

  drawGroundShadow(ctx, x + w / 2, y + h - 4, w * 0.48, 20);
  ctx.fillStyle = '#cfa363';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3.5;
  roundRect(ctx, x, y + 60, w, h - 60, 20);
  ctx.fill();
  ctx.stroke();

  if (state.sawmillLevel === 0) {
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = '#5c3818';
    ctx.lineWidth = 3.5;
    roundRect(ctx, x + 28, y + 85, w - 56, 175, 14);
    ctx.stroke();
    ctx.setLineDash([]);

    drawCartoonIcon(ctx, 'log', x + w / 2, y + 165, 44);
    drawCartoonButton(ctx, x + 32, y + 265, w - 64, 72, 14, '#ffe047', '#f39c12', false);
    drawOutlinedText('МЕСТО ПОД ЛЕСОПИЛКУ', x + w / 2, y + 288, 13, '#ffffff', 'center', 3);
    drawCartoonIcon(ctx, 'coin', x + w / 2 - 42, y + 315, 22);
    drawOutlinedText(`Построить: ${SAWMILL_CONFIG.buildPrice}`, x + w / 2 + 16, y + 316, 13.5, '#ffffff', 'center', 3);
    return;
  }

  // Бревенчатый навес лесопилки
  ctx.fillStyle = '#8c5327';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3.5;
  roundRect(ctx, x + 36, y + 125, 18, 155, 5);
  ctx.fill();
  ctx.stroke();
  roundRect(ctx, x + w - 54, y + 125, 18, 155, 5);
  ctx.fill();
  ctx.stroke();

  // Верстак распиловки
  ctx.fillStyle = '#6f3e18';
  roundRect(ctx, x + 54, y + 205, w - 108, 48, 8);
  ctx.fill();
  ctx.stroke();

  // Вращающаяся циркулярная пила
  ctx.save();
  ctx.translate(x + w / 2, y + 202);
  const isSawing = state.sawmillQueueLogs > 0;
  ctx.rotate(now / (isSawing ? 90 : 750));
  ctx.fillStyle = '#dfe6e9';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#e03131';
  ctx.beginPath();
  ctx.arc(0, 0, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Штабель брёвен слева
  drawCartoonIcon(ctx, 'log', x + 84, y + 266, 30);
  drawCartoonIcon(ctx, 'log', x + 112, y + 266, 30);
  drawCartoonIcon(ctx, 'log', x + 98, y + 252, 30);

  // Крыша лесопилки
  ctx.fillStyle = '#b5651d';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3.8;
  ctx.beginPath();
  ctx.moveTo(x + 16, y + 132);
  ctx.lineTo(x + w / 2, y + 54);
  ctx.lineTo(x + w - 16, y + 132);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Плашка состояния внизу
  ctx.fillStyle = '#fff3d6';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  roundRect(ctx, x + 18, y + 294, w - 36, 60, 14);
  ctx.fill();
  ctx.stroke();

  const plankPrice = getSawmillPlankValue();
  drawOutlinedText(`ЛЕСОПИЛКА УР. ${state.sawmillLevel} (${plankPrice}💰/бр.)`, x + w / 2, y + 312, 12.2, '#ffe047', 'center', 3);
  const statusLine = state.sawmillQueueLogs > 0
    ? `В распиле: ${state.sawmillQueueLogs} бр. (${Math.round(state.sawmillProgress * 100)}%)`
    : `Нажмите, чтобы пилить брёвна →`;
  drawOutlinedText(statusLine, x + w / 2, y + 335, 11.2, '#ffffff', 'center', 2.8);

  if (state.sawmillStoredCoins >= 1) {
    const pulse = 1 + Math.sin(now / 170) * 0.08;
    ctx.save();
    ctx.translate(x + w / 2, y + 28);
    ctx.scale(pulse, pulse);
    drawCartoonButton(ctx, -72, -19, 144, 38, 19, '#ffe047', '#f39c12', false);
    drawCartoonIcon(ctx, 'coin', -46, 0, 24);
    drawOutlinedText(`+${Math.floor(state.sawmillStoredCoins)}`, 14, 1, 14.5, '#ffffff', 'center', 3);
    ctx.restore();
  }
}

function drawTreasures(now) {
  const invScale = Math.min(3.5, Math.max(0.95, 0.7 / camera.zoom));
  for (let i = 0; i < TREASURE_SPOTS.length; i++) {
    const tr = TREASURE_SPOTS[i];
    if (state.collectedTreasures.includes(tr.id)) continue;
    const tileIdx = tr.ty * MAP_COLS + tr.tx;
    if (FOG_GRID[tileIdx] === 0) continue;

    const wx = tr.tx * TILE_SIZE + TILE_SIZE / 2;
    const wy = tr.ty * TILE_SIZE + TILE_SIZE / 2;
    if (!isRectVisible(wx - 80, wy - 80, 160, 160, 80)) continue;

    const bob = Math.sin(now / 260 + tr.tx) * 4;
    ctx.save();
    ctx.translate(wx, wy + bob);
    ctx.scale(invScale, invScale);

    ctx.fillStyle = 'rgba(255, 224, 71, 0.32)';
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill();

    const icon = tr.kind === 'chest' ? 'coin' : tr.kind === 'truffle' ? 'acorn' : 'basket';
    drawCartoonIcon(ctx, icon, 0, 0, 28);
    ctx.restore();
  }
}

function drawLandmarks(now) {
  const invScale = Math.min(4.0, Math.max(0.95, 0.65 / camera.zoom));

  for (let i = 0; i < LANDMARKS.length; i++) {
    const lm = LANDMARKS[i];
    const wx = lm.tx * TILE_SIZE + TILE_SIZE / 2;
    const wy = lm.ty * TILE_SIZE + TILE_SIZE / 2;
    if (!isRectVisible(wx - 240, wy - 240, 480, 480, 220)) continue;

    const tileIdx = lm.ty * MAP_COLS + lm.tx;
    const nearCaravan = Math.hypot(caravan.x - wx, caravan.y - wy) < 220 && caravan.status !== 'voyage_prep';
    const isDiscovered = state.discoveredLandmarks.includes(lm.id) || ( lm.isIsland ? nearCaravan : FOG_GRID[tileIdx] === 1 );

    if (isDiscovered && !state.discoveredLandmarks.includes(lm.id)) {
      state.discoveredLandmarks.push(lm.id);
      state.coins += lm.rewardCoins;
      state.food += lm.rewardFood;
      if (lm.rewardLogs) state.logs += lm.rewardLogs;
      SoundManager.discover();
      spawnFloatingText(wx, wy - 55, `ОТКРЫТО: ${lm.name}! +${lm.rewardCoins}💰`, '#ffe047');
      saveGame();
    }

    // Морские острова видны всегда как маяки в море, чтобы по ним можно было нажать
    if (!isDiscovered && !lm.isIsland) continue;

    ctx.save();
    ctx.translate(wx, wy);

    if (lm.kind === 'home') {
      drawGroundShadow(ctx, 0, 26, 46, 14);
      ctx.fillStyle = '#ffeaa7';
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 3.2;
      roundRect(ctx, -30, -8, 60, 36, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#2d6a4f';
      ctx.beginPath();
      ctx.moveTo(-36, -6);
      ctx.lineTo(0, -36);
      ctx.lineTo(36, -6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffb8c6';
      ctx.beginPath();
      ctx.ellipse(0, -19, 10, 7.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (lm.kind === 'tractor') {
      drawGroundShadow(ctx, 0, 22, 42, 12);
      ctx.fillStyle = '#e67e22';
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 3;
      roundRect(ctx, -24, -16, 24, 26, 5);
      ctx.fill();
      ctx.stroke();
      roundRect(ctx, 0, -6, 26, 16, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#2f3640';
      ctx.beginPath();
      ctx.arc(-12, 14, 11, 0, Math.PI * 2);
      ctx.arc(16, 17, 7.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (lm.kind === 'mill') {

      roundRect(ctx, -16, -14, 32, 34, 6);

      ctx.stroke();
      ctx.save();
      ctx.translate(0, -8);
      ctx.rotate(now / 900);
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-24, 0);
      ctx.lineTo(24, 0);
      ctx.moveTo(0, -24);
      ctx.lineTo(0, 24);
      ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = '#1b1209';

      ctx.stroke();

        drawCartoonIcon(ctx, 'ship', 0, -14 + bob, 46);
      } else if (state.shipBuild && state.shipBuild.active) {
        // Строящийся остов корабля на деревянных лесах
        ctx.fillStyle = '#c97a35';
        roundRect(ctx, -22, -10, 44, 14, 5);
        ctx.fill();
        ctx.stroke();
        // Леса верфи
        ctx.strokeStyle = '#5c310e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-24, 4);
        ctx.lineTo(-24, -22);
        ctx.moveTo(24, 4);
        ctx.lineTo(24, -22);
        ctx.moveTo(-28, -16);
        ctx.lineTo(28, -16);
        ctx.stroke();
        drawCartoonIcon(ctx, 'log', 0, -14, 26);
      } else {
        // Пустой стапель верфи
        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = '#ffe047';
        ctx.lineWidth = 2.8;
        roundRect(ctx, -24, -20, 48, 22, 7);
        ctx.stroke();
        ctx.setLineDash([]);
        drawCartoonIcon(ctx, 'log', -10, -9, 22);
        drawCartoonIcon(ctx, 'ship', 12, -11, 24);
      }
    } else if (lm.kind === 'island') {
      // Маяк и золотой сундук морского острова
      const bob = Math.sin(now / 280 + lm.tx) * 3.5;
      drawGroundShadow(ctx, 0, 22, 38, 12);
      ctx.fillStyle = 'rgba(255, 224, 71, 0.28)';
      ctx.beginPath();
      ctx.arc(0, -4 + bob, 28, 0, Math.PI * 2);
      ctx.fill();
      drawCartoonIcon(ctx, 'ship', -12, -4 + bob, 32);
      drawCartoonIcon(ctx, 'coin', 14, 2 + bob, 26);
    } else {
      drawGroundShadow(ctx, 0, 18, 30, 9);
      ctx.fillStyle = '#fff5dc';
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 2.8;
      roundRect(ctx, -18, -6, 36, 24, 5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = lm.kind === 'orchard' ? '#52b788' : lm.kind === 'apiary' ? '#ffcf56' : '#e07a5f';
      ctx.beginPath();
      ctx.moveTo(-22, -4);
      ctx.lineTo(0, -22);
      ctx.lineTo(22, -4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(0, 38 * Math.min(1.8, invScale * 0.65));
    ctx.scale(invScale, invScale);
    const titleCol = lm.isIsland ? '#74ff52' : (lm.kind === 'home' || lm.kind === 'harbor') ? '#ffe047' : '#ffffff';
    drawOutlinedText(lm.isIsland ? `⛵ ${lm.name}` : lm.name, 0, 0, 13.5, titleCol, 'center', 3.6);
    if (lm.isIsland) {
      drawOutlinedText(`Только на корабле • +${lm.rewardCoins}💰`, 0, 16, 11, '#ffe047', 'center', 3.0);
    } else if (lm.kind === 'harbor') {
      if (state.shipBuilt) {
        drawOutlinedText(`⛵ Корабль готов к плаванию!`, 0, 16, 11, '#74ff52', 'center', 3.0);
      } else if (state.shipBuild && state.shipBuild.active) {
        const remBuild = Math.max(0, state.shipBuild.startTimeMs + state.shipBuild.durationMs - Date.now());
        const bTxt = remBuild > 0 ? `🔨 Стройка: ${formatRealDuration(remBuild)}` : `🎉 КОРАБЛЬ ГОТОВ! ЖМИ`;
        drawOutlinedText(bTxt, 0, 16, 11, remBuild > 0 ? '#48dbfb' : '#74ff52', 'center', 3.0);
      } else {
        drawOutlinedText(`🔨 Построить корабль (250🪵 + 350💰)`, 0, 16, 11, '#ffcf56', 'center', 3.0);
      }
    }
    ctx.restore();

    ctx.restore();
  }
}

function drawBreedingHouse(now) {

    ctx.moveTo(wxWin - 18, y + 170);
    ctx.lineTo(wxWin + 18, y + 170);

  ctx.lineWidth = 3.8;

  ctx.moveTo(x + 12, y + 134);
  ctx.lineTo(x + w / 2, y + 46);
  ctx.lineTo(x + w - 12, y + 134);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Сердце на фронтоне (пульсирует при случке)
  const heartBeat = (state.breeding && state.breeding.active) ? (1 + Math.sin(now / 150) * 0.14) : 1;
  drawHeart(ctx, x + w / 2, y + 98, 16 * heartBeat);

  // Арочные дубовые ворота с золотой подковой
  ctx.fillStyle = '#6f3e18';
  roundRect(ctx, x + w / 2 - 42, y + 188, 84, 92, 12);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y + 188);
  ctx.lineTo(x + w / 2, y + 280);
  ctx.stroke();

  // Плашка состояния
  ctx.fillStyle = '#fff3d6';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  roundRect(ctx, x + 18, y + 292, w - 36, 62, 14);
  ctx.fill();
  ctx.stroke();

  if (state.breeding && state.breeding.active) {

function drawGirlBow(ctx, cx, cy, scale = 1.0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.14);
  ctx.scale(scale, scale);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1b1209';
  ctx.lineWidth = 2.6;

  // Нижние ленточки бантика
  ctx.fillStyle = '#d81b60';
  ctx.beginPath();
  ctx.moveTo(-2, 2);
  ctx.lineTo(-8, 12);
  ctx.lineTo(-3, 10);
  ctx.lineTo(0, 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(2, 2);
  ctx.lineTo(8, 12);
  ctx.lineTo(3, 10);
  ctx.lineTo(0, 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Градиент атласных крыльев бантика
  const bowGrad = ctx.createLinearGradient(0, -10, 0, 10);
  bowGrad.addColorStop(0, '#ff85b3');
  bowGrad.addColorStop(0.5, '#ff3377');
  bowGrad.addColorStop(1, '#c2185b');
  ctx.fillStyle = bowGrad;

  // Левое крыло
  ctx.beginPath();
  ctx.moveTo(-2, 0);
  ctx.bezierCurveTo(-17, -12, -17, 12, -2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Правое крыло
  ctx.beginPath();
  ctx.moveTo(2, 0);
  ctx.bezierCurveTo(17, -12, 17, 12, 2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Глянцевые блики
  ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
  ctx.beginPath();
  ctx.ellipse(-8.5, -3.2, 3.2, 1.6, -0.3, 0, Math.PI * 2);
  ctx.ellipse(8.5, -3.2, 3.2, 1.6, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Центральный объёмный узелок
  const knotGrad = ctx.createRadialGradient(-1, -1.5, 1, 0, 0, 5);
  knotGrad.addColorStop(0, '#ff9ec4');
  knotGrad.addColorStop(1, '#ad1457');
  ctx.fillStyle = knotGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 4.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawPenAndBoars() {
  const { x, y, w, h } = WORLD.penRect;
  if (!isRectVisible(x, y, w, h, 140)) return;

  drawGroundShadow(ctx, x + w / 2, y + h + 6, w * 0.5, 20);
  const penTurfGrad = ctx.createRadialGradient(x + w * 0.48, y + h * 0.45, 30, x + w / 2, y + h / 2, w * 0.62);
  penTurfGrad.addColorStop(0, '#a8ff5e');
  penTurfGrad.addColorStop(0.65, '#7de03b');
  penTurfGrad.addColorStop(1, '#58b81d');
  ctx.fillStyle = penTurfGrad;
  roundRect(ctx, x, y, w, h, 26);
  ctx.fill();

  // Декоративные пучки клевера и ромашек в загоне
  ctx.fillStyle = '#6ec242';
  ctx.beginPath();
  ctx.arc(x + 48, y + 52, 18, 0, Math.PI * 2);
  ctx.arc(x + w - 58, y + 64, 22, 0, Math.PI * 2);
  ctx.arc(x + w - 70, y + h - 78, 20, 0, Math.PI * 2);
  ctx.fill();

  // Грязевая купальня для хряков с блеском и пузырьками
  ctx.fillStyle = '#7d532d';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(x + w * 0.24, y + h * 0.70, 58, 24, 0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#9c6b3f';
  ctx.beginPath();
  ctx.ellipse(x + w * 0.22, y + h * 0.68, 26, 9, 0.08, 0, Math.PI * 2);
  ctx.fill();

  // Кормушка в загоне (прокачивается от «Дубовых кормушек» в Лесопилке!)
  const txTrough = x + w * 0.68;
  const tyTrough = y + 56;
  drawGroundShadow(ctx, txTrough, tyTrough + 16, 48, 12);
  ctx.fillStyle = (state.feederLevel || 0) > 0 ? '#a8652e' : '#c98342';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  roundRect(ctx, txTrough - 42, tyTrough - 10, 84, 24, 7);
  ctx.fill();
  ctx.stroke();
  if (state.food > 0) {
    ctx.fillStyle = '#ff9f1a';
    roundRect(ctx, txTrough - 34, tyTrough - 5, 68, 12, 4);
    ctx.fill();
  }
  if ((state.feederLevel || 0) > 0) {
    // Золотые оковки на улучшенной дубовой кормушке
    ctx.fillStyle = '#ffe047';
    ctx.fillRect(txTrough - 30, tyTrough - 10, 6, 24);
    ctx.strokeRect(txTrough - 30, tyTrough - 10, 6, 24);
    ctx.fillRect(txTrough + 24, tyTrough - 10, 6, 24);
    ctx.strokeRect(txTrough + 24, tyTrough - 10, 6, 24);
  }

  drawFenceHorizontal(x, y, w);

  const badgeW = 148;
  const badgeH = 30;
  const bxBadge = x + w / 2 - badgeW / 2;
  const byBadge = y - 19;
  ctx.fillStyle = '#fff3d6';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  roundRect(ctx, bxBadge, byBadge, badgeW, badgeH, 15);
  ctx.fill();
  ctx.stroke();
  drawOutlinedText(`СТАДО: ${state.boars.length}/${getMaxHerdCapacity()}`, x + w / 2, byBadge + badgeH / 2 + 1, 13, '#ffe047', 'center', 3);

  activeBoars.sort((a, b) => a.y - b.y);

  for (let i = 0; i < activeBoars.length; i++) {
    const boar = activeBoars[i];
    const bx = x + 56 + boar.x * (w - 112);
    const by = y + 56 + boar.y * (h - 94);

    const sprite = boarSprites[boar.id];
    const baseSize = 104 * boar.scale;

    let jumpOffset = 0;
    let scaleX = 1;
    let scaleY = 1;
    let tilt = 0;

    // Живое дыхание + пружинящее покачивание при ходьбе и прыжке
    const breath = Math.sin(boar.breathPhase || 0) * 0.028;
    if (boar.bounceTime > 0) {
      const t = 1 - boar.bounceTime;
      jumpOffset = Math.sin(t * Math.PI) * 38;
      const squash = Math.sin(t * Math.PI * 2) * 0.24;
      scaleX = 1 + squash;
      scaleY = 1 - squash;
      tilt = Math.sin(t * Math.PI * 2) * 0.08;
    } else if (boar.waitTimer <= 0) {
      const wobble = Math.sin(boar.walkPhase) * 0.055;
      scaleX = 1 + wobble + breath;
      scaleY = 1 - wobble - breath;
      jumpOffset = Math.abs(Math.sin(boar.walkPhase)) * 5.5;
      tilt = Math.sin(boar.walkPhase) * 0.045;
    } else {
      scaleX = 1 + breath;
      scaleY = 1 - breath * 1.15;
    }

    const shadowScale = Math.max(0.5, 1 - jumpOffset / 115);
    drawGroundShadow(ctx, bx, by + baseSize * 0.39, baseSize * 0.38 * shadowScale, baseSize * 0.13 * shadowScale);

    ctx.save();
    ctx.translate(bx, by - jumpOffset);
    ctx.rotate(tilt * boar.facing);
    ctx.scale(boar.facing * scaleX, scaleY);

    if (sprite && sprite.complete && sprite.naturalWidth > 0) {
      const aspect = sprite.naturalWidth / sprite.naturalHeight;
      const drawW = baseSize * aspect;
      const drawH = baseSize;
      ctx.drawImage(sprite, -drawW / 2, -drawH / 2, drawW, drawH);



      if (boar.gender === 'female') {
        // Бантик высоко на макушке/ушке (не закрывает глаз!)
        drawGirlBow(ctx, drawW * 0.04, -drawH * 0.45, 0.96 * boar.scale);
      }
    } else {
      // Многослойная векторная иллюстрация хряка с градиентами и бликами
      const bodyGrad = ctx.createRadialGradient(-8, -10, 4, 0, 4, 38);
      bodyGrad.addColorStop(0, '#ffdde6');
      bodyGrad.addColorStop(0.6, '#ff9ebb');
      bodyGrad.addColorStop(1, '#d96b8c');
      ctx.fillStyle = bodyGrad;
      ctx.strokeStyle = '#1b1209';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.ellipse(0, 4, 35, 27, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();

    if (boar.heartsTime > 0) {
      drawHeart(ctx, bx, by - baseSize * 0.62 - jumpOffset, 11);
    }

    // Отображение клички, породы и сытости хряка
    const showPlate = camera.zoom >= 0.72 || boar.labelTimer > 0 || boar.fullnessTimer > 0;
    if (showPlate) {
      const tagY = by + baseSize * 0.44 - jumpOffset * 0.35;
      const genTag = (boar.generation || 1) > 1 ? ` [Пок.${boar.generation}]` : '';
      const sexIcon = boar.gender === 'female' ? '♀ ' : '♂ ';
      const nameColor = boar.gender === 'female' ? '#ff9ff3' : '#ffe047';
      drawOutlinedText(`${sexIcon}${boar.nickname}${genTag}`, bx, tagY, 12.5, nameColor, 'center', 3.2);
      drawOutlinedText(boar.breed, bx, tagY + 13, 9.8, '#dff9ba', 'center', 2.8);
      if (boar.fullnessTimer > 0) {
        drawOutlinedText(`Сыт (${Math.ceil(boar.fullnessTimer)}с)`, bx, tagY + 25, 9.5, '#ff9ff3', 'center', 2.6);
      }
    }
  }

  drawFenceVertical(x, y, h);
  drawFenceVertical(x + w, y, h);
  drawFenceHorizontal(x, y + h, w);

  if (state.food > 0 && activeBoars.length > 0) {
    const hungryCount = activeBoars.filter((b) => b.fullnessTimer <= 0).length;
    const fb = getFeedAllWorldRect();
    if (hungryCount > 0) {
      drawCartoonButton(ctx, fb.x, fb.y, fb.w, fb.h, 12, '#ff6b6b', '#ee5253', false);
      drawCartoonIcon(ctx, 'feed_all', fb.x + 22, fb.y + fb.h / 2, 24);
      drawOutlinedText(`Кормить (${hungryCount})`, fb.x + 82, fb.y + fb.h / 2 + 1, 12, '#ffffff', 'center', 3);
    } else {
      drawCartoonButton(ctx, fb.x, fb.y, fb.w, fb.h, 12, '#b2bec3', '#636e72', false);
      drawOutlinedText('Все сыты', fb.x + fb.w / 2, fb.y + fb.h / 2 + 1, 12.5, '#ffffff', 'center', 3);
    }
  }
}

function getFeedAllWorldRect() {
  const { x, y, w, h } = WORLD.penRect;
  return { x: x + w - 144, y: y + h - 48, w: 134, h: 38 };
}

function drawHeart(ctx, x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#ff4d4d';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, r * 0.6);
  ctx.bezierCurveTo(-r * 1.2, -r * 0.2, -r * 0.6, -r * 1.1, 0, -r * 0.35);
  ctx.bezierCurveTo(r * 0.6, -r * 1.1, r * 1.2, -r * 0.2, 0, r * 0.6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawFenceHorizontal(x, y, w) {
  ctx.save();
  ctx.strokeStyle = '#1b1209';
  ctx.lineWidth = 3;

  // Мягкая тень от забора на траву
  ctx.fillStyle = 'rgba(18, 36, 10, 0.22)';
  roundRect(ctx, x + 2, y + 3, w, 8, 4);
  ctx.fill();

  const railGrad = ctx.createLinearGradient(0, y - 16, 0, y + 6);
  railGrad.addColorStop(0, '#e59949');
  railGrad.addColorStop(0.5, '#c2742c');
  railGrad.addColorStop(1, '#8c4c16');
  ctx.fillStyle = railGrad;

  roundRect(ctx, x, y - 15, w, 8.5, 3.5);
  ctx.fill();
  ctx.stroke();

  roundRect(ctx, x, y - 4.5, w, 8.5, 3.5);
  ctx.fill();
  ctx.stroke();

  // Верхний солнечный блик на перекладинах
  ctx.strokeStyle = 'rgba(255, 232, 185, 0.45)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x + 6, y - 13);
  ctx.lineTo(x + w - 6, y - 13);
  ctx.moveTo(x + 6, y - 2.5);
  ctx.lineTo(x + w - 6, y - 2.5);
  ctx.stroke();

  ctx.strokeStyle = '#1b1209';
  ctx.lineWidth = 3;
  const posts = Math.max(4, Math.floor(w / 62));
  for (let i = 0; i <= posts; i++) {
    const px = x + (w / posts) * i - 6.5;
    const postGrad = ctx.createLinearGradient(px, y - 24, px + 13, y + 6);
    postGrad.addColorStop(0, '#f3aa5b');
    postGrad.addColorStop(0.6, '#cf7e32');
    postGrad.addColorStop(1, '#945218');
    ctx.fillStyle = postGrad;
    roundRect(ctx, px, y - 23, 13, 29, 4.5);
    ctx.fill();
    ctx.stroke();

    // Гвоздики на столбиках
    ctx.fillStyle = '#3d2510';
    ctx.beginPath();
    ctx.arc(px + 6.5, y - 11, 1.6, 0, Math.PI * 2);
    ctx.arc(px + 6.5, y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawFenceVertical(x, y, h) {
  ctx.save();
  const vGrad = ctx.createLinearGradient(x - 6, 0, x + 6, 0);
  vGrad.addColorStop(0, '#eca050');
  vGrad.addColorStop(0.6, '#c2742c');
  vGrad.addColorStop(1, '#874814');
  ctx.fillStyle = vGrad;
  ctx.strokeStyle = '#1b1209';
  ctx.lineWidth = 3;
  roundRect(ctx, x - 5.5, y - 16, 11, h + 18, 4.5);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function getFieldPlotRects(fieldCfg) {
  const { x, y, w, h } = fieldCfg.rect;
  const cols = 3;
  const rows = 2;
  const innerPadX = 14;
  const innerPadY = 44;
  const gapX = 10;
  const gapY = 10;
  const cellW = (w - innerPadX * 2 - gapX * (cols - 1)) / cols;
  const cellH = (h - innerPadY - 14 - gapY * (rows - 1)) / rows;

  const rects = [];
  for (let i = 0; i < 6; i++) {
    const r = Math.floor(i / cols);
    const c = i % cols;
    rects.push({
      localIndex: i,
      x: x + innerPadX + c * (cellW + gapX),
      y: y + innerPadY + r * (cellH + gapY),
      w: cellW,
      h: cellH
    });
  }
  return rects;
}

function getFieldHarvestRect(fieldCfg) {
  const { x, y, w } = fieldCfg.rect;
  return { x: x + w - 126, y: y + 8, w: 116, h: 29 };
}

function drawAllFields(now) {

  for (let fIdx = 0; fIdx < FIELD_CONFIGS.length; fIdx++) {
    const fieldCfg = FIELD_CONFIGS[fIdx];
    const { x, y, w, h } = fieldCfg.rect;
    if (!isRectVisible(x, y, w, h, 80)) continue;

    const isUnlocked = state.unlockedFields.includes(fieldCfg.id);

    if (!isUnlocked) {
      ctx.fillStyle = 'rgba(82, 183, 136, 0.85)';
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 4;
      roundRect(ctx, x, y, w, h, 20);
      ctx.fill();
      ctx.stroke();

      ctx.setLineDash([12, 8]);
      ctx.strokeStyle = '#1b4332';
      ctx.lineWidth = 3;
      roundRect(ctx, x + 12, y + 12, w - 24, h - 24, 14);
      ctx.stroke();
      ctx.setLineDash([]);

      drawCartoonButton(ctx, x + 46, y + h / 2 - 40, w - 92, 80, 16, '#ffe047', '#f39c12', false);
      drawOutlinedText(fieldCfg.fullName.toUpperCase(), x + w / 2, y + h / 2 - 15, 15, '#ffffff', 'center', 3.2);
      drawCartoonIcon(ctx, 'coin', x + w / 2 - 44, y + h / 2 + 16, 24);
      drawOutlinedText(`Купить: ${fieldCfg.price}`, x + w / 2 + 12, y + h / 2 + 17, 15, '#ffffff', 'center', 3.2);
      continue;
    }

    ctx.fillStyle = '#1b1209';
    roundRect(ctx, x, y + 6, w, h, 24);
    ctx.fill();

    const fldGrad = ctx.createLinearGradient(x, y, x, y + h);
    fldGrad.addColorStop(0, '#c78342');
    fldGrad.addColorStop(0.5, '#a16228');
    fldGrad.addColorStop(1, '#754114');
    ctx.fillStyle = fldGrad;
    ctx.strokeStyle = '#1b1209';
    ctx.lineWidth = 4;
    roundRect(ctx, x, y, w, h, 24);
    ctx.fill();
    ctx.stroke();

    // Внутренний золотистый кант поля
    ctx.strokeStyle = 'rgba(255, 224, 150, 0.35)';
    ctx.lineWidth = 2.2;
    roundRect(ctx, x + 5, y + 5, w - 10, h - 10, 20);
    ctx.stroke();

    const unlockPos = state.unlockedFields.indexOf(fieldCfg.id);
    const startPlotIdx = unlockPos * 6;
    const endPlotIdx = startPlotIdx + 6;

    let readyInField = 0;
    for (let gi = startPlotIdx; gi < endPlotIdx; gi++) {
      if (state.plots[gi] && state.plots[gi].ready) readyInField++;
    }

    drawOutlinedText(fieldCfg.fullName.toUpperCase(), x + 16, y + 22, 14.5, '#fff2b2', 'left', 3.5);

    if (readyInField >= 2) {
      const hb = getFieldHarvestRect(fieldCfg);
      drawCartoonButton(ctx, hb.x, hb.y, hb.w, hb.h, 10, '#5be346', '#3bb528', false);
      drawCartoonIcon(ctx, 'harvest_all', hb.x + 16, hb.y + hb.h / 2, 18);
      drawOutlinedText(`Собрать (${readyInField})`, hb.x + 68, hb.y + hb.h / 2 + 1, 11.5, '#ffffff', 'center', 2.8);
    }

    const plotRects = getFieldPlotRects(fieldCfg);
    for (let pIdx = 0; pIdx < plotRects.length; pIdx++) {
      const rect = plotRects[pIdx];
      const globalIdx = startPlotIdx + rect.localIndex;
      const isPlotBought = globalIdx < state.plotCount;

      if (!isPlotBought) {
        ctx.fillStyle = '#633c19';
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2.5;
        roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 13);
        ctx.fill();
        ctx.stroke();

        ctx.globalAlpha = 0.6;
        drawCartoonIcon(ctx, 'plot', rect.x + rect.w / 2, rect.y + rect.h / 2 - 7, 25);
        ctx.globalAlpha = 1;
        drawOutlinedText('В лавке', rect.x + rect.w / 2, rect.y + rect.h - 14, 10.5, '#f5deb3', 'center', 2.5);
        continue;
      }

      const plot = state.plots[globalIdx];

      ctx.fillStyle = plot && plot.crop ? '#4d2d11' : '#70451f';
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 3;
      roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 13);
      ctx.fill();
      ctx.stroke();

      // Борозды вспаханной земли на грядке
      ctx.strokeStyle = plot && plot.crop ? 'rgba(32, 18, 6, 0.45)' : 'rgba(54, 31, 12, 0.38)';
      ctx.lineWidth = 2.2;
      for (let fy = rect.y + 16; fy <= rect.y + rect.h - 24; fy += 14) {
        ctx.beginPath();
        ctx.moveTo(rect.x + 12, fy);
        ctx.lineTo(rect.x + rect.w - 12, fy);
        ctx.stroke();
      }

      const cx = rect.x + rect.w / 2;
      const cy = rect.y + rect.h / 2 - 5;

      if (!plot || !plot.crop || !CROPS[plot.crop]) {
        const seed = CROPS[state.selectedSeed] || CROPS.carrot;
        const canAffordSeed = state.coins >= seed.seedCost;
        ctx.globalAlpha = canAffordSeed ? 0.72 : 0.35;
        drawCartoonIcon(ctx, seed.iconKey, cx, cy - 2, 28);
        ctx.globalAlpha = 1;
        drawOutlinedText(`Семена: ${seed.seedCost}💰`, cx, rect.y + rect.h - 13, 10, canAffordSeed ? '#ffe047' : '#ff6b6b', 'center', 2.5);
      } else {
        const cropCfg = CROPS[plot.crop] || CROPS.carrot;
        const progress = Math.min(1, plot.progress || 0);

        if (progress >= 1) {
          plot.ready = true;
          plot.hasWeed = false;
        }

        if (plot.ready) {
          const pulse = 1 + Math.sin(now / 150) * 0.11;
          ctx.fillStyle = 'rgba(255, 224, 71, 0.28)';
          ctx.beginPath();
          ctx.arc(cx, cy, 22 * pulse, 0, Math.PI * 2);
          ctx.fill();

          drawCartoonIcon(ctx, cropCfg.iconKey, cx, cy, 36 * pulse);

          ctx.fillStyle = '#4cd137';
          ctx.strokeStyle = '#1a1a1a';
          ctx.lineWidth = 2.5;
          roundRect(ctx, rect.x + 8, rect.y + rect.h - 21, rect.w - 16, 17, 8);
          ctx.fill();
          ctx.stroke();
          drawOutlinedText('СОБРАТЬ', cx, rect.y + rect.h - 12.5, 10, '#ffffff', 'center', 2.5);
        } else {
          const sproutScale = 0.55 + progress * 0.45;
          if (progress < 0.45) {
            drawCartoonIcon(ctx, 'plot', cx, cy, 28 * sproutScale);
          } else {
            drawCartoonIcon(ctx, cropCfg.iconKey, cx, cy, 32 * sproutScale);
          }

          if (plot.hasWeed) {
            ctx.fillStyle = '#e03131';
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 2;
            roundRect(ctx, rect.x + 8, rect.y + 5, rect.w - 16, 16, 7);
            ctx.fill();
            ctx.stroke();
            drawOutlinedText('СОРНЯК! ЖМИ', cx, rect.y + 13, 9.2, '#ffffff', 'center', 2.3);
          }

          const barW = rect.w - 18;
          const barH = 10;
          const bx = rect.x + 9;
          const by = rect.y + rect.h - 16;

          ctx.fillStyle = '#2f1b0c';
          ctx.strokeStyle = '#1a1a1a';
          ctx.lineWidth = 2;
          roundRect(ctx, bx, by, barW, barH, 5);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = plot.hasWeed ? '#ff6b6b' : '#ffdd59';
          roundRect(ctx, bx + 2, by + 2, Math.max(4, (barW - 4) * progress), barH - 4, 3);
          ctx.fill();
        }
      }
    }
  }
}

function drawCaravan(now) {
  const invScale = Math.min(3.8, Math.max(0.95, 0.65 / camera.zoom));

  if (caravan.trailHistory.length > 1) {
    ctx.save();
    ctx.strokeStyle = caravan.status === 'voyage_sailing' ? 'rgba(255, 255, 255, 0.45)' : 'rgba(92, 56, 24, 0.35)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(caravan.trailHistory[0].x, caravan.trailHistory[0].y);
    for (let i = 1; i < caravan.trailHistory.length; i++) {
      ctx.lineTo(caravan.trailHistory[i].x, caravan.trailHistory[i].y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Предпросмотр точки назначения при нажатии на карту (пока игрок не подтвердил отправку)
  if (pendingVoyageTarget && voyageModal.classList.contains('active') && caravan.status === 'idle') {
    const px = pendingVoyageTarget.targetX;
    const py = pendingVoyageTarget.targetY;
    const pulse = 1 + Math.sin(now / 150) * 0.16;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(caravan.x, caravan.y);
    ctx.lineTo(px, py);
    ctx.strokeStyle = 'rgba(27, 18, 9, 0.55)';
    ctx.lineWidth = Math.max(6, 5 * invScale);
    ctx.setLineDash([12, 10]);
    ctx.lineDashOffset = -(now / 26) % 22;
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(3, 2.5 * invScale);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.translate(px, py);
    ctx.scale(invScale, invScale);
    ctx.fillStyle = 'rgba(255, 224, 71, 0.36)';
    ctx.beginPath();
    ctx.arc(0, 0, 28 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffe047';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    drawCartoonIcon(ctx, pendingVoyageTarget.isDistantSea ? 'ship' : 'flag', 0, -8, 32);
    drawOutlinedText('❓ Подтвердить?', 0, 24, 11.5, '#ffe047', 'center', 3);
    ctx.restore();
  }

  // Линия маршрута для сухопутного похода или морского плавания
  if ((caravan.status === 'moving' && caravan.waypoints.length > 0) ||
      ((caravan.status === 'voyage_prep' || caravan.status === 'voyage_sailing') && caravan.targetX !== null)) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(caravan.x, caravan.y);
    if (caravan.status === 'moving') {
      caravan.waypoints.forEach((wp) => ctx.lineTo(wp.x, wp.y));
    } else {
      ctx.lineTo(caravan.targetX, caravan.targetY);
    }

    ctx.strokeStyle = '#1b1209';
    ctx.lineWidth = Math.max(8, 6 * invScale);
    ctx.setLineDash([14, 12]);
    ctx.lineDashOffset = -(now / 22) % 26;
    ctx.stroke();

    ctx.strokeStyle = (caravan.status === 'voyage_prep' || caravan.status === 'voyage_sailing') ? '#48dbfb' : '#ffe047';
    ctx.lineWidth = Math.max(4.5, 3.5 * invScale);
    ctx.stroke();
    ctx.setLineDash([]);

    const tx = caravan.targetX;
    const ty = caravan.targetY;
    const pulse = 1 + Math.sin(now / 160) * 0.14;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.scale(invScale, invScale);
    ctx.fillStyle = 'rgba(72, 219, 251, 0.32)';
    ctx.beginPath();
    ctx.arc(0, 0, 26 * pulse, 0, Math.PI * 2);
    ctx.fill();
    drawCartoonIcon(ctx, (caravan.status === 'voyage_prep' || caravan.status === 'voyage_sailing') ? 'ship' : 'flag', 0, -6, 32);
    ctx.restore();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(caravan.x, caravan.y);
  ctx.scale(invScale, invScale);

  const cTx = Math.max(0, Math.min(MAP_COLS - 1, Math.floor(caravan.x / TILE_SIZE)));
  const cTy = Math.max(0, Math.min(MAP_ROWS - 1, Math.floor(caravan.y / TILE_SIZE)));
  const onWater = TILE_GRID[cTy * MAP_COLS + cTx] <= 1 || caravan.status === 'voyage_sailing' || caravan.status === 'voyage_prep';

  if (onWater) {
    // Рисуем корабль хряков с парусом и волнами!
    const waveBob = Math.sin(now / 240) * 3.5;
    const tilt = Math.sin(now / 380) * 0.06;
    ctx.save();
    ctx.rotate(tilt);

    // Пенистые волны под кораблём
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.beginPath();
    ctx.ellipse(0, 16, 32, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Мачта и полосатый парус
    ctx.strokeStyle = '#1b1209';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(0, 4 - waveBob);
    ctx.lineTo(0, -38 - waveBob);
    ctx.stroke();

    const sailGrad = ctx.createLinearGradient(-18, -36, 20, -4);
    sailGrad.addColorStop(0, '#ffffff');
    sailGrad.addColorStop(0.6, '#fff3d1');
    sailGrad.addColorStop(1, '#ffd166');
    ctx.fillStyle = sailGrad;
    ctx.beginPath();
    ctx.moveTo(0, -36 - waveBob);
    ctx.quadraticCurveTo(26 * caravan.facing, -20 - waveBob, 0, -4 - waveBob);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Хряк-капитан на палубе
    const leadSprite = boarSprites['boar_classic'];
    if (leadSprite && leadSprite.complete && leadSprite.naturalWidth > 0) {
      ctx.save();
      ctx.scale(caravan.facing, 1);
      ctx.drawImage(leadSprite, -15, -24 - waveBob, 30, 30);
      ctx.restore();
    }

    // Деревянный борт корабля
    const hullGrad = ctx.createLinearGradient(0, -2 - waveBob, 0, 15 - waveBob);
    hullGrad.addColorStop(0, '#d38b43');
    hullGrad.addColorStop(0.5, '#9c5923');
    hullGrad.addColorStop(1, '#5c310e');
    ctx.fillStyle = hullGrad;
    ctx.beginPath();
    ctx.moveTo(-28, -1 - waveBob);
    ctx.lineTo(28, -1 - waveBob);
    ctx.lineTo(20, 14 - waveBob);
    ctx.lineTo(-20, 14 - waveBob);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  } else {
    const bob = caravan.status === 'moving' ? Math.abs(Math.sin(caravan.stepPhase)) * 4 : 0;
    drawGroundShadow(ctx, 0, 18, 28, 9);

    ctx.fillStyle = '#c97a35';
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2.8;
    roundRect(ctx, -22, -6 - bob, 44, 18, 5);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#5c3818';
    ctx.beginPath();
    ctx.arc(-13, 13, 6.5, 0, Math.PI * 2);
    ctx.arc(13, 13, 6.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    const leadSprite = boarSprites['boar_classic'];
    if (leadSprite && leadSprite.complete && leadSprite.naturalWidth > 0) {
      ctx.save();
      ctx.scale(caravan.facing, 1);
      ctx.drawImage(leadSprite, -16, -28 - bob, 32, 32);
      ctx.restore();
    }
  }

  if (caravan.status === 'voyage_prep' && state.voyage) {
    const remMs = Math.max(0, state.voyage.prepStartTimeMs + state.voyage.prepDurationMs - Date.now());
    drawOutlinedText(`⏳ Отплытие через ${formatRealDuration(remMs)}`, 0, 32, 12.5, '#ffe047', 'center', 3.4);
    drawOutlinedText(`(Нажми, если передумал)`, 0, 47, 10.5, '#74ff52', 'center', 2.8);
  } else if (caravan.status === 'voyage_sailing' && state.voyage) {
    const remMs = Math.max(0, state.voyage.sailStartTimeMs + state.voyage.sailDurationMs - Date.now());
    drawOutlinedText(`⛵ В плавании: ${formatRealDuration(remMs)}`, 0, 32, 12.5, '#48dbfb', 'center', 3.4);
    drawOutlinedText(`В другой поход нельзя`, 0, 47, 10.2, '#ff9ff3', 'center', 2.8);
  } else if (caravan.status === 'moving' && caravan.targetX !== null) {
    const remMeters = Math.max(5, Math.round(Math.hypot(caravan.targetX - caravan.x, caravan.targetY - caravan.y) / 8));
    drawOutlinedText(`В пути • ${remMeters} м`, 0, 30, 13, '#ffe047', 'center', 3.2);
  } else if (caravan.status === 'camp' && caravan.campTimer > 0) {
    drawOutlinedText('Привал!', 0, 30, 13, '#a3e635', 'center', 3.2);
  }

  ctx.restore();
}

function getDayPhaseInfo(minutes) {
  const m = ((minutes % 1440) + 1440) % 1440;
  const hh = Math.floor(m / 60);
  const mm = Math.floor(m % 60);
  const timeStr = `${hh.toString().padStart(2, '0')}:${mm.toString().padStart(2, '0')}`;

  if (m >= 300 && m < 450) {
    const t = (m - 300) / 150;
    return { timeStr, label: 'утро', tint: `rgba(255, 185, 110, ${0.2 * Math.sin(t * Math.PI)})`, glowAlpha: 0.45 * (1 - t) };
  }
  if (m >= 450 && m < 1080) {
    return { timeStr, label: 'день', tint: null, glowAlpha: 0 };
  }
  if (m >= 1080 && m < 1230) {
    const t = (m - 1080) / 150;
    return { timeStr, label: 'вечер', tint: `rgba(255, 126, 75, ${0.25 * Math.sin(t * Math.PI)})`, glowAlpha: 0.75 * t };
  }
  return { timeStr, label: 'ночь', tint: 'rgba(20, 32, 62, 0.48)', glowAlpha: 0.9 };
}

function drawSunbeamsAndDriftingClouds(now) {
  if (camera.zoom < 0.25) return;
  const phase = getDayPhaseInfo(state.gameMinutes);

  // 1. Мягкие плывущие облака и их тени на траве
  ctx.save();
  for (let i = 0; i < driftingClouds.length; i++) {
    const cl = driftingClouds[i];
    if (!isRectVisible(cl.x - cl.rx * 2, cl.y - cl.ry * 2, cl.rx * 4, cl.ry * 4, 180)) continue;

    // Тень от облака на земле
    ctx.fillStyle = 'rgba(15, 35, 20, 0.08)';
    ctx.beginPath();
    ctx.ellipse(cl.x + 45, cl.y + 85, cl.rx * 0.95, cl.ry * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Воздушное полупрозрачное облако
    const cg = ctx.createRadialGradient(cl.x - cl.rx * 0.2, cl.y - cl.ry * 0.25, 8, cl.x, cl.y, cl.rx);
    cg.addColorStop(0, 'rgba(255, 255, 255, 0.24)');
    cg.addColorStop(0.6, 'rgba(255, 255, 255, 0.11)');
    cg.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(cl.x, cl.y, cl.rx, cl.ry, 0, 0, Math.PI * 2);
    ctx.ellipse(cl.x + cl.rx * 0.45, cl.y + 8, cl.rx * 0.72, cl.ry * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 2. Тёплые солнечные лучи (God Rays) над усадьбой утром и днём
  if (phase.label === 'день' || phase.label === 'утро') {
    const cx = WORLD.penRect.x - 240;
    const cy = WORLD.penRect.y - 360;
    if (isRectVisible(cx - 200, cy - 200, 1800, 1600, 300)) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let r = 0; r < 4; r++) {
        const sway = Math.sin(now / 1900 + r * 1.4) * 35;
        const rayX = cx + r * 340 + sway;
        const rayGrad = ctx.createLinearGradient(rayX, cy, rayX + 420, cy + 1150);
        rayGrad.addColorStop(0, 'rgba(255, 244, 185, 0.14)');
        rayGrad.addColorStop(0.55, 'rgba(255, 236, 150, 0.06)');
        rayGrad.addColorStop(1, 'rgba(255, 236, 150, 0)');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(rayX, cy);
        ctx.lineTo(rayX + 170, cy);
        ctx.lineTo(rayX + 640, cy + 1150);
        ctx.lineTo(rayX + 360, cy + 1150);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }
}

function drawCloudsAndDayNight(now) {
  drawSunbeamsAndDriftingClouds(now);
  if (fogLayerDirty) rebuildFogCanvas();

  const phase = getDayPhaseInfo(state.gameMinutes);

  if (phase.tint) {
    ctx.save();
    ctx.fillStyle = phase.tint;
    ctx.fillRect(camera.x - 10, camera.y - 10, W / camera.zoom + 20, H / camera.zoom + 20);

    if (phase.glowAlpha > 0.05) {
      ctx.globalCompositeOperation = 'lighter';
      const lightSources = [
        { x: homeWorldX, y: homeWorldY, r: 420 },
        { x: caravan.x, y: caravan.y, r: 240 }
      ];
      for (let i = 0; i < LANDMARKS.length; i++) {
        const lm = LANDMARKS[i];
        if (lm.id !== 'khryakograd' && state.discoveredLandmarks.includes(lm.id)) {
          lightSources.push({
            x: lm.tx * TILE_SIZE + TILE_SIZE / 2,
            y: lm.ty * TILE_SIZE + TILE_SIZE / 2,
            r: 230
          });
        }
      }

      for (let i = 0; i < lightSources.length; i++) {
        const ls = lightSources[i];
        if (!isRectVisible(ls.x - ls.r, ls.y - ls.r, ls.r * 2, ls.r * 2, 100)) continue;
        const grad = ctx.createRadialGradient(ls.x, ls.y, 12, ls.x, ls.y, ls.r);
        grad.addColorStop(0, `rgba(255, 224, 120, ${0.52 * phase.glowAlpha})`);
        grad.addColorStop(0.55, `rgba(255, 196, 85, ${0.22 * phase.glowAlpha})`);
        grad.addColorStop(1, 'rgba(255, 196, 85, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(ls.x, ls.y, ls.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // Рисуем только видимую на экране область облачного покрова
  drawVisibleLayerCropped(fogCanvas);
}

function drawMinimap() {
  const mm = hudLayout.minimap;
  ctx.save();

  ctx.fillStyle = '#1a1a1a';
  roundRect(ctx, mm.x, mm.y + 3, mm.w, mm.h, 12);
  ctx.fill();

  ctx.beginPath();
  roundRect(ctx, mm.x, mm.y, mm.w, mm.h, 12);
  ctx.clip();

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(overviewCanvas, mm.x, mm.y, mm.w, mm.h);
  ctx.drawImage(fogCanvas, mm.x, mm.y, mm.w, mm.h);

  const sx = mm.w / WORLD.w;
  const sy = mm.h / WORLD.h;

  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(mm.x + caravan.x * sx, mm.y + caravan.y * sy, 3.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffe047';
  ctx.beginPath();
  ctx.arc(mm.x + homeWorldX * sx, mm.y + homeWorldY * sy, 3.5, 0, Math.PI * 2);
  ctx.fill();

  const viewW = W / camera.zoom;
  const viewH = H / camera.zoom;
  const vx = mm.x + Math.max(0, camera.x) * sx;
  const vy = mm.y + Math.max(0, camera.y) * sy;
  const vw = Math.min(mm.w - Math.max(0, vx - mm.x), viewW * sx);
  const vh = Math.min(mm.h - Math.max(0, vy - mm.y), viewH * sy);

  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.6;
  ctx.strokeRect(vx, vy, Math.max(5, vw), Math.max(5, vh));
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.4;
  ctx.strokeRect(vx, vy, Math.max(5, vw), Math.max(5, vh));

  ctx.restore();

  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  roundRect(ctx, mm.x, mm.y, mm.w, mm.h, 12);
  ctx.stroke();
}
